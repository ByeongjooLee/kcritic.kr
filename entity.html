<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kcritic</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="kc.css">
</head>
<body>
<main class="wrap" id="root"></main>
<script src="kc.js"></script>
<script>
const T = qs.get("t"), ID = qs.get("id");
// _redirects 의 「/resource/* → 인물」 넘침 규칙이 「/resource/essay/*」보다 먼저 잡혀 글 IRI 가 여기로 온다(2026-11-10 확인) — 글 페이지로 넘긴다
if (T === "person" && /^essay\/[\w.-]+$/.test(ID || "")) globalThis.location?.replace(`/site/essays/${ID.slice(6)}`);
shell({ essay: "essays", person: "people", concept: "concepts", issue: "venues" }[T]);
const root = document.getElementById("root");
const IRI = "https://kcritic.kr/resource/";

db().then(D => {
  const nm = id => D.P.get(id)?.name || id;
  const tally = (list, get) => { const m = new Map(); list.forEach(e => new Set(get(e)).forEach(v => m.set(v, (m.get(v) || 0) + 1))); return [...m].sort((a, b) => b[1] - a[1] || ko(a[0], b[0])); };
  // ex: 개념어 화면에서 이 글의 예시 문장(개념어를 <mark>로 표시)
  const exLine = (ex, term) => ex ? `<p class="exs">${esc(ex).split(esc(term)).join(`<mark>${esc(term)}</mark>`)}</p>` : "";
  // pre: 인물 화면에서 이 글에 그 인물이 나온 문장(제목·서지와 개념어 사이)
  const essayRow = (e, ex, pre) => `<article class="row"><div class="yr num">${e.year}</div><div>
      <h4><a href="${href.essay(e.id)}">${esc(e.title)}</a></h4>
      <div class="meta"><a href="${href.person(e.critic)}"><span class="dot t-critic"></span> ${esc(e.critic_name)}</a><span>${venueLine(e)}</span></div>${pre || ""}
      <div class="tags">${e.concepts.slice(0, 5).map(c => `<a href="${href.concept(c)}">${esc(c)}</a>`).join("")}</div>${ex || ""}</div><div class="side"></div></article>`;
  const rows = (list, lim = 12, exFn = () => "", preFn = () => "") => {
    const s = [...list].sort((a, b) => ko(a.year, b.year)), row = e => essayRow(e, exFn(e), preFn(e));
    return `<div class="rows">${s.slice(0, lim).map(row).join("")}</div>` + (s.length > lim ? `<details><summary class="btn morebtn" style="width:max-content">${s.length - lim}편 더 보기</summary><div class="rows">${s.slice(lim).map(row).join("")}</div></details>` : "");
  };
  const chips = (ids, cls, hrefFn, nameFn) => `<div class="chips">${ids.map(([id, n]) => `<a class="chip ${cls}" href="${hrefFn(id)}"><span class="dot ${cls}"></span>${esc(nameFn(id))}${n > 1 ? ` <small class="num">${n}</small>` : ""}</a>`).join("")}</div>`;
  const tabs = (defs) => {   // [{k,label,n,html}]
    const on = defs.find(d => d.k === location.hash.slice(1)) || defs[0];
    return `<div class="tabs" id="etabs">${defs.map(d => `<button data-k="${d.k}" class="${d === on ? "on" : ""}">${d.label}${d.n != null ? ` <small class="num">${fmt(d.n)}</small>` : ""}</button>`).join("")}</div>` +
      defs.map(d => `<div class="tabpanel" data-k="${d.k}" style="padding-top:22px"${d === on ? "" : " hidden"}>${d.html}</div>`).join("");
  };
  const wireTabs = () => document.querySelectorAll("#etabs button").forEach(b => b.onclick = () => {
    document.querySelectorAll("#etabs button").forEach(x => x.classList.toggle("on", x === b));
    document.querySelectorAll(".tabpanel").forEach(p => p.hidden = p.dataset.k !== b.dataset.k);
    history.replaceState(null, "", "#" + b.dataset.k);
  });
  const kv = items => `<div class="kv" style="grid-template-columns:repeat(${items.length},1fr)">${items.map(([n, l]) => `<div><b class="num">${n}</b><span>${l}</span></div>`).join("")}</div>`;
  const lodLinks = p => p?.lod?.length ? `<div class="lod">${p.lod.map(b => `<a href="${b.href}" target="_blank" rel="noopener">${esc(lodName(b))} ↗</a>`).join("")}</div>` : "";

  // ── 인물 ──
  if (T === "person") {
    const p = D.P.get(ID);
    if (!p) return root.innerHTML = `<div class="empty">인물을 찾을 수 없습니다.</div>`;
    document.title = `${p.name} — kcritic`;
    const wrote = D.essays.filter(e => e.critic === ID), about = D.essays.filter(e => e.subjects.includes(ID)), cites = D.essays.filter(e => e.theorists.includes(ID));
    const role = mainRole(p), oldDir = { critic: "critics", writer: "writers", theorist: "thinkers" }[role];
    const defs = [];
    if (wrote.length) defs.push({ k: "wrote", label: "쓴 글", n: wrote.length, html: `
      <div class="panel" style="margin-bottom:22px"><h5>연도별 <span>${wrote.length}편</span></h5>${histSVG(wrote.map(e => +e.year), { h: 80 })}</div>
      <div class="dash" style="margin-bottom:24px">
        <div class="panel"><h5>가장 많이 다룬 작가</h5>${hbars(tally(wrote, e => e.subjects).slice(0, 10).map(([k, v]) => ({ label: nm(k), v, href: href.person(k), cls: "t-writer" })))}</div>
        <div class="panel"><h5>가장 많이 인용한 이론가</h5>${hbars(tally(wrote, e => e.theorists).slice(0, 10).map(([k, v]) => ({ label: nm(k), v, href: href.person(k), cls: "t-theorist" })))}</div>
        <div class="panel wide"><h5>자주 쓴 개념어</h5>${chips(tally(wrote, e => e.concepts).slice(0, 24), "t-concept", href.concept, x => x)}</div>
      </div>${rows(wrote)}` });
    if (about.length) defs.push({ k: "about", label: "이 작가를 다룬 비평", n: about.length, html: `
      <div class="dash" style="margin-bottom:24px">
        <div class="panel"><h5>연도별</h5>${histSVG(about.map(e => +e.year), { h: 80 })}</div>
        <div class="panel"><h5>다룬 비평가</h5>${hbars(tally(about, e => [e.critic]).slice(0, 8).map(([k, v]) => ({ label: nm(k), v, href: href.person(k), cls: "t-critic" })))}</div>
        <div class="panel wide"><h5>이 작가를 논할 때 쓰인 개념어</h5>${chips(tally(about, e => e.concepts).slice(0, 20), "t-concept", href.concept, x => x)}</div>
      </div><div id="prows-about">${rows(about)}</div>` });
    if (cites.length) defs.push({ k: "cited", label: "이 이론가를 인용한 비평", n: cites.length, html: `
      <div class="dash" style="margin-bottom:24px">
        <div class="panel"><h5>연도별</h5>${histSVG(cites.map(e => +e.year), { h: 80 })}</div>
        <div class="panel"><h5>인용한 비평가</h5>${hbars(tally(cites, e => [e.critic]).slice(0, 8).map(([k, v]) => ({ label: nm(k), v, href: href.person(k), cls: "t-critic" })))}</div>
        <div class="panel wide"><h5>함께 다뤄진 작가</h5>${chips(tally(cites, e => e.subjects).slice(0, 20), "t-writer", href.person, nm)}</div>
      </div><div id="prows-cited">${rows(cites)}</div>` });
    root.innerHTML = `
      <div class="ent-head">
        <div class="crumb"><a href="explore.html?p=people">인물</a><span>/</span><span>${esc(p.name)}</span></div>
        <div class="chips">${p.wrote ? `<span class="pill t-critic"><span class="dot t-critic"></span>비평가</span>` : ""}${p.discussed ? `<span class="pill t-writer"><span class="dot t-writer"></span>비평 대상 작가</span>` : ""}${p.cited ? `<span class="pill t-theorist"><span class="dot t-theorist"></span>인용 이론가</span>` : ""}</div>
        <h1>${esc(p.name)}${p.en ? `<small>${esc(p.en)}</small>` : ""}</h1>
        
        ${lodLinks(p)}
      </div>
      <div class="ent"><div>${kv([[p.wrote, "쓴 글"], [p.discussed, "다뤄진 글"], [p.cited, "인용된 글"]].filter(x => x[0]).concat([[p.from ? `${p.from}–${p.to}` : "–", "등장 연도"]]))}${tabs(defs)}</div>
        <aside class="aside">
          <div class="panel"><h5>기본 정보</h5><dl><dt>식별자</dt><dd class="num">${esc(p.id)}</dd><dt>대표 역할</dt><dd>${TYPE[role].label}</dd><dt>외부 전거</dt><dd>${p.lod.length ? p.lod.map(b => esc(lodName(b))).join(", ") : "연결 없음"}</dd></dl></div>
          <div class="panel"><h5>더 보기</h5><dl>
            <dt>관계망</dt><dd><a href="${KC}graph.html#${encodeURIComponent(p.id)}">이 인물 중심으로</a></dd>
            <dt>기존 페이지</dt><dd><a href="${KC}site/${oldDir}/${encodeURIComponent(p.id)}.html">현행 프로필</a></dd>
            <dt>IRI</dt><dd style="word-break:break-all;font-size:12px">${IRI}${esc(p.id)}</dd></dl></div>
        </aside></div>`;
    wireTabs();
    // 인용 문맥: 다룬·인용한 비평 목록의 글마다 이 인물이 나온 문장을 제목·서지와 개념어 사이에 넣는다(이 화면에서만 따로 읽음)
    if (about.length || cites.length) fetch("site/data/v2/contexts.json").then(r => r.json()).then(C => {
      const by = {};
      (C[ID] || []).forEach(([eid, s]) => (by[eid] ||= []).push(s));
      const mk = s => esc(s).split(esc(p.name)).join(`<mark>${esc(p.name)}</mark>`);
      const pre = e => { const L = by[e.id]; if (!L) return "";
        return `<div class="cxs"><p>${mk(L[0])}</p>${L.length > 1 ? `<details><summary>이 글에서 ${L.length - 1}곳 더</summary>${L.slice(1).map(x => `<p>${mk(x)}</p>`).join("")}</details>` : ""}</div>`; };
      [["prows-about", about], ["prows-cited", cites]].forEach(([id, list]) => { const el = document.getElementById(id); if (el) el.innerHTML = rows(list, 12, () => "", pre); });
    }).catch(() => {});
  }

  // ── 『창작과비평』 글 (검수 통과 해제, 2026-11-10) — 『문학과사회』 글 화면과 같은 틀. 본문 대신 해제·요지·주장, 원문은 창비 웹진으로
  if (T === "essay" && /^cb\d+$/.test(ID || "")) {
    root.innerHTML = `<p class="note">글을 불러오는 중…</p>`;
    // 해제는 그 호 파일(cb_sum/<호 id>.json, build_changbi_search.py)만 읽는다 — 전체 changbi_summaries.json(1MB) 대신(2026-11-10).
    // 호 id 는 essays.json 에서, 관계망에 없는 글(필자 보류 19편)은 cb_search.json 에서 찾는다
    const ce = D.E.get(ID);
    (ce ? Promise.resolve("cb" + String(ce.issue).padStart(3, "0")) : load("cb_search").then(rows => (rows.find(r => String(r[0]) === ID.slice(2)) || [])[1]))
      .then(iid => iid ? load(`cb_sum/${iid}`) : {}).then(summaries => {
      // 해제(cb_sum) + 관계(essays.json 컬렉션 cb — publish_cb.py 가 해제의 필자·인물·키워드를 옮긴 메타데이터 XML 에서 build)
      const entry = summaries[ID.slice(2)], e = D.E.get(ID);
      if (!entry) return root.innerHTML = `<div class="empty">글을 찾을 수 없습니다.</div>`;
      document.title = `${entry.t} — kcritic`;
      const issueNo = e ? e.issue : +(entry.l.match(/(\d+)호/) || [0, 0])[1], issueId = "cb" + String(issueNo).padStart(3, "0");
      const section = e?.section || "", year = e?.year || entry.y, web = CB.item(ID.slice(2));
      const subs = e?.subjects || [], ths = e?.theorists || [], cons = e?.concepts || entry.kw;
      const share = e ? D.essays.filter(x => x.id !== ID).map(x => ({ x, s: x.concepts.filter(c => cons.includes(c)) })).filter(o => o.s.length).sort((a, b) => b.s.length - a.s.length || ko(b.x.year, a.x.year)).slice(0, 8) : [];
      const sameIssue = D.essays.filter(x => x.coll === "cb" && x.issue === issueNo && x.id !== ID);
      const who = e ? `<a href="${href.person(e.critic)}"><span class="dot t-critic"></span> <b style="color:var(--ink)">${esc(entry.a)}</b></a>` : `<span><span class="dot t-critic"></span> <b style="color:var(--ink)">${esc(entry.a)}</b></span>`;
      root.innerHTML = `
      <div class="ent-head">
        <div class="crumb"><a href="explore.html?p=essays">글</a><span>/</span><a href="explore.html?p=essays&coll=cb">『창작과비평』</a><span>/</span><a href="${href.issue(issueId)}">${issueNo}호</a></div>
        <span class="pill t-essay"><span class="dot t-essay"></span>글</span>
        <h1>${esc(entry.t)}</h1>
        <div class="ent-sub">${who}<span class="num">${year}</span>
          <span>《창작과비평》 ${issueNo}호${section ? " · " + esc(section) : ""}</span></div>
      </div>
      <div class="ent"><div>
        ${kv([[subs.length, "다룬 작가"], [ths.length, "인용 이론가"], [cons.length, "개념어"]])}
        <div class="block"><h3>요지</h3><p style="font-size:17px;font-weight:600;line-height:1.6;margin:0">${esc(entry.s)}</p></div>
        <div class="block"><h3>해제</h3><p style="line-height:1.8;margin:0">${esc(entry.h)}</p></div>
        ${e ? `<div class="block"><h3><span class="dot t-writer"></span>다룬 작가 <span>${subs.length}</span></h3>${subs.length ? chips(subs.map(i => [i, 1]), "t-writer", href.person, nm) : `<p class="note">특정 작가를 다루지 않은 글입니다.</p>`}</div>
        <div class="block"><h3><span class="dot t-theorist"></span>인용 이론가 <span>${ths.length}</span></h3>${ths.length ? chips(ths.map(i => [i, 1]), "t-theorist", href.person, nm) : `<p class="note">없음</p>`}</div>` : ""}
        <div class="block"><h3><span class="dot t-concept"></span>개념어 <span>${cons.length}</span></h3>${chips(cons.map(c => [c, 1]), "t-concept", href.concept, x => x)}</div>
        <div class="block"><h3>주장·근거 구조 <span>${entry.c.length}</span></h3>
          <div class="rows">${entry.c.map(claim => `<article class="row"><div class="yr">${esc(claim[1])}</div><div><p style="margin:0;line-height:1.7">${esc(claim[0])}</p></div><div class="side"></div></article>`).join("")}</div></div>
        <div class="block"><h3>개념어를 공유하는 글</h3>${share.length ? `<div class="rows">${share.map(o => `<article class="row"><div class="yr num">${o.x.year}</div><div><h4><a href="${href.essay(o.x.id)}">${esc(o.x.title)}</a></h4><div class="meta"><span>${esc(o.x.critic_name)}</span><span>${venueLine(o.x)}</span></div><div class="tags">${o.s.map(c => `<a class="hl" href="${href.concept(c)}">${esc(c)}</a>`).join("")}</div></div><div class="side">공유 ${o.s.length}</div></article>`).join("")}</div>` : `<p class="note">공유하는 글이 없습니다.</p>`}</div>
        ${sameIssue.length ? `<div class="block"><h3>같은 호에 실린 비평 <span>${sameIssue.length}</span></h3><div class="rows">${sameIssue.map(x => essayRow(x)).join("")}</div></div>` : ""}
      </div>
      <aside class="aside">
        <div class="panel"><h5>서지</h5><dl><dt>비평가</dt><dd>${e ? `<a href="${href.person(e.critic)}">${esc(entry.a)}</a>` : esc(entry.a)}</dd><dt>연도</dt><dd class="num">${year}</dd>
          <dt>지면</dt><dd><a href="${href.issue(issueId)}">《창작과비평》 ${issueNo}호</a><div class="note">${esc(entry.l)}</div></dd>${section ? `<dt>난</dt><dd>${esc(section)}</dd>` : ""}<dt>컬렉션</dt><dd>『창작과비평』</dd>
          <dt>원문 정보</dt><dd><a href="${web}" target="_blank" rel="noopener">창비 웹진의 이 기사 ↗</a></dd></dl></div>
        <div class="panel"><h5>더 보기</h5><dl>${e ? `<dt>관계망</dt><dd><a href="${KC}graph.html#${encodeURIComponent(ID)}">이 글 중심으로</a></dd>` : ""}<dt>IRI</dt><dd style="word-break:break-all;font-size:12px">${IRI}essay/${esc(ID)}</dd></dl>
          <p class="note" style="margin-top:10px">해제·요지·주장은 AI 보조로 작성하고 본문과 끝까지 대조해 검수를 통과한 요약이며 원문이 아닙니다. 서평은 소개하는 책의 논지와 평자의 평가를 함께 요약했습니다. ${e ? "다룬 작가·인용 이론가·개념어는 해제 작업의 인물·키워드에서 자동으로 옮겼습니다(인물 유형·동일인 판정 자동)." : "이 글의 필자는 동명이인 확인 중이라 관계망에 넣지 않았습니다."}</p>
          <p class="note" style="margin-top:10px">원문은 저작권에 따라 제공하지 않습니다. 원문은 발행처에서 확인할 수 있습니다.</p>
          <a class="btn btn-block" style="margin-top:10px" href="${web}" target="_blank" rel="noopener">원문 정보 ↗<small>창비 웹진 『창작과비평』</small></a></div>
      </aside></div>`;
    }).catch(() => { root.innerHTML = `<div class="empty">글을 불러오지 못했습니다.</div>`; });
    return;
  }

  // ── 글 ──
  if (T === "essay") {
    const e = D.E.get(ID);
    if (!e) return root.innerHTML = `<div class="empty">글을 찾을 수 없습니다.</div>`;
    document.title = `${e.title} — kcritic`;
    const share = D.essays.filter(x => x.id !== e.id).map(x => ({ x, s: x.concepts.filter(c => e.concepts.includes(c)) })).filter(o => o.s.length).sort((a, b) => b.s.length - a.s.length || ko(a.x.year, b.x.year)).slice(0, 8);
    const sameIssue = e.coll === "mhs" ? D.essays.filter(x => x.coll === "mhs" && x.issue === e.issue && x.id !== e.id) : [];
    const issueId = e.issue ? String(e.issue).padStart(3, "0") : "";
    root.innerHTML = `
      <div class="ent-head">
        <div class="crumb"><a href="explore.html?p=essays">글</a><span>/</span><a href="explore.html?p=essays&coll=${e.coll}">${esc(e.coll_name)}</a>${e.coll === "mhs" ? `<span>/</span><a href="${href.issue(issueId)}">${e.issue}호</a>` : ""}</div>
        <span class="pill t-essay"><span class="dot t-essay"></span>글</span>
        <h1>${esc(e.title)}</h1>
        <div class="ent-sub"><a href="${href.person(e.critic)}"><span class="dot t-critic"></span> <b style="color:var(--ink)">${esc(e.critic_name)}</b></a><span class="num">${e.year}</span>
          <span>${e.coll === "mhs" ? `《문학과사회》 ${e.issue}호 · ${esc(e.pages)}면${e.section ? " · " + esc(e.section) : ""}` : esc(e.venue)}</span></div>
      </div>
      <div class="ent"><div>
        ${kv([[e.subjects.length, "다룬 작가"], [e.theorists.length, "인용 이론가"], [e.concepts.length, "개념어"]])}
        ${e.coll === "mhs" ? `<div id="mhs-sum"></div>` : ""}
        <div class="block"><h3><span class="dot t-writer"></span>다룬 작가 <span>${e.subjects.length}</span></h3>${e.subjects.length ? chips(e.subjects.map(i => [i, 1]), "t-writer", href.person, nm) : `<p class="note">특정 작가를 다루지 않은 글입니다.</p>`}</div>
        <div class="block"><h3><span class="dot t-theorist"></span>인용 이론가 <span>${e.theorists.length}</span></h3>${e.theorists.length ? chips(e.theorists.map(i => [i, 1]), "t-theorist", href.person, nm) : `<p class="note">없음</p>`}</div>
        <div class="block"><h3><span class="dot t-concept"></span>개념어 <span>${e.concepts.length}</span></h3>${chips(e.concepts.map(c => [c, 1]), "t-concept", href.concept, x => x)}</div>
        ${e.coll === "mhs" ? `<div id="mhs-claims"></div>` : ""}
        <div class="block"><h3>개념어를 공유하는 글</h3>${share.length ? `<div class="rows">${share.map(o => `<article class="row"><div class="yr num">${o.x.year}</div><div><h4><a href="${href.essay(o.x.id)}">${esc(o.x.title)}</a></h4><div class="meta"><span>${esc(o.x.critic_name)}</span></div><div class="tags">${o.s.map(c => `<a class="hl" href="${href.concept(c)}">${esc(c)}</a>`).join("")}</div></div><div class="side">공유 ${o.s.length}</div></article>`).join("")}</div>` : `<p class="note">공유하는 글이 없습니다.</p>`}</div>
        ${sameIssue.length ? `<div class="block"><h3>같은 호에 실린 비평 <span>${sameIssue.length}</span></h3><div class="rows">${sameIssue.map(e => essayRow(e)).join("")}</div></div>` : ""}
      </div>
      <aside class="aside">
        <div class="panel"><h5>서지</h5><dl><dt>비평가</dt><dd><a href="${href.person(e.critic)}">${esc(e.critic_name)}</a></dd><dt>연도</dt><dd class="num">${e.year}</dd>
          <dt>지면</dt><dd>${e.coll === "mhs" ? `<a href="${href.issue(issueId)}">《문학과사회》 ${e.issue}호</a>, ${esc(e.pages)}면<div class="note">권별 연속 쪽수 (한 해 한 권, 네 호가 쪽을 이어 매김)</div>` : esc(e.venue)}</dd>${e.section ? `<dt>난</dt><dd>${esc(e.section)}</dd>` : ""}<dt>컬렉션</dt><dd>${esc(e.coll_name)}</dd>${VENUE_LINK[e.coll] ? `<dt>원문 정보</dt><dd><a href="${VENUE_LINK[e.coll].url}" target="_blank" rel="noopener">${esc(VENUE_LINK[e.coll].label)} ↗</a></dd>` : ""}</dl></div>
        <div class="panel"><h5>더 보기</h5><dl><dt>관계망</dt><dd><a href="${KC}graph.html#${encodeURIComponent(e.id)}">이 글 중심으로</a></dd>
          <dt>기존 페이지</dt><dd><a href="${KC}site/essays/${encodeURIComponent(e.id)}.html">현행 메타데이터</a></dd><dt>IRI</dt><dd style="word-break:break-all;font-size:12px">${IRI}essay/${esc(e.id)}</dd></dl>
          <p class="note" style="margin-top:10px">원문은 저작권에 따라 제공하지 않습니다.${VENUE_LINK[e.coll] ? ` 원문은 발행처에서 확인할 수 있습니다.` : ""}</p>
          ${VENUE_LINK[e.coll] ? `<a class="btn btn-block" style="margin-top:10px" href="${VENUE_LINK[e.coll].url}" target="_blank" rel="noopener">원문 정보 ↗<small>${esc(VENUE_LINK[e.coll].label)}</small></a>` : ""}
          ${e.coll === "mhs" ? `<p class="note" id="mhs-sum-note" style="margin-top:10px" hidden>요지·해제·주장은 이 글의 TEI 구조화 요약(전문을 읽고 인코딩한 3인칭 요약)을 바탕으로 AI 보조로 『창작과비평』 해제와 같은 형식으로 다시 쓴 것이며 원문이 아닙니다.</p>` : ""}</div>
      </aside></div>`;
    // 『문학과사회』: 창비 글 화면과 같은 요지·해제·주장·근거 구조 — 그 호 파일(mhs_sum/<호>.json, build_mhs_summaries.py)만 읽는다(2026-11-14)
    if (e.coll === "mhs" && issueId) load(`mhs_sum/${issueId}`).then(m => {
      const x = m[e.id], box = document.getElementById("mhs-sum"), cl = document.getElementById("mhs-claims");
      if (!x || !box) return;
      box.innerHTML = `<div class="block"><h3>요지</h3><p style="font-size:17px;font-weight:600;line-height:1.6;margin:0">${esc(x.s)}</p></div>
        <div class="block"><h3>해제</h3><p style="line-height:1.8;margin:0">${esc(x.h)}</p></div>`;
      if (cl && x.c.length) cl.innerHTML = `<div class="block"><h3>주장·근거 구조 <span>${x.c.length}</span></h3>
        <div class="rows">${x.c.map(claim => `<article class="row"><div class="yr">${esc(claim[1])}</div><div><p style="margin:0;line-height:1.7">${esc(claim[0])}</p></div><div class="side"></div></article>`).join("")}</div></div>`;
      const note = document.getElementById("mhs-sum-note"); if (note) note.hidden = false;
    }).catch(() => {});
  }

  // ── 개념어 ──
  if (T === "concept") {
    const es = D.essays.filter(e => e.concepts.includes(ID));
    if (!es.length) return root.innerHTML = `<div class="empty">개념어를 찾을 수 없습니다.</div>`;
    document.title = `${ID} — kcritic`;
    const ys = es.map(e => +e.year), co = tally(es, e => e.concepts.filter(c => c !== ID)).slice(0, 24);
    root.innerHTML = `
      <div class="ent-head"><div class="crumb"><a href="explore.html?p=concepts">개념어</a><span>/</span><span>${esc(ID)}</span></div>
        <span class="pill t-concept"><span class="dot t-concept"></span>개념어</span><h1>${esc(ID)}</h1>
        <div class="ent-sub num">${Math.min(...ys)}년에 처음, ${Math.max(...ys)}년에 마지막으로 쓰임</div></div>
      <div class="ent"><div>
        ${kv([[es.length, "글"], [new Set(es.map(e => e.critic)).size, "비평가"], [new Set(es.map(e => e.coll)).size, "컬렉션"]])}
        <div class="panel" style="margin-bottom:24px"><h5>연도별 사용</h5>${histSVG(ys, { h: 90 })}</div>
        <div class="dash" style="margin-bottom:24px">
          <div class="panel"><h5>이 개념어를 쓴 비평가</h5>${hbars(tally(es, e => [e.critic]).slice(0, 10).map(([k, v]) => ({ label: nm(k), v, href: href.person(k), cls: "t-critic" })))}</div>
          <div class="panel"><h5>함께 다뤄진 작가</h5>${hbars(tally(es, e => e.subjects).slice(0, 10).map(([k, v]) => ({ label: nm(k), v, href: href.person(k), cls: "t-writer" })))}</div>
          <div class="panel wide"><h5>함께 쓰인 개념어</h5>${chips(co, "t-concept", href.concept, x => x)}</div>
        </div>
        <div class="block" id="cessays"><h3>이 개념어를 쓴 글 <span>${es.length}</span></h3><p class="note" style="margin:-4px 0 6px">글마다 이 개념어가 쓰인 문장 하나를 예시로 보입니다(연구용 인용 · 원문 전체는 제공하지 않습니다).</p><div id="crows">${rows(es, 20)}</div></div>
      </div>
      <aside class="aside"><div class="panel"><h5>어휘 통제</h5><p class="note">같은 개념을 다르게 적은 표기는 하나로 맞춰 집계합니다(통제어휘). 표기 차이로 갈린 개념이 보이면 알려 주세요.</p></div>
        <div class="panel"><h5>RDF</h5><p class="note">글의 <code>dcterms:subject</code> 리터럴로 발행됩니다. 질문하기의 SPARQL 탭에서 조회할 수 있습니다.</p></div></aside></div>`;
    // 예시 문장은 이 화면에서만 따로 읽는다(목록 화면이 무거워지지 않게)
    fetch("site/data/v2/examples.json").then(r => r.json()).then(X => {
      document.getElementById("crows").innerHTML = rows(es, 20, () => "", e => exLine(X[e.id]?.[ID], ID));
    }).catch(() => {});
  }

  // ── 호 ──
  // 『창작과비평』 호 — 목차만(항목은 이 화면에서만 issues_cb_items.json 을 읽는다), 기사는 창비 웹진으로 연결
  if (T === "issue" && /^cb\d+$/.test(ID || "")) {
    const i = D.cb.find(x => x.id === ID);
    if (!i) return root.innerHTML = `<div class="empty">호를 찾을 수 없습니다.</div>`;
    document.title = `『${CB.name}』 ${cbNo(i)} — kcritic`;
    const k = D.cb.indexOf(i), prev = D.cb[k - 1], next = D.cb[k + 1];
    root.innerHTML = `
      <div class="ent-head"><div class="crumb"><a href="explore.html?p=venues&mag=cb">지면</a><span>/</span><span>『${CB.name}』</span><span>/</span><span>${cbNo(i)}</span></div>
        <span class="pill t-venue"><span class="dot t-venue"></span>잡지 호</span><h1>『${CB.name}』 ${cbNo(i)} <small>${i.year}년 ${esc(i.season)}</small></h1>
        <div class="ent-sub">${CB.pub} · <a href="${CB.list(i.list)}" target="_blank" rel="noopener">창비 웹진의 이 호 ↗</a> · ${prev ? `<a href="${href.issue(prev.id)}">← ${cbNo(prev)}</a>` : ""} ${next ? `<a href="${href.issue(next.id)}">${cbNo(next)} →</a>` : ""}</div></div>
      <div class="ent"><div>
        ${kv([[i.n, "목차 항목"], [i.n_crit, "비평·논문·산문"], [i.n - i.n_crit, "시·소설·희곡 등 창작"]])}
        <div class="block"><h3>목차</h3>
          <p class="note" style="margin:-4px 0 10px">창비 웹진의 호별 목차를 옮긴 것입니다(웹진에 실린 순서). 웹진 목차에 쪽수가 없어 쪽수는 싣지 않았습니다. 검수된 해제가 있는 글은 이 사이트의 글 화면으로, 나머지는 창비 웹진의 그 기사로 갑니다. 이 사이트는 『창작과비평』의 본문을 싣지 않습니다.</p>
          <div class="rows" id="cbrows"><p class="note">목차를 불러오는 중…</p></div></div>
      </div>
      <aside class="aside"><div class="panel"><h5>목차와 검수된 해제</h5><p class="note">검수를 통과한 일부 글에 해제·요지·주장을 제공합니다. AI 보조로 작성하고 본문과 대조한 요약이며 원문이 아닙니다. 번역·무기명·복수 저자 및 저작자 확인이 필요한 글은 공개를 보류합니다. 해제가 있는 글은 필자·인물·키워드를 관계망에 넣었습니다(자동 판정).</p></div></aside></div>`;
    // 목차 행: 검수 해제가 있는 글은 이 사이트의 글 화면(entity.html?t=essay&id=cb<Item>)으로 — 『문학과사회』 호 화면처럼 굵게·「해제」, 나머지는 창비 웹진
    Promise.all([load("issues_cb_items"), load(`cb_sum/${ID}`).catch(() => ({}))]).then(([X, summaries]) => {   // 이 호의 해제만(해제 없는 호는 파일 없음)
      document.getElementById("cbrows").innerHTML = (X[ID] || []).map(x => { const s = summaries[String(x.i)];
        return `<article class="row"${s ? "" : ' style="color:var(--faint)"'}>
          <div class="yr num">${x.s}</div><div><h4 style="font-weight:${s ? 600 : 500}">${s ? `<a href="${href.essay(`cb${x.i}`)}">${esc(x.t)}</a>` : `<a href="${CB.item(x.i)}" target="_blank" rel="noopener">${esc(x.t)}</a>`}</h4>
          <div class="meta"><span>${esc(x.a)}</span><span>${esc(x.sec)}</span></div></div>
          <div class="side"><span class="pill${s ? " t-essay" : ""}">${s ? "해제" : x.c ? "창작" : "비평·산문"}</span></div></article>`; }).join("") || `<p class="note">목차 항목이 없습니다.</p>`;
      const n = (X[ID] || []).filter(x => summaries[String(x.i)]).length;
      const kvN = document.querySelector(".kv"); if (kvN && n) kvN.insertAdjacentHTML("beforeend", `<div><b class="num">${n}</b><span>검수된 해제</span></div>`), kvN.style.gridTemplateColumns = "repeat(4,1fr)";
    }).catch(() => { document.getElementById("cbrows").innerHTML = `<p class="note">목차를 불러오지 못했습니다.</p>`; });
    return;
  }
  if (T === "issue") {
    const i = D.issues.find(x => x.id === ID);
    if (!i) return root.innerHTML = `<div class="empty">호를 찾을 수 없습니다.</div>`;
    document.title = `『문학과사회』 ${i.no}호 — kcritic`;
    const k = D.issues.indexOf(i), prev = D.issues[k - 1], next = D.issues[k + 1];
    const es = D.essays.filter(e => e.coll === "mhs" && e.issue === i.no);
    root.innerHTML = `
      <div class="ent-head"><div class="crumb"><a href="explore.html?p=venues">지면</a><span>/</span><span>『문학과사회』</span><span>/</span><span>${i.no}호</span></div>
        <span class="pill t-venue"><span class="dot t-venue"></span>잡지 호</span><h1>『문학과사회』 ${i.no}호 <small>${i.year}년 ${i.season}</small></h1>
        <div class="ent-sub">문학과지성사 · <a href="${VENUE_LINK.mhs.url}" target="_blank" rel="noopener">원문 정보 ↗</a> · ${prev ? `<a href="${href.issue(prev.id)}">← ${prev.no}호</a>` : ""} ${next ? `<a href="${href.issue(next.id)}">${next.no}호 →</a>` : ""}</div></div>
      <div class="ent"><div>
        ${kv([[i.n_public, "공개한 비평"], [i.items.length, "목차의 비평·좌담·심사평"], [Math.round(100 * i.n_public / Math.max(1, i.items.length)) + "%", "인코딩 공개율"]])}
        <div class="block"><h3>목차</h3>
          <p class="note" style="margin:-4px 0 10px">쪽수는 인쇄된 쪽 번호 그대로입니다. 1988~1991년 『문학과사회』는 한 해를 한 권으로 묶고(판권: 「1988년 여름호 · 제Ⅰ권 제2호」), 그 권의 네 호가 쪽 번호를 이어 매겼습니다. 그래서 봄호는 1쪽부터, 여름호는 400쪽대, 가을호는 800~900쪽대, 겨울호는 1200쪽대부터 시작합니다. 목차에는 비평·좌담·심사평만 실어서, 첫 글의 쪽수가 호의 첫 쪽보다 뒤입니다.</p><div class="rows">${i.items.map(x => `<article class="row"${x.stem ? "" : ' style="color:var(--faint)"'}>
          <div class="yr num">${esc(x.pages)}</div><div><h4 style="font-weight:${x.stem ? 600 : 500}">${x.stem ? `<a href="${href.essay(x.stem)}">${esc(x.title)}</a>` : esc(x.title)}</h4>
          <div class="meta"><span>${esc(x.author)}</span><span>${esc(x.section)}</span></div></div>
          <div class="side"><span class="pill${x.stem ? " t-essay" : ""}"${x.stem ? ` data-stem="${esc(x.stem)}"` : ""}>${esc(x.state)}</span></div></article>`).join("")}</div></div>
      </div>
      <aside class="aside">${es.length ? `<div class="panel t-concept"><h5>이 호의 개념어</h5>${chips(tally(es, e => e.concepts).slice(0, 18), "t-concept", href.concept, x => x)}</div>
        <div class="panel"><h5>이 호에서 다뤄진 작가</h5>${hbars(tally(es, e => e.subjects).slice(0, 8).map(([k, v]) => ({ label: nm(k), v, href: href.person(k), cls: "t-writer" })))}</div>` : `<div class="panel"><p class="note">아직 공개한 글이 없습니다.</p></div>`}</aside></div>`;
    // 요지·해제·주장이 있는 글은 창비 호 화면처럼 「해제」로 표시(그 호의 mhs_sum 만 읽음, 2026-11-14)
    if (es.length) load(`mhs_sum/${ID}`).then(m => document.querySelectorAll(".pill[data-stem]").forEach(p => { if (m[p.dataset.stem]) p.textContent = "해제"; })).catch(() => {});
  }
});
</script>
</body>
</html>
