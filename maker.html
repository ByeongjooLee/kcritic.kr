<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>만든 사람 — kcritic</title>
  <meta name="description" content="한국 비평사 온톨로지(kcritic.kr)를 만든 연구자와 관련 논문, 인용 방법">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="kc.css">
  <style>
    .mk { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 40px; padding: 8px 0 56px; align-items: start; }
    .mk h2 { font-size: 20px; letter-spacing: -.02em; margin: 36px 0 12px; }
    .mk h2:first-child { margin-top: 0; }
    .mk p { color: var(--ink); line-height: 1.8; }
    .mk .muted { color: var(--muted); }
    .who { display: flex; gap: 18px; align-items: center; padding: 22px 0 26px; border-bottom: 1px solid var(--line); }
    .who .ini { width: 64px; height: 64px; flex: none; border-radius: 50%; background: var(--panel-2); display: grid; place-items: center; font-size: 24px; font-weight: 700; color: var(--muted); }
    .who b { font-size: 22px; letter-spacing: -.02em; display: block; }
    .who span { color: var(--muted); font-size: 14px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .pubs { list-style: none; border-top: 1px solid var(--line); }
    .pubs li { padding: 14px 0; border-bottom: 1px solid var(--line); line-height: 1.65; }
    .pubs li .t { font-weight: 600; }
    .pubs li .s { color: var(--muted); font-size: 14px; }
    .pubs li .pill { margin-left: 6px; vertical-align: 1px; }
    .cite { background: var(--panel); border-radius: var(--r); padding: 16px 18px; font-size: 14px; line-height: 1.75; overflow-wrap: anywhere; }
    .cite + .cite { margin-top: 10px; }
    .cite small { display: block; color: var(--faint); font-size: 12px; margin-bottom: 4px; }
    .side .panel { padding: 16px 18px; }
    .side .panel + .panel { margin-top: 12px; }
    .side a.ln { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
    .side a.ln:last-child { border-bottom: 0; }
    .side a.ln:hover { color: var(--accent); }
    .side a.ln small { color: var(--faint); }
    @media (max-width: 900px) { .mk { grid-template-columns: 1fr; gap: 24px; } }
  </style>
</head>
<body>
<main class="wrap">
  <div class="ent-head">
    <nav class="crumb"><a href="index.html">처음</a> / <a href="about.html">소개</a> / 만든 사람</nav>
    <h1>만든 사람</h1>
  </div>
  <p class="muted" style="margin:24px 0;font-size:16px">이 화면은 잠시 가려 두었습니다. 사이트 소개는 <a class="link" href="about.html">소개 · 방법</a>에, 자료의 출처와 이용 조건은 <a class="link" href="data.html">데이터와 출처</a>에 있습니다.</p>
</main>
<script src="kc.js"></script>
<script>shell("");</script>
</body>
</html>
