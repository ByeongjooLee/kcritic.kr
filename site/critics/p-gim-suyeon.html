<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>김수연 — 한국 비평사 온톨로지</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="/kc-shell.css">
</head>
<body>

  <main class="container index-main">
    <section class="critic-profile-hero">
      <div class="critic-profile-byline"><span class="chip role-critic">김수연</span></div>
      <h1 class="index-heading">김수연</h1>
      
      <div class="stat-row">
        <div class="stat"><span class="stat-num">1</span><span class="stat-label">수록 비평글</span></div>
        <div class="stat"><span class="stat-num">0</span><span class="stat-label">비평 대상 작가</span></div>
        <div class="stat"><span class="stat-num">5</span><span class="stat-label">활용 이론가</span></div>
      </div>
    </section>

    <section class="critic-profile-meta">
      <div class="meta-section">
        <h2 class="meta-label">주요 비평 대상</h2>
        <div class="chip-group"><span class="muted">—</span></div>
      </div>
      <div class="meta-section">
        <h2 class="meta-label">자주 활용한 이론가</h2>
        <div class="chip-group"><span class="chip chip-term">알랭 바디우 (1)</span> <span class="chip chip-term">임옥희 (1)</span> <span class="chip chip-term">정희진 (1)</span> <span class="chip chip-term">마사 누스바움 (1)</span> <span class="chip chip-term">록산 게이 (1)</span></div>
      </div>
    </section>
    
    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb5178", "label": "임옥희 『젠더 감정 정치』", "type": "essay", "year": "2016", "degree": 6}, {"id": "p-alain-badiou", "label": "바디우", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q311005 http://lod.nl.go.kr/resource/KAC199701211 https://isni.org/isni/000000012136299X http://viaf.org/viaf/64001185", "degree": 24, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199701211", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q311005", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-gim-suyeon", "label": "김수연", "type": "critic", "ref": "", "degree": 1, "lod": [], "en": ""}, {"id": "p-im-okhui", "label": "임옥희", "type": "critic", "ref": "https://www.wikidata.org/wiki/Q21060075 http://lod.nl.go.kr/resource/KAC201212791 https://isni.org/isni/0000000036883045 http://viaf.org/viaf/73311200", "degree": 2, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201212791", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q21060075", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-jeong-huijin", "label": "정희진", "type": "critic", "ref": "https://www.wikidata.org/wiki/Q18880801 http://lod.nl.go.kr/resource/KAC201304957 https://isni.org/isni/0000000467727319 http://viaf.org/viaf/100145375897083680354", "degree": 10, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201304957", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q18880801", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-martha-nussbaum-2", "label": "마사 누스바움", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q235470 http://lod.nl.go.kr/resource/KAC199620438 https://isni.org/isni/0000000121456953 http://viaf.org/viaf/101364836", "degree": 7, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199620438", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q235470", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-roxane-gay", "label": "록산 게이", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q16202911 http://lod.nl.go.kr/resource/KAC201608614 https://isni.org/isni/0000000434301581 http://viaf.org/viaf/308698170", "degree": 2, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201608614", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q16202911", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}], "edges": [{"source": "p-gim-suyeon", "target": "cb5178", "type": "wrote", "weight": 1}, {"source": "cb5178", "target": "p-alain-badiou", "type": "uses_theory", "weight": 1}, {"source": "cb5178", "target": "p-im-okhui", "type": "uses_theory", "weight": 1}, {"source": "cb5178", "target": "p-jeong-huijin", "type": "uses_theory", "weight": 1}, {"source": "cb5178", "target": "p-martha-nussbaum-2", "type": "uses_theory", "weight": 1}, {"source": "cb5178", "target": "p-roxane-gay", "type": "uses_theory", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
    <section class="essay-grid">
      <h2 class="section-label">수록 비평글 (1편)</h2>
      
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2016</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb5178.html">임옥희 『젠더 감정 정치』</a>
        </h3>
        <p class="essay-card-source">창작과비평 173호, 창비, 2016</p>
        <div class="essay-card-tags"><span class="tag">알랭 바디우</span> <span class="tag">임옥희</span> <span class="tag">정희진</span> <span class="tag">마사 누스바움</span> <span class="tag">록산 게이</span></div>
      </article>
    </section>
  </main>

  <script src="/kc-shell.js"></script>
</body>
</html>
