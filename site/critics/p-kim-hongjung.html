<!DOCTYPE html>
<html lang="ko">
<head>

  <link rel="preconnect" href="https://cdn.jsdelivr.net">

  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="/kc-shell.css">
</head>
<body>

  <main class="container index-main">
    <section class="critic-profile-hero">
      <div class="critic-profile-byline"><span class="chip role-critic">김홍중</span></div>
      <h1 class="index-heading">김홍중</h1>
      
      <div class="stat-row">
        <div class="stat"><span class="stat-num">1</span><span class="stat-label">수록 비평글</span></div>
        <div class="stat"><span class="stat-num">0</span><span class="stat-label">비평 대상 작가</span></div>
        <div class="stat"><span class="stat-num">3</span><span class="stat-label">활용 이론가</span></div>
      </div>
    </section>

    <section class="critic-profile-meta">
      <div class="meta-section">
        <h2 class="meta-label">주요 비평 대상</h2>
        <div class="chip-group"><span class="muted">—</span></div>
      </div>
      <div class="meta-section">
        <h2 class="meta-label">자주 활용한 이론가</h2>
        <div class="chip-group"><span class="chip chip-term">발터 벤야민 (1)</span> <span class="chip chip-term">한나 아렌트 (1)</span> <span class="chip chip-term">데이비드 하비 (1)</span></div>
      </div>
    </section>
    
    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb3337", "label": "데이비드 하비 『모더니티의 수도, 파리』", "type": "essay", "year": "2005", "degree": 4}, {"id": "cb4261", "label": "2000년대 소설의 윤리와 정치", "type": "essay", "year": "2010", "degree": 11}, {"id": "cb4933", "label": "‘사회를 말하는 사회’와 분단체제론", "type": "essay", "year": "2014", "degree": 9}, {"id": "cb4991", "label": "‘아토포스’라는 아직 알려지지 않은 아방가르드", "type": "essay", "year": "2015", "degree": 10}, {"id": "cb5375", "label": "통감하는 주체, 유무의 경계 너머의 말들", "type": "essay", "year": "2017", "degree": 8}, {"id": "cb5571", "label": "문학성과 커먼즈", "type": "essay", "year": "2018", "degree": 8}, {"id": "cb7014", "label": "불가피한 미래란 없다", "type": "essay", "year": "2024", "degree": 5}, {"id": "cb7327", "label": "진정성이라는 대리 물성과 정체성의 딜레마", "type": "essay", "year": "2026", "degree": 9}, {"id": "jeong-gwari_go-eungyeong-kim-hongjung-reality_1999", "label": "리얼리티의 기능 — 고은경과 김홍중의 시", "type": "essay", "year": "1999", "degree": 8}, {"id": "p-00227", "label": "발터 벤야민", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q61078 http://lod.nl.go.kr/resource/KAC199602170 https://isni.org/isni/0000000121010732 http://viaf.org/viaf/46757196", "degree": 67, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199602170", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q61078", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Walter Benjamin"}, {"id": "p-arendt", "label": "한나 아렌트", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q60025 http://lod.nl.go.kr/resource/KAC199600908 https://isni.org/isni/0000000121463002 http://viaf.org/viaf/105151053", "degree": 24, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199600908", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q60025", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Hannah Arendt"}, {"id": "p-david-harvey", "label": "하비", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q343055 http://lod.nl.go.kr/resource/KAC199611733 https://isni.org/isni/0000000121464558 http://viaf.org/viaf/106978116", "degree": 15, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199611733", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q343055", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-kim-hongjung", "label": "김홍중", "type": "critic", "ref": "", "degree": 9, "lod": [], "en": ""}], "edges": [{"source": "cb4261", "target": "p-kim-hongjung", "type": "subject_of", "weight": 1}, {"source": "cb4933", "target": "p-kim-hongjung", "type": "subject_of", "weight": 1}, {"source": "cb4991", "target": "p-kim-hongjung", "type": "subject_of", "weight": 1}, {"source": "cb5375", "target": "p-kim-hongjung", "type": "subject_of", "weight": 1}, {"source": "cb5571", "target": "p-kim-hongjung", "type": "subject_of", "weight": 1}, {"source": "cb7014", "target": "p-kim-hongjung", "type": "subject_of", "weight": 1}, {"source": "cb7327", "target": "p-kim-hongjung", "type": "subject_of", "weight": 1}, {"source": "jeong-gwari_go-eungyeong-kim-hongjung-reality_1999", "target": "p-kim-hongjung", "type": "subject_of", "weight": 1}, {"source": "p-kim-hongjung", "target": "cb3337", "type": "wrote", "weight": 1}, {"source": "cb3337", "target": "p-00227", "type": "uses_theory", "weight": 1}, {"source": "cb3337", "target": "p-arendt", "type": "uses_theory", "weight": 1}, {"source": "cb3337", "target": "p-david-harvey", "type": "uses_theory", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
    <section class="essay-grid">
      <h2 class="section-label">수록 비평글 (1편)</h2>
      
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2005</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb3337.html">데이비드 하비 『모더니티의 수도, 파리』</a>
        </h3>
        <p class="essay-card-source">창작과비평 128호, 창비, 2005</p>
        <div class="essay-card-tags"><span class="tag">발터 벤야민</span> <span class="tag">한나 아렌트</span> <span class="tag">데이비드 하비</span></div>
      </article>
    </section>
  </main>

  <script src="/kc-shell.js"></script>
</body>
</html>
