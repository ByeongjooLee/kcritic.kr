</head>
<body>

      <h1 class="index-heading">정도상</h1>

      <div class="stat-row">
        <div class="stat"><span class="stat-num">1</span><span class="stat-label">수록 비평글</span></div>
        <div class="stat"><span class="stat-num">0</span><span class="stat-label">비평 대상 작가</span></div>
        <div class="stat"><span class="stat-num">1</span><span class="stat-label">활용 이론가</span></div>

    <section class="critic-profile-meta">
      <div class="meta-section">
        <h2 class="meta-label">주요 비평 대상</h2>
        <div class="chip-group"><span class="muted">—</span></div>
      </div>
      <div class="meta-section">
        <h2 class="meta-label">자주 활용한 이론가</h2>
        <div class="chip-group"><span class="chip chip-term">오인동 (1)</span></div>
      </div>
    </section>
    
    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb3503", "label": "거미의 집짓기와 소화법", "type": "essay", "year": "2006", "degree": 10}, {"id": "cb3622", "label": "통일시대를 위하여", "type": "essay", "year": "2006", "degree": 11}, {"id": "cb3921", "label": "문학의 새로움은 어디서 오는가", "type": "essay", "year": "2008", "degree": 13}, {"id": "cb4293", "label": "오인동 『평양에 두고 온 수술가방』", "type": "essay", "year": "2010", "degree": 2}, {"id": "cb5924", "label": "정도상 장편 『은행나무 소년』", "type": "essay", "year": "2012", "degree": 4}, {"id": "hong-jeongseon_reality-novel-after-june_1989", "label": "6월 항쟁 이후의 현실과 소설", "type": "essay", "year": "1989", "degree": 29}, {"id": "im-heonyeong_democracy-minjung-aesthetics_1990", "label": "민주주의와 민중미학을 위하여", "type": "essay", "year": "1990", "degree": 19}, {"id": "kim-cheol_army-korean-novel_1988", "label": "군대와 한국 소설", "type": "essay", "year": "1988", "degree": 15}, {"id": "p-jeong-dosang", "label": "정도상", "type": "critic", "ref": "https://www.wikidata.org/wiki/Q69696756 http://lod.nl.go.kr/resource/KAC201008032 https://isni.org/isni/0000000068319908 http://viaf.org/viaf/51544963", "degree": 8, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201008032", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q69696756", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-o-indong", "label": "오인동", "type": "theorist", "ref": "http://lod.nl.go.kr/resource/KAC201327501 https://isni.org/isni/0000000465096146 http://viaf.org/viaf/29362086", "degree": 1, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201327501", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}], "edges": [{"source": "cb3503", "target": "p-jeong-dosang", "type": "subject_of", "weight": 1}, {"source": "cb3622", "target": "p-jeong-dosang", "type": "subject_of", "weight": 1}, {"source": "cb3921", "target": "p-jeong-dosang", "type": "subject_of", "weight": 1}, {"source": "cb5924", "target": "p-jeong-dosang", "type": "subject_of", "weight": 1}, {"source": "hong-jeongseon_reality-novel-after-june_1989", "target": "p-jeong-dosang", "type": "subject_of", "weight": 1}, {"source": "im-heonyeong_democracy-minjung-aesthetics_1990", "target": "p-jeong-dosang", "type": "subject_of", "weight": 1}, {"source": "kim-cheol_army-korean-novel_1988", "target": "p-jeong-dosang", "type": "subject_of", "weight": 1}, {"source": "p-jeong-dosang", "target": "cb4293", "type": "wrote", "weight": 1}, {"source": "cb4293", "target": "p-o-indong", "type": "uses_theory", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
    <section class="essay-grid">

          <span class="essay-card-year">2010</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb4293.html">오인동 『평양에 두고 온 수술가방』</a>
        </h3>
        <p class="essay-card-source">창작과비평 150호, 창비, 2010</p>
        <div class="essay-card-tags"><span class="tag">오인동</span></div>
      </article>
    </section>
  </main>

  <script src="/kc-shell.js"></script>
</body>
</html>
