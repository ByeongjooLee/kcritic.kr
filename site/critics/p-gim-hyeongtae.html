<body>

  <main class="container index-main">

        <div class="stat"><span class="stat-num">9</span><span class="stat-label">활용 이론가</span></div>

    <section class="critic-profile-meta">
      <div class="meta-section">
        <h2 class="meta-label">주요 비평 대상</h2>
        <div class="chip-group"><span class="chip role-writer">방현석</span></div>
      </div>
      <div class="meta-section">
        <h2 class="meta-label">자주 활용한 이론가</h2>
        <div class="chip-group"><span class="chip chip-term">기든스 (1)</span> <span class="chip chip-term">그람시 (1)</span> <span class="chip chip-term">하버마스 (1)</span> <span class="chip chip-term">조희연 (1)</span> <span class="chip chip-term">노자 (1)</span> <span class="chip chip-term">존 로크 (1)</span> <span class="chip chip-term">서준식 (1)</span> <span class="chip chip-term">스피노자 (1)</span> <span class="chip chip-term">이매뉴얼 월러스틴 (1)</span></div>
      </div>
    </section>
    
    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb2566", "label": "인권운동, 그 위기와 기회", "type": "essay", "year": "2000", "degree": 11}, {"id": "p-bang-hyeonseok", "label": "방현석", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q12597600 http://lod.nl.go.kr/resource/KAC201010904 https://isni.org/isni/0000000382944736 http://viaf.org/viaf/266848280", "degree": 11, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201010904", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q12597600", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-giddens", "label": "기든스", "type": "theorist", "ref": "", "degree": 4, "lod": [], "en": ""}, {"id": "p-gim-hyeongtae", "label": "김형태", "type": "critic", "ref": "", "degree": 1, "lod": [], "en": ""}, {"id": "p-gramsci", "label": "그람시", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q83003 http://lod.nl.go.kr/resource/KAC199610612 https://isni.org/isni/0000000122790742 http://viaf.org/viaf/44299576", "degree": 8, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199610612", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q83003", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-j-habermas", "label": "하버마스", "type": "theorist", "ref": "", "degree": 6, "lod": [], "en": ""}, {"id": "p-jo-huiyeon", "label": "조희연", "type": "critic", "ref": "http://lod.nl.go.kr/resource/KAC201229605 https://isni.org/isni/0000000077336339 http://viaf.org/viaf/309886279", "degree": 12, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201229605", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}, {"id": "p-laozi", "label": "노자", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q9333 http://lod.nl.go.kr/resource/KAC199631272 https://isni.org/isni/0000000121017619 http://viaf.org/viaf/101089774", "degree": 10, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199631272", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q9333", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Laozi"}, {"id": "p-locke", "label": "존 로크", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q9353 http://lod.nl.go.kr/resource/KAC199616894 https://isni.org/isni/0000000121272329 http://viaf.org/viaf/34459614", "degree": 6, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199616894", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q9353", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "John Locke"}, {"id": "p-seo-junsik", "label": "서준식", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q24868670 http://lod.nl.go.kr/resource/KAC201723069 https://isni.org/isni/0000000084399733 http://viaf.org/viaf/35768091", "degree": 2, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201723069", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q24868670", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-spinoza", "label": "스피노자", "type": "theorist", "ref": "", "degree": 17, "lod": [], "en": ""}, {"id": "p-wallerstein", "label": "월러스틴", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q494287 http://lod.nl.go.kr/resource/KAC199629161 https://isni.org/isni/0000000120962459 http://viaf.org/viaf/61553720", "degree": 40, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199629161", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q494287", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Immanuel Wallerstein"}], "edges": [{"source": "p-gim-hyeongtae", "target": "cb2566", "type": "wrote", "weight": 1}, {"source": "cb2566", "target": "p-bang-hyeonseok", "type": "subject_of", "weight": 1}, {"source": "cb2566", "target": "p-giddens", "type": "uses_theory", "weight": 1}, {"source": "cb2566", "target": "p-gramsci", "type": "uses_theory", "weight": 1}, {"source": "cb2566", "target": "p-j-habermas", "type": "uses_theory", "weight": 1}, {"source": "cb2566", "target": "p-jo-huiyeon", "type": "uses_theory", "weight": 1}, {"source": "cb2566", "target": "p-laozi", "type": "uses_theory", "weight": 1}, {"source": "cb2566", "target": "p-locke", "type": "uses_theory", "weight": 1}, {"source": "cb2566", "target": "p-seo-junsik", "type": "uses_theory", "weight": 1}, {"source": "cb2566", "target": "p-spinoza", "type": "uses_theory", "weight": 1}, {"source": "cb2566", "target": "p-wallerstein", "type": "uses_theory", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
    <section class="essay-grid">
      <h2 class="section-label">수록 비평글 (1편)</h2>
      
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2000</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb2566.html">인권운동, 그 위기와 기회</a>
        </h3>
        <p class="essay-card-source">창작과비평 108호, 창비, 2000</p>
        <div class="essay-card-tags"><span class="tag">방현석</span><span class="tag">기든스</span> <span class="tag">그람시</span> <span class="tag">하버마스</span> <span class="tag">조희연</span> <span class="tag">노자</span> <span class="tag">존 로크</span> <span class="tag">서준식</span> <span class="tag">스피노자</span> <span class="tag">이매뉴얼 월러스틴</span></div>
      </article>
    </section>
