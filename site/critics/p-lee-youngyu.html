    <section class="critic-mini-graph-section">

      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>

      </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb4796", "label": "2013년 대한민국, 우리가 선거하지 않는 이유", "type": "essay", "year": "2013", "degree": 6}, {"id": "kim-hyon_living-poems-2_1983", "label": "살아 있는 시들 (제2권 거대한 낙원에서)", "type": "essay", "year": "1983", "degree": 49}, {"id": "p-alain-badiou", "label": "바디우", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q311005 http://lod.nl.go.kr/resource/KAC199701211 https://isni.org/isni/000000012136299X http://viaf.org/viaf/64001185", "degree": 21, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199701211", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q311005", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-ji-jek", "label": "지젝", "type": "theorist", "ref": "", "degree": 11, "lod": [], "en": ""}, {"id": "p-karatani-kojin", "label": "가라타니 고진", "type": "theorist", "ref": "", "degree": 36, "lod": [], "en": ""}, {"id": "p-kim-yeongha", "label": "김영하", "type": "critic", "ref": "", "degree": 48, "lod": [], "en": ""}, {"id": "p-lee-youngyu", "label": "이영유", "type": "critic", "ref": "http://lod.nl.go.kr/resource/KAC201427299 https://isni.org/isni/0000000049752888 http://viaf.org/viaf/63888307", "degree": 3, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201427299", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}, {"id": "p-millett", "label": "케이트 밀렛", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q292268 http://lod.nl.go.kr/resource/KAC199618926 https://isni.org/isni/0000000121326518 http://viaf.org/viaf/51693468", "degree": 2, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199618926", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q292268", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "park-hyegyeong_poetry-of-incommunicability_1993", "label": "소통 불능의 시, 그 절망의 어법 — 김정란과 이영유의 시", "type": "essay", "year": "1993", "degree": 5}], "edges": [{"source": "kim-hyon_living-poems-2_1983", "target": "p-lee-youngyu", "type": "subject_of", "weight": 1}, {"source": "p-lee-youngyu", "target": "cb4796", "type": "wrote", "weight": 1}, {"source": "park-hyegyeong_poetry-of-incommunicability_1993", "target": "p-lee-youngyu", "type": "subject_of", "weight": 1}, {"source": "cb4796", "target": "p-alain-badiou", "type": "uses_theory", "weight": 1}, {"source": "cb4796", "target": "p-ji-jek", "type": "uses_theory", "weight": 1}, {"source": "cb4796", "target": "p-karatani-kojin", "type": "uses_theory", "weight": 1}, {"source": "cb4796", "target": "p-kim-yeongha", "type": "subject_of", "weight": 1}, {"source": "cb4796", "target": "p-millett", "type": "uses_theory", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
