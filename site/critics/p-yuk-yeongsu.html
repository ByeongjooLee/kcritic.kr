<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>육영수 — 한국 비평사 온톨로지</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="/kc-shell.css">
</head>
<body>

  <main class="container index-main">
    <section class="critic-profile-hero">
      <div class="critic-profile-byline"><span class="chip role-critic">육영수</span></div>
      <h1 class="index-heading">육영수</h1>
      
      <div class="stat-row">
        <div class="stat"><span class="stat-num">1</span><span class="stat-label">수록 비평글</span></div>
        <div class="stat"><span class="stat-num">3</span><span class="stat-label">비평 대상 작가</span></div>
        <div class="stat"><span class="stat-num">5</span><span class="stat-label">활용 이론가</span></div>
      </div>
    </section>

    <section class="critic-profile-meta">
      <div class="meta-section">
        <h2 class="meta-label">주요 비평 대상</h2>
        <div class="chip-group"><span class="chip role-writer">조지 오웰</span> <span class="chip role-writer">키플링</span> <span class="chip role-writer">움베르토 에코</span></div>
      </div>
      <div class="meta-section">
        <h2 class="meta-label">자주 활용한 이론가</h2>
        <div class="chip-group"><span class="chip chip-term">프로이트 (1)</span> <span class="chip chip-term">니체 (1)</span> <span class="chip chip-term">홉스봄 (1)</span> <span class="chip chip-term">푸코 (1)</span> <span class="chip chip-term">유진 웨버 (1)</span></div>
      </div>
    </section>
    
    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb2526", "label": "19세기말 유럽과 나 - 변화, 지속 그리고 반복", "type": "essay", "year": "2000", "degree": 9}, {"id": "p-00051", "label": "프로이트", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q9215 http://lod.nl.go.kr/resource/KAC199609326 https://isni.org/isni/0000000121272193 http://viaf.org/viaf/34456780", "degree": 96, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199609326", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q9215", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Sigmund Freud"}, {"id": "p-00055", "label": "조지 오웰", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q3335 http://lod.nl.go.kr/resource/KAC199620760 https://isni.org/isni/0000000121441305 http://viaf.org/viaf/95155403", "degree": 16, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199620760", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q3335", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "George Orwell"}, {"id": "p-00161", "label": "니체", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q9358 http://lod.nl.go.kr/resource/KAC199620237 https://isni.org/isni/0000000122828181 http://viaf.org/viaf/89798474", "degree": 91, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199620237", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q9358", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Friedrich Nietzsche"}, {"id": "p-e-hobsbawm", "label": "홉스봄", "type": "theorist", "ref": "", "degree": 4, "lod": [], "en": ""}, {"id": "p-m-foucault", "label": "푸코", "type": "theorist", "ref": "", "degree": 22, "lod": [], "en": ""}, {"id": "p-r-kipling", "label": "키플링", "type": "writer", "ref": "", "degree": 1, "lod": [], "en": ""}, {"id": "p-umberto-eco", "label": "움베르토 에코", "type": "writer", "ref": "", "degree": 13, "lod": [], "en": ""}, {"id": "p-yujin-webeo", "label": "유진 웨버", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q348360 http://lod.nl.go.kr/resource/KAC201857986 https://isni.org/isni/0000000458060735 http://viaf.org/viaf/108390144", "degree": 1, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201857986", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q348360", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-yuk-yeongsu", "label": "육영수", "type": "critic", "ref": "", "degree": 1, "lod": [], "en": ""}], "edges": [{"source": "p-yuk-yeongsu", "target": "cb2526", "type": "wrote", "weight": 1}, {"source": "cb2526", "target": "p-00051", "type": "uses_theory", "weight": 1}, {"source": "cb2526", "target": "p-00055", "type": "subject_of", "weight": 1}, {"source": "cb2526", "target": "p-00161", "type": "uses_theory", "weight": 1}, {"source": "cb2526", "target": "p-e-hobsbawm", "type": "uses_theory", "weight": 1}, {"source": "cb2526", "target": "p-m-foucault", "type": "uses_theory", "weight": 1}, {"source": "cb2526", "target": "p-r-kipling", "type": "subject_of", "weight": 1}, {"source": "cb2526", "target": "p-umberto-eco", "type": "subject_of", "weight": 1}, {"source": "cb2526", "target": "p-yujin-webeo", "type": "uses_theory", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
    <section class="essay-grid">
      <h2 class="section-label">수록 비평글 (1편)</h2>
      
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2000</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb2526.html">19세기말 유럽과 나 - 변화, 지속 그리고 반복</a>
        </h3>
        <p class="essay-card-source">창작과비평 107호, 창비, 2000</p>
        <div class="essay-card-tags"><span class="tag">조지 오웰</span> <span class="tag">키플링</span> <span class="tag">움베르토 에코</span><span class="tag">프로이트</span> <span class="tag">니체</span> <span class="tag">홉스봄</span> <span class="tag">푸코</span> <span class="tag">유진 웨버</span></div>
      </article>
    </section>
  </main>

  <script src="/kc-shell.js"></script>
</body>
</html>
