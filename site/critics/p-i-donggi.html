</head>

      <div class="stat-row">
        <div class="stat"><span class="stat-num">2</span><span class="stat-label">수록 비평글</span></div>
        <div class="stat"><span class="stat-num">0</span><span class="stat-label">비평 대상 작가</span></div>
        <div class="stat"><span class="stat-num">4</span><span class="stat-label">활용 이론가</span></div>
      </div>
    </section>

    <section class="critic-profile-meta">
      <div class="meta-section">
        <h2 class="meta-label">주요 비평 대상</h2>
        <div class="chip-group"><span class="muted">—</span></div>
      </div>
      <div class="meta-section">
        <h2 class="meta-label">자주 활용한 이론가</h2>
        <div class="chip-group"><span class="chip chip-term">허승철 (1)</span> <span class="chip chip-term">헤르더 (1)</span> <span class="chip chip-term">마리아 혼 (1)</span> <span class="chip chip-term">문승숙 (1)</span></div>
      </div>
    </section>
    
    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb5365", "label": "문승숙 외 『오버 데어』", "type": "essay", "year": "2017", "degree": 3}, {"id": "cb5699", "label": "이동기 『현대사 몽타주』", "type": "essay", "year": "2019", "degree": 4}, {"id": "cb6798", "label": "허승철 『우크라이나 현대사』", "type": "essay", "year": "2023", "degree": 3}, {"id": "p-heo-seungcheol", "label": "허승철", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q12167394 http://lod.nl.go.kr/resource/KAC201329725 https://isni.org/isni/0000000461069589 http://viaf.org/viaf/20150746899516301486", "degree": 1, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201329725", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q12167394", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-herder", "label": "헤르더", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q155547 http://lod.nl.go.kr/resource/KAC199634361 https://isni.org/isni/0000000121031883 http://viaf.org/viaf/95187266", "degree": 6, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199634361", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q155547", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Johann Gottfried Herder"}, {"id": "p-i-donggi", "label": "이동기", "type": "critic", "ref": "http://lod.nl.go.kr/resource/KAC201318775 https://isni.org/isni/0000000461117261 http://viaf.org/viaf/146150468229504171590", "degree": 3, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201318775", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}, {"id": "p-maria-h-hn", "label": "마리아 혼", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q95208853 http://lod.nl.go.kr/resource/KAC201705964 https://isni.org/isni/0000000121455950 http://viaf.org/viaf/100991676", "degree": 1, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201705964", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q95208853", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-mun-seungsuk", "label": "문승숙", "type": "theorist", "ref": "http://lod.nl.go.kr/resource/KAC201705950 https://isni.org/isni/0000000055256119 http://viaf.org/viaf/75052727", "degree": 2, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201705950", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}], "edges": [{"source": "cb5699", "target": "p-i-donggi", "type": "uses_theory", "weight": 1}, {"source": "p-i-donggi", "target": "cb5365", "type": "wrote", "weight": 1}, {"source": "p-i-donggi", "target": "cb6798", "type": "wrote", "weight": 1}, {"source": "cb5365", "target": "p-maria-h-hn", "type": "uses_theory", "weight": 1}, {"source": "cb5365", "target": "p-mun-seungsuk", "type": "uses_theory", "weight": 1}, {"source": "cb6798", "target": "p-heo-seungcheol", "type": "uses_theory", "weight": 1}, {"source": "cb6798", "target": "p-herder", "type": "uses_theory", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
    <section class="essay-grid">
      <h2 class="section-label">수록 비평글 (2편)</h2>
      
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2017</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb5365.html">문승숙 외 『오버 데어』</a>
        </h3>
        <p class="essay-card-source">창작과비평 176호, 창비, 2017</p>
        <div class="essay-card-tags"><span class="tag">마리아 혼</span> <span class="tag">문승숙</span></div>
      </article>
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2023</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb6798.html">허승철 『우크라이나 현대사』</a>
        </h3>
        <p class="essay-card-source">창작과비평 200호, 창비, 2023</p>
        <div class="essay-card-tags"><span class="tag">허승철</span> <span class="tag">헤르더</span></div>
      </article>
    </section>
  </main>

  <script src="/kc-shell.js"></script>
</body>
</html>
