    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb4079", "label": "테싸 모리스-스즈끼 『일본의 아이덴티티를 묻는다』", "type": "essay", "year": "2006", "degree": 3}, {"id": "cb5091", "label": "한국의 일본군‘위안부’ 연구, 어디까지 왔나", "type": "essay", "year": "2016", "degree": 3}, {"id": "p-00124", "label": "줄리아 크리스테바", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q159876 http://lod.nl.go.kr/resource/KAC199615498 https://isni.org/isni/0000000122839200 http://viaf.org/viaf/108172648", "degree": 15, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199615498", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q159876", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Julia Kristeva"}, {"id": "p-gato-norihiro", "label": "가토 노리히로", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q11399036 http://lod.nl.go.kr/resource/KAC200109370 https://isni.org/isni/0000000082880494 http://viaf.org/viaf/108146382", "degree": 1, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC200109370", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q11399036", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-karatani-kojin", "label": "가라타니 고진", "type": "theorist", "ref": "", "degree": 36, "lod": [], "en": ""}, {"id": "p-park-yuha", "label": "박유하", "type": "critic", "ref": "", "degree": 5, "lod": [], "en": ""}, {"id": "p-seong-minyeop", "label": "성민엽", "type": "critic", "ref": "https://www.wikidata.org/wiki/Q16083535 http://lod.nl.go.kr/resource/KAC201314274 https://isni.org/isni/0000000036391593 http://viaf.org/viaf/60936176", "degree": 35, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201314274", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q16083535", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-tessa-morris-suzuki", "label": "테사 모리스-스즈키", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q7705612 http://lod.nl.go.kr/resource/KAC200605725 https://isni.org/isni/0000000084063762 http://viaf.org/viaf/109031883", "degree": 2, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC200605725", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q7705612", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "park-yuha_korean-boundary-consciousness-origin_1998", "label": "한국적 경계 의식의 ‘기원’", "type": "essay", "year": "1998", "degree": 4}, {"id": "seong-minyeop_reply-park-yuha-exclusivity_1998", "label": "배타성의 반성과 타자의 목소리 — 박유하 교수의 반론에 답하여", "type": "essay", "year": "1998", "degree": 5}, {"id": "sim-wonseop_japanese-literature-translation_1997", "label": "최근의 일본 문학 번역 현황에 대하여", "type": "essay", "year": "1997", "degree": 56}], "edges": [{"source": "cb5091", "target": "p-park-yuha", "type": "uses_theory", "weight": 1}, {"source": "p-park-yuha", "target": "cb4079", "type": "wrote", "weight": 1}, {"source": "p-park-yuha", "target": "park-yuha_korean-boundary-consciousness-origin_1998", "type": "wrote", "weight": 1}, {"source": "seong-minyeop_reply-park-yuha-exclusivity_1998", "target": "p-park-yuha", "type": "uses_theory", "weight": 1}, {"source": "sim-wonseop_japanese-literature-translation_1997", "target": "p-park-yuha", "type": "uses_theory", "weight": 1}, {"source": "cb4079", "target": "p-gato-norihiro", "type": "uses_theory", "weight": 1}, {"source": "cb4079", "target": "p-tessa-morris-suzuki", "type": "uses_theory", "weight": 1}, {"source": "park-yuha_korean-boundary-consciousness-origin_1998", "target": "p-00124", "type": "uses_theory", "weight": 1}, {"source": "park-yuha_korean-boundary-consciousness-origin_1998", "target": "p-karatani-kojin", "type": "uses_theory", "weight": 1}, {"source": "park-yuha_korean-boundary-consciousness-origin_1998", "target": "p-seong-minyeop", "type": "uses_theory", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
