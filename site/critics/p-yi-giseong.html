<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이기성 — 한국 비평사 온톨로지</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="/kc-shell.css">
</head>
<body>

  <main class="container index-main">
    <section class="critic-profile-hero">
      <div class="critic-profile-byline"><span class="chip role-critic">이기성</span></div>
      <h1 class="index-heading">이기성</h1>
      
      <div class="stat-row">
        <div class="stat"><span class="stat-num">2</span><span class="stat-label">수록 비평글</span></div>
        <div class="stat"><span class="stat-num">3</span><span class="stat-label">비평 대상 작가</span></div>
        <div class="stat"><span class="stat-num">1</span><span class="stat-label">활용 이론가</span></div>
      </div>
    </section>

    <section class="critic-profile-meta">
      <div class="meta-section">
        <h2 class="meta-label">주요 비평 대상</h2>
        <div class="chip-group"><span class="chip role-writer">서정주</span> <span class="chip role-writer">김이듬</span> <span class="chip role-writer">이성복</span></div>
      </div>
      <div class="meta-section">
        <h2 class="meta-label">자주 활용한 이론가</h2>
        <div class="chip-group"><span class="chip chip-term">슬라보예 지젝 (1)</span></div>
      </div>
    </section>
    
    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb3818", "label": "김이듬 시집 『명랑하라 팜 파탈』", "type": "essay", "year": "2008", "degree": 3}, {"id": "cb4739", "label": "이성복 시집 『래여애반다라』", "type": "essay", "year": "2013", "degree": 3}, {"id": "jeong-gwari_yi-giseong-ruins_1998", "label": "폐허의 현장 — 이기성의 시에 대하여", "type": "essay", "year": "1998", "degree": 5}, {"id": "lee-gwangho_hybrid-writing-zero-gravity_2005", "label": "혼종적 글쓰기 혹은 무중력 공간의 탄생 — 2000년대 문학의 다른 이름들", "type": "essay", "year": "2005", "degree": 42}, {"id": "p-00195", "label": "서정주", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q624277 https://encykorea.aks.ac.kr/Article/E0071543 http://lod.nl.go.kr/resource/KAC200207962 https://isni.org/isni/000000008403163X http://viaf.org/viaf/53008278", "degree": 91, "lod": [{"href": "https://encykorea.aks.ac.kr/Article/E0071543", "label": "한", "full": "한국민족문화대백과", "bg": "#e8f0e8", "fg": "#2a5a2a"}, {"href": "http://lod.nl.go.kr/resource/KAC200207962", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q624277", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-kim-ideum", "label": "김이듬", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q38202769 http://lod.nl.go.kr/resource/KAC201103887 https://isni.org/isni/0000000139765586 http://viaf.org/viaf/176386713", "degree": 3, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201103887", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q38202769", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-lee-seongbok", "label": "이성복", "type": "critic", "ref": "https://www.wikidata.org/wiki/Q14192416 http://lod.nl.go.kr/resource/KAC201116691 https://isni.org/isni/0000000078458717 http://viaf.org/viaf/31876473", "degree": 45, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201116691", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q14192416", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-seulraboye-jijek", "label": "슬라보예 지젝", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q184750 http://lod.nl.go.kr/resource/KAC199630983 https://isni.org/isni/0000000120954619 http://viaf.org/viaf/2478493", "degree": 21, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199630983", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q184750", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-yi-giseong", "label": "이기성", "type": "critic", "ref": "", "degree": 4, "lod": [], "en": ""}], "edges": [{"source": "jeong-gwari_yi-giseong-ruins_1998", "target": "p-yi-giseong", "type": "subject_of", "weight": 1}, {"source": "lee-gwangho_hybrid-writing-zero-gravity_2005", "target": "p-yi-giseong", "type": "subject_of", "weight": 1}, {"source": "p-yi-giseong", "target": "cb3818", "type": "wrote", "weight": 1}, {"source": "p-yi-giseong", "target": "cb4739", "type": "wrote", "weight": 1}, {"source": "cb3818", "target": "p-kim-ideum", "type": "subject_of", "weight": 1}, {"source": "cb3818", "target": "p-seulraboye-jijek", "type": "uses_theory", "weight": 1}, {"source": "cb4739", "target": "p-00195", "type": "subject_of", "weight": 1}, {"source": "cb4739", "target": "p-lee-seongbok", "type": "subject_of", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
    <section class="essay-grid">
      <h2 class="section-label">수록 비평글 (2편)</h2>
      
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2008</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb3818.html">김이듬 시집 『명랑하라 팜 파탈』</a>
        </h3>
        <p class="essay-card-source">창작과비평 139호, 창비, 2008</p>
        <div class="essay-card-tags"><span class="tag">김이듬</span><span class="tag">슬라보예 지젝</span></div>
      </article>
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2013</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb4739.html">이성복 시집 『래여애반다라』</a>
        </h3>
        <p class="essay-card-source">창작과비평 160호, 창비, 2013</p>
        <div class="essay-card-tags"><span class="tag">서정주</span> <span class="tag">이성복</span></div>
      </article>
    </section>
  </main>

  <script src="/kc-shell.js"></script>
</body>
</html>
