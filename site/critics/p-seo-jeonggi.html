      <h1 class="index-heading">서정기</h1>
      
      <div class="stat-row">
        <div class="stat"><span class="stat-num">1</span><span class="stat-label">수록 비평글</span></div>
        <div class="stat"><span class="stat-num">4</span><span class="stat-label">비평 대상 작가</span></div>

    <section class="critic-profile-meta">
      <div class="meta-section">
        <h2 class="meta-label">주요 비평 대상</h2>
        <div class="chip-group"><span class="chip role-writer">고진하</span> <span class="chip role-writer">정화진</span> <span class="chip role-writer">이재무</span> <span class="chip role-writer">박몽구</span></div>
      </div>

      </div>

    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "p-bachelard", "label": "가스통 바슐라르", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q270800 http://lod.nl.go.kr/resource/KAC199601295 https://isni.org/isni/000000012118437X http://viaf.org/viaf/4926151", "degree": 26, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199601295", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q270800", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Gaston Bachelard"}, {"id": "p-go-jinha", "label": "고진하", "type": "writer", "ref": "", "degree": 1, "lod": [], "en": ""}, {"id": "p-jeong-hwajin", "label": "정화진", "type": "writer", "ref": "", "degree": 5, "lod": [], "en": ""}, {"id": "p-lee-jaemu", "label": "이재무", "type": "writer", "ref": "", "degree": 1, "lod": [], "en": ""}, {"id": "p-nerval", "label": "네르발", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q191305 http://lod.nl.go.kr/resource/KAC199620048 https://isni.org/isni/0000000121243763 http://viaf.org/viaf/24596532", "degree": 3, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199620048", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q191305", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-park-monggu", "label": "박몽구", "type": "writer", "ref": "", "degree": 1, "lod": [], "en": ""}, {"id": "p-seo-jeonggi", "label": "서정기", "type": "critic", "ref": "", "degree": 1, "lod": [], "en": ""}, {"id": "seo-jeonggi_from-room-to-square_1990", "label": "방에서 광장까지", "type": "essay", "year": "1990", "degree": 7}], "edges": [{"source": "p-seo-jeonggi", "target": "seo-jeonggi_from-room-to-square_1990", "type": "wrote", "weight": 1}, {"source": "seo-jeonggi_from-room-to-square_1990", "target": "p-bachelard", "type": "uses_theory", "weight": 1}, {"source": "seo-jeonggi_from-room-to-square_1990", "target": "p-go-jinha", "type": "subject_of", "weight": 1}, {"source": "seo-jeonggi_from-room-to-square_1990", "target": "p-jeong-hwajin", "type": "subject_of", "weight": 1}, {"source": "seo-jeonggi_from-room-to-square_1990", "target": "p-lee-jaemu", "type": "subject_of", "weight": 1}, {"source": "seo-jeonggi_from-room-to-square_1990", "target": "p-nerval", "type": "uses_theory", "weight": 1}, {"source": "seo-jeonggi_from-room-to-square_1990", "target": "p-park-monggu", "type": "subject_of", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#c9986a',
        writer: '#6a9bc9',
        theorist: '#9a7ac9',
        essay: '#c8c8a8'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#4a2400',
        writer: '#0e2d4a',
        theorist: '#2d1050',
        essay: '#3a3a2a'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#c9c7bf',
              'target-arrow-color': '#c9c7bf',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#6b3e26' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>

        </h3>
        <p class="essay-card-source">문학과사회 11호, 문학과지성사, 1990</p>
        <div class="essay-card-tags"><span class="tag">고진하</span> <span class="tag">정화진</span> <span class="tag">이재무</span> <span class="tag">박몽구</span><span class="tag">바슐라르</span> <span class="tag">네르발</span></div>
      </article>
    </section>
