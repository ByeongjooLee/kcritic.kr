<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>최두석 — 한국 비평사 온톨로지</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="/kc-shell.css">
</head>
<body>

  <main class="container index-main">
    <section class="critic-profile-hero">
      <div class="critic-profile-byline"><a href="https://www.wikidata.org/wiki/Q12619529" target="_blank" class="chip role-critic chip-linked">최두석 <span class="chip-ext">↗</span></a></div>
      <h1 class="index-heading">최두석</h1>
      <div class="lod-links"><a href="https://www.wikidata.org/wiki/Q12619529" target="_blank" class="lod-badge" title="Wikidata">Wikidata ↗</a></div>
      <div class="stat-row">
        <div class="stat"><span class="stat-num">1</span><span class="stat-label">수록 비평글</span></div>
        <div class="stat"><span class="stat-num">2</span><span class="stat-label">비평 대상 작가</span></div>
        <div class="stat"><span class="stat-num">0</span><span class="stat-label">활용 이론가</span></div>
      </div>
    </section>

    <section class="critic-profile-meta">
      <div class="meta-section">
        <h2 class="meta-label">주요 비평 대상</h2>
        <div class="chip-group"><span class="chip role-writer">황동규</span> <span class="chip role-writer">신경림</span></div>
      </div>
      <div class="meta-section">
        <h2 class="meta-label">자주 활용한 이론가</h2>
        <div class="chip-group"><span class="muted">—</span></div>
      </div>
    </section>
    
    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb2956", "label": "길의 시학", "type": "essay", "year": "2003", "degree": 3}, {"id": "cb3184", "label": "최두석 시집 『꽃에게 길을 묻는다』", "type": "essay", "year": "2003", "degree": 2}, {"id": "jeong-gwari_once-upon-literature_1998", "label": "옛날 옛적에 문학이 있었다", "type": "essay", "year": "1998", "degree": 32}, {"id": "kim-cheol_division-literary-history_1988", "label": "분단문학사의 극복을 위하여", "type": "essay", "year": "1988", "degree": 31}, {"id": "kim-heonseon_lyric-of-homeless-age_1990", "label": "집 없는 시대의 서정적 묘사와 그 전망", "type": "essay", "year": "1990", "degree": 17}, {"id": "kim-hyon_bedbug-dream_1984", "label": "빈대의 꿈", "type": "essay", "year": "1984", "degree": 6}, {"id": "kim-hyon_violence-distortion_1988", "label": "폭력과 왜곡", "type": "essay", "year": "1988", "degree": 9}, {"id": "p-00076", "label": "황동규", "type": "critic", "ref": "https://www.wikidata.org/wiki/Q12625798 http://lod.nl.go.kr/resource/KAC201200312 https://isni.org/isni/0000000078377888 http://viaf.org/viaf/84479211", "degree": 54, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201200312", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q12625798", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-00199", "label": "신경림", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q3482149 http://lod.nl.go.kr/resource/KAC201200501 https://isni.org/isni/0000000079981745 http://viaf.org/viaf/59193837", "degree": 36, "lod": [{"href": "https://encykorea.aks.ac.kr/Article/E0013094", "label": "한(작품)", "full": "한국민족문화대백과 (작품)", "bg": "#f0ede8", "fg": "#5a3a2a"}, {"href": "http://lod.nl.go.kr/resource/KAC201200501", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q3482149", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-choi-duseok", "label": "최두석", "type": "critic", "ref": "https://www.wikidata.org/wiki/Q12619529", "degree": 8, "lod": [{"href": "https://www.wikidata.org/wiki/Q12619529", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "park-haehyeon_two-searches-for-subject_1990", "label": "주체 정립을 향한 두 개의 모색", "type": "essay", "year": "1990", "degree": 5}], "edges": [{"source": "cb3184", "target": "p-choi-duseok", "type": "subject_of", "weight": 1}, {"source": "jeong-gwari_once-upon-literature_1998", "target": "p-choi-duseok", "type": "subject_of", "weight": 1}, {"source": "kim-cheol_division-literary-history_1988", "target": "p-choi-duseok", "type": "subject_of", "weight": 1}, {"source": "kim-heonseon_lyric-of-homeless-age_1990", "target": "p-choi-duseok", "type": "subject_of", "weight": 1}, {"source": "kim-hyon_bedbug-dream_1984", "target": "p-choi-duseok", "type": "subject_of", "weight": 1}, {"source": "kim-hyon_violence-distortion_1988", "target": "p-choi-duseok", "type": "subject_of", "weight": 1}, {"source": "p-choi-duseok", "target": "cb2956", "type": "wrote", "weight": 1}, {"source": "park-haehyeon_two-searches-for-subject_1990", "target": "p-choi-duseok", "type": "subject_of", "weight": 1}, {"source": "cb2956", "target": "p-00076", "type": "subject_of", "weight": 1}, {"source": "cb2956", "target": "p-00199", "type": "subject_of", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
    <section class="essay-grid">
      <h2 class="section-label">수록 비평글 (1편)</h2>
      
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2003</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb2956.html">길의 시학</a>
        </h3>
        <p class="essay-card-source">창작과비평 120호, 창비, 2003</p>
        <div class="essay-card-tags"><span class="tag">황동규</span> <span class="tag">신경림</span></div>
      </article>
    </section>
  </main>

  <script src="/kc-shell.js"></script>
</body>
</html>
