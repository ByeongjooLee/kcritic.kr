<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>윤세진 — 한국 비평사 온톨로지</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="/kc-shell.css">
</head>
<body>

  <main class="container index-main">
    <section class="critic-profile-hero">
      <div class="critic-profile-byline"><span class="chip role-critic">윤세진</span></div>
      <h1 class="index-heading">윤세진</h1>
      
      <div class="stat-row">
        <div class="stat"><span class="stat-num">1</span><span class="stat-label">수록 비평글</span></div>
        <div class="stat"><span class="stat-num">0</span><span class="stat-label">비평 대상 작가</span></div>
        <div class="stat"><span class="stat-num">4</span><span class="stat-label">활용 이론가</span></div>
      </div>
    </section>

    <section class="critic-profile-meta">
      <div class="meta-section">
        <h2 class="meta-label">주요 비평 대상</h2>
        <div class="chip-group"><span class="muted">—</span></div>
      </div>
      <div class="meta-section">
        <h2 class="meta-label">자주 활용한 이론가</h2>
        <div class="chip-group"><span class="chip chip-term">안드레 에카르트 (1)</span> <span class="chip chip-term">프란츠 파농 (1)</span> <span class="chip chip-term">세키노 다다시 (1)</span> <span class="chip chip-term">빙켈만 (1)</span></div>
      </div>
    </section>
    
    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb3559", "label": "『에카르트의 조선미술사』, 세끼노 타다시 『조선미술사』", "type": "essay", "year": "2004", "degree": 5}, {"id": "p-andre-eckardt", "label": "안드레 에카르트", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q493124 http://lod.nl.go.kr/resource/KAC200810596 https://isni.org/isni/0000000095953429 http://viaf.org/viaf/113423029", "degree": 1, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC200810596", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q493124", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-fanon", "label": "프란츠 파농", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q193670 http://lod.nl.go.kr/resource/KAC199608461 https://isni.org/isni/0000000120981385 http://viaf.org/viaf/22490", "degree": 7, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199608461", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q193670", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Frantz Fanon"}, {"id": "p-sekino-dadasi", "label": "세키노 다다시", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q5371556 http://lod.nl.go.kr/resource/KAC200104239 https://isni.org/isni/0000000080289828 http://viaf.org/viaf/38286911", "degree": 1, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC200104239", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q5371556", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-winckelmann", "label": "빙켈만", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q57280 http://lod.nl.go.kr/resource/KAC2018I6989 https://isni.org/isni/0000000122809108 http://viaf.org/viaf/64019631", "degree": 2, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC2018I6989", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q57280", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Johann Joachim Winckelmann"}, {"id": "p-yun-sejin", "label": "윤세진", "type": "critic", "ref": "", "degree": 1, "lod": [], "en": ""}], "edges": [{"source": "p-yun-sejin", "target": "cb3559", "type": "wrote", "weight": 1}, {"source": "cb3559", "target": "p-andre-eckardt", "type": "uses_theory", "weight": 1}, {"source": "cb3559", "target": "p-fanon", "type": "uses_theory", "weight": 1}, {"source": "cb3559", "target": "p-sekino-dadasi", "type": "uses_theory", "weight": 1}, {"source": "cb3559", "target": "p-winckelmann", "type": "uses_theory", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
    <section class="essay-grid">
      <h2 class="section-label">수록 비평글 (1편)</h2>
      
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2004</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb3559.html">『에카르트의 조선미술사』, 세끼노 타다시 『조선미술사』</a>
        </h3>
        <p class="essay-card-source">창작과비평 123호, 창비, 2004</p>
        <div class="essay-card-tags"><span class="tag">안드레 에카르트</span> <span class="tag">프란츠 파농</span> <span class="tag">세키노 다다시</span> <span class="tag">빙켈만</span></div>
      </article>
    </section>
  </main>

  <script src="/kc-shell.js"></script>
</body>
</html>
