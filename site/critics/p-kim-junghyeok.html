<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>김중혁 — 한국 비평사 온톨로지</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="/kc-shell.css">
</head>
<body>

  <main class="container index-main">
    <section class="critic-profile-hero">
      <div class="critic-profile-byline"><span class="chip role-critic">김중혁</span></div>
      <h1 class="index-heading">김중혁</h1>
      
      <div class="stat-row">
        <div class="stat"><span class="stat-num">1</span><span class="stat-label">수록 비평글</span></div>
        <div class="stat"><span class="stat-num">1</span><span class="stat-label">비평 대상 작가</span></div>
        <div class="stat"><span class="stat-num">0</span><span class="stat-label">활용 이론가</span></div>
      </div>
    </section>

    <section class="critic-profile-meta">
      <div class="meta-section">
        <h2 class="meta-label">주요 비평 대상</h2>
        <div class="chip-group"><span class="chip role-writer">김중혁</span></div>
      </div>
      <div class="meta-section">
        <h2 class="meta-label">자주 활용한 이론가</h2>
        <div class="chip-group"><span class="muted">—</span></div>
      </div>
    </section>
    
    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb3435", "label": "성장서사와 균열의 상상력", "type": "essay", "year": "2005", "degree": 6}, {"id": "cb3502", "label": "한국문학의 새로운 현실 읽기", "type": "essay", "year": "2006", "degree": 5}, {"id": "cb3555", "label": "김중혁 소설집 『펭귄뉴스』", "type": "essay", "year": "2006", "degree": 2}, {"id": "cb4280", "label": "김중혁 장편소설 『좀비들』", "type": "essay", "year": "2010", "degree": 2}, {"id": "cb4461", "label": "공감과 연대—21세기, 소설의 운명", "type": "essay", "year": "2011", "degree": 7}, {"id": "choe-seongsil_kim-junghyeok-beat-mania_2000", "label": "‘새로운 야만’을 꿈꾸는 비트 마니아", "type": "essay", "year": "2000", "degree": 6}, {"id": "kim-hyeongjung_kim-junghyeok-liberator-of-things_2006", "label": "사물들의 해방자, 김중혁론", "type": "essay", "year": "2006", "degree": 10}, {"id": "kim-junghyeok_writers-letter_2006", "label": "1925년산 축음기 크리덴저", "type": "essay", "year": "2006", "degree": 2}, {"id": "lee-gwangho_hybrid-writing-zero-gravity_2005", "label": "혼종적 글쓰기 혹은 무중력 공간의 탄생 — 2000년대 문학의 다른 이름들", "type": "essay", "year": "2005", "degree": 42}, {"id": "lee-suhyeong_beyond-media-fantasy_2005", "label": "미디어의 환상을 넘어서 — 김중혁·한유주·김애란의 소설", "type": "essay", "year": "2005", "degree": 8}, {"id": "p-kim-junghyeok", "label": "김중혁", "type": "critic", "ref": "", "degree": 12, "lod": [], "en": ""}, {"id": "woo-chanje_kim-junghyeok-museum-of-useless_2005", "label": "관음(觀音)의 묘사, 그 혼성 감각의 뿌리 — 김중혁의 「無用之物 博物館」", "type": "essay", "year": "2005", "degree": 2}], "edges": [{"source": "cb3435", "target": "p-kim-junghyeok", "type": "subject_of", "weight": 1}, {"source": "cb3502", "target": "p-kim-junghyeok", "type": "subject_of", "weight": 1}, {"source": "cb3555", "target": "p-kim-junghyeok", "type": "subject_of", "weight": 1}, {"source": "cb4280", "target": "p-kim-junghyeok", "type": "subject_of", "weight": 1}, {"source": "cb4461", "target": "p-kim-junghyeok", "type": "subject_of", "weight": 1}, {"source": "choe-seongsil_kim-junghyeok-beat-mania_2000", "target": "p-kim-junghyeok", "type": "subject_of", "weight": 1}, {"source": "kim-hyeongjung_kim-junghyeok-liberator-of-things_2006", "target": "p-kim-junghyeok", "type": "subject_of", "weight": 1}, {"source": "kim-junghyeok_writers-letter_2006", "target": "p-kim-junghyeok", "type": "subject_of", "weight": 1}, {"source": "lee-gwangho_hybrid-writing-zero-gravity_2005", "target": "p-kim-junghyeok", "type": "subject_of", "weight": 1}, {"source": "lee-suhyeong_beyond-media-fantasy_2005", "target": "p-kim-junghyeok", "type": "subject_of", "weight": 1}, {"source": "p-kim-junghyeok", "target": "kim-junghyeok_writers-letter_2006", "type": "wrote", "weight": 1}, {"source": "woo-chanje_kim-junghyeok-museum-of-useless_2005", "target": "p-kim-junghyeok", "type": "subject_of", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
    <section class="essay-grid">
      <h2 class="section-label">수록 비평글 (1편)</h2>
      
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2006</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/kim-junghyeok_writers-letter_2006.html">1925년산 축음기 크리덴저</a>
        </h3>
        <p class="essay-card-source">문학과사회 73호, 문학과지성사, 2006</p>
        <div class="essay-card-tags"><span class="tag">김중혁</span></div>
      </article>
    </section>
  </main>

  <script src="/kc-shell.js"></script>
</body>
</html>
