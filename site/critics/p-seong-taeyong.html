    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb2671", "label": "이우재 『이우재의 논어 읽기』, 김용옥 『도올 논어(1)』", "type": "essay", "year": "2001", "degree": 4}, {"id": "cb2717", "label": "김용옥 『도올 논어(2)』", "type": "essay", "year": "2001", "degree": 4}, {"id": "p-00093", "label": "칸트", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q9312 http://lod.nl.go.kr/resource/KAC199614392 https://isni.org/isni/0000000122824025 http://viaf.org/viaf/82088490", "degree": 51, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199614392", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q9312", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Immanuel Kant"}, {"id": "p-00230", "label": "막스 베버", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q9387 http://lod.nl.go.kr/resource/KAC199629452 https://isni.org/isni/000000012145101X http://viaf.org/viaf/100180950", "degree": 29, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199629452", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q9387", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Max Weber"}, {"id": "p-confucius", "label": "공자", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q4604 http://lod.nl.go.kr/resource/KAC199631156 https://isni.org/isni/0000000121430614 http://viaf.org/viaf/89664672", "degree": 17, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199631156", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q4604", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Confucius"}, {"id": "p-i-ujae", "label": "이우재", "type": "theorist", "ref": "http://lod.nl.go.kr/resource/KAC201205883 https://isni.org/isni/0000000463461736 http://viaf.org/viaf/109150747005016301025", "degree": 1, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201205883", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}, {"id": "p-kim-yongok", "label": "김용옥", "type": "critic", "ref": "https://www.wikidata.org/wiki/Q5285889 http://lod.nl.go.kr/resource/KAC201215921 https://isni.org/isni/0000000054558289 http://viaf.org/viaf/15056696", "degree": 12, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201215921", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q5285889", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-seong-taeyong", "label": "성태용", "type": "critic", "ref": "http://lod.nl.go.kr/resource/KAC201229651 https://isni.org/isni/0000000464452698 http://viaf.org/viaf/70152138532110981327", "degree": 2, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201229651", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}], "edges": [{"source": "p-seong-taeyong", "target": "cb2671", "type": "wrote", "weight": 1}, {"source": "p-seong-taeyong", "target": "cb2717", "type": "wrote", "weight": 1}, {"source": "cb2671", "target": "p-confucius", "type": "uses_theory", "weight": 1}, {"source": "cb2671", "target": "p-i-ujae", "type": "uses_theory", "weight": 1}, {"source": "cb2671", "target": "p-kim-yongok", "type": "uses_theory", "weight": 1}, {"source": "cb2717", "target": "p-00093", "type": "uses_theory", "weight": 1}, {"source": "cb2717", "target": "p-00230", "type": "uses_theory", "weight": 1}, {"source": "cb2717", "target": "p-kim-yongok", "type": "uses_theory", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
