<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="/kc-shell.css">
</head>
<body>

  <main class="container index-main">
    <section class="critic-profile-hero">
      <div class="critic-profile-byline"><span class="chip role-critic">이주혜</span></div>
      <h1 class="index-heading">이주혜</h1>
      <div class="lod-links"><a href="http://lod.nl.go.kr/resource/KAC201202730" target="_blank" class="lod-badge" title="국립중앙도서관 LOD">NLK LOD ↗</a> <a href="https://isni.org/isni/0000000460884223" target="_blank" class="lod-badge" title="ISNI">ISNI ↗</a> <a href="http://viaf.org/viaf/193150468354404172879" target="_blank" class="lod-badge" title="VIAF">VIAF ↗</a></div>
      <div class="stat-row">
        <div class="stat"><span class="stat-num">2</span><span class="stat-label">수록 비평글</span></div>
        <div class="stat"><span class="stat-num">2</span><span class="stat-label">비평 대상 작가</span></div>
        <div class="stat"><span class="stat-num">0</span><span class="stat-label">활용 이론가</span></div>
      </div>
    </section>

    <section class="critic-profile-meta">
      <div class="meta-section">
        <h2 class="meta-label">주요 비평 대상</h2>
        <div class="chip-group"><span class="chip role-writer">오드리 로드</span> <span class="chip role-writer">사만타 슈웨블린</span></div>
      </div>
      <div class="meta-section">
        <h2 class="meta-label">자주 활용한 이론가</h2>
        <div class="chip-group"><span class="muted">—</span></div>
      </div>
    </section>
    
    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb6036", "label": "삶의 전환을 꿈꾸는 돌봄의 상상력", "type": "essay", "year": "2021", "degree": 9}, {"id": "cb6055", "label": "사만타 슈웨블린 『피버 드림』", "type": "essay", "year": "2021", "degree": 2}, {"id": "cb7149", "label": "나를 쓰는 일은 어떻게 너를 쓰는 일이 되는가", "type": "essay", "year": "2025", "degree": 7}, {"id": "cb7205", "label": "오드리 로드 『나는 당신의 자매입니다』", "type": "essay", "year": "2025", "degree": 2}, {"id": "p-audre-lorde", "label": "오드리 로드", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q463319 http://lod.nl.go.kr/resource/KAC2018B2177 https://isni.org/isni/0000000115569521 http://viaf.org/viaf/61565157", "degree": 5, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC2018B2177", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q463319", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-i-juhye", "label": "이주혜", "type": "critic", "ref": "http://lod.nl.go.kr/resource/KAC201202730 https://isni.org/isni/0000000460884223 http://viaf.org/viaf/193150468354404172879", "degree": 4, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201202730", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}, {"id": "p-samantha-schweblin", "label": "사만타 슈웨블린", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q7408607 http://lod.nl.go.kr/resource/KAC202303399 https://isni.org/isni/0000000120266082", "degree": 1, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC202303399", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q7408607", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}], "edges": [{"source": "cb6036", "target": "p-i-juhye", "type": "subject_of", "weight": 1}, {"source": "cb7149", "target": "p-i-juhye", "type": "subject_of", "weight": 1}, {"source": "p-i-juhye", "target": "cb6055", "type": "wrote", "weight": 1}, {"source": "p-i-juhye", "target": "cb7205", "type": "wrote", "weight": 1}, {"source": "cb6055", "target": "p-samantha-schweblin", "type": "subject_of", "weight": 1}, {"source": "cb7205", "target": "p-audre-lorde", "type": "subject_of", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
    <section class="essay-grid">
      <h2 class="section-label">수록 비평글 (2편)</h2>
      
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2021</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb6055.html">사만타 슈웨블린 『피버 드림』</a>
        </h3>
        <p class="essay-card-source">창작과비평 192호, 창비, 2021</p>
        <div class="essay-card-tags"><span class="tag">사만타 슈웨블린</span></div>
      </article>
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2025</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb7205.html">오드리 로드 『나는 당신의 자매입니다』</a>
        </h3>
        <p class="essay-card-source">창작과비평 208호, 창비, 2025</p>
        <div class="essay-card-tags"><span class="tag">오드리 로드</span></div>
      </article>
    </section>
  </main>

  <script src="/kc-shell.js"></script>
</body>
</html>
