<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이정훈 — 한국 비평사 온톨로지</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="/kc-shell.css">
</head>
<body>

  <main class="container index-main">
    <section class="critic-profile-hero">
      <div class="critic-profile-byline"><span class="chip role-critic">이정훈</span></div>
      <h1 class="index-heading">이정훈</h1>
      
      <div class="stat-row">
        <div class="stat"><span class="stat-num">2</span><span class="stat-label">수록 비평글</span></div>
        <div class="stat"><span class="stat-num">0</span><span class="stat-label">비평 대상 작가</span></div>
        <div class="stat"><span class="stat-num">4</span><span class="stat-label">활용 이론가</span></div>
      </div>
    </section>

    <section class="critic-profile-meta">
      <div class="meta-section">
        <h2 class="meta-label">주요 비평 대상</h2>
        <div class="chip-group"><span class="muted">—</span></div>
      </div>
      <div class="meta-section">
        <h2 class="meta-label">자주 활용한 이론가</h2>
        <div class="chip-group"><span class="chip chip-term">백영서 (1)</span> <span class="chip chip-term">브래디 미카코 (1)</span> <span class="chip chip-term">조반니 아리기 (1)</span> <span class="chip chip-term">쑨거 (1)</span></div>
      </div>
    </section>
    
    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb4873", "label": "동아시아 담론, 온 길과 갈 길", "type": "essay", "year": "2014", "degree": 4}, {"id": "cb5948", "label": "시인과 시민, 어떻게 만날 것인가", "type": "essay", "year": "2020", "degree": 13}, {"id": "cb6747", "label": "브래디 미카코 『인생이 우리를 속일지라도』", "type": "essay", "year": "2022", "degree": 2}, {"id": "p-baek-yeongseo", "label": "백영서", "type": "critic", "ref": "https://www.wikidata.org/wiki/Q60992161 http://lod.nl.go.kr/resource/KAC201318789 https://isni.org/isni/0000000378130529 http://viaf.org/viaf/255956817", "degree": 47, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201318789", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q60992161", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-beuraedi-mikako", "label": "브래디 미카코", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q17215032 http://lod.nl.go.kr/resource/KAC202006487 http://viaf.org/viaf/258241575", "degree": 2, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC202006487", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q17215032", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-giovanni-arrighi", "label": "조반니 아리기", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q375310 http://lod.nl.go.kr/resource/KAC200704479 https://isni.org/isni/0000000116839001 http://viaf.org/viaf/90157203", "degree": 8, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC200704479", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q375310", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-i-jeonghun", "label": "이정훈", "type": "critic", "ref": "", "degree": 3, "lod": [], "en": ""}, {"id": "p-ssun-geo", "label": "쑨거", "type": "theorist", "ref": "http://lod.nl.go.kr/resource/KAC200309188 https://isni.org/isni/0000000083291878 http://viaf.org/viaf/117531683", "degree": 11, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC200309188", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}], "edges": [{"source": "cb5948", "target": "p-i-jeonghun", "type": "subject_of", "weight": 1}, {"source": "p-i-jeonghun", "target": "cb4873", "type": "wrote", "weight": 1}, {"source": "p-i-jeonghun", "target": "cb6747", "type": "wrote", "weight": 1}, {"source": "cb4873", "target": "p-baek-yeongseo", "type": "uses_theory", "weight": 1}, {"source": "cb4873", "target": "p-giovanni-arrighi", "type": "uses_theory", "weight": 1}, {"source": "cb4873", "target": "p-ssun-geo", "type": "uses_theory", "weight": 1}, {"source": "cb6747", "target": "p-beuraedi-mikako", "type": "uses_theory", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
    <section class="essay-grid">
      <h2 class="section-label">수록 비평글 (2편)</h2>
      
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2014</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb4873.html">동아시아 담론, 온 길과 갈 길</a>
        </h3>
        <p class="essay-card-source">창작과비평 163호, 창비, 2014</p>
        <div class="essay-card-tags"><span class="tag">백영서</span> <span class="tag">조반니 아리기</span> <span class="tag">쑨거</span></div>
      </article>
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2022</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb6747.html">브래디 미카코 『인생이 우리를 속일지라도』</a>
        </h3>
        <p class="essay-card-source">창작과비평 197호, 창비, 2022</p>
        <div class="essay-card-tags"><span class="tag">브래디 미카코</span></div>
      </article>
    </section>
  </main>

  <script src="/kc-shell.js"></script>
</body>
</html>
