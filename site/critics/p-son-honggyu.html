    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>

        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb3448", "label": "손홍규 소설집 『사람의 신화』", "type": "essay", "year": "2005", "degree": 2}, {"id": "cb4584", "label": "아모스 오즈 『시골생활 풍경』", "type": "essay", "year": "2012", "degree": 3}, {"id": "cb5176", "label": "바오 닌 외 『물결의 비밀』", "type": "essay", "year": "2016", "degree": 3}, {"id": "cb5842", "label": "손홍규 소설집 『톰은 톰과 잤다』", "type": "essay", "year": "2012", "degree": 2}, {"id": "p-amos-oz", "label": "아모스 오즈", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q151872 http://lod.nl.go.kr/resource/KAC200104216 https://isni.org/isni/0000000121007576 http://viaf.org/viaf/39382165", "degree": 1, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC200104216", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q151872", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-anderson", "label": "앤더슨", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q233898 http://lod.nl.go.kr/resource/KAC199600742 https://isni.org/isni/0000000108893083 http://viaf.org/viaf/39372890", "degree": 3, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199600742", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q233898", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Sherwood Anderson"}, {"id": "p-b-o-ninh", "label": "바오 닌", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q484988 http://lod.nl.go.kr/resource/KAC200711888 https://isni.org/isni/0000000110006586 http://viaf.org/viaf/99523950", "degree": 2, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC200711888", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q484988", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-saadat-hasan-manto", "label": "사다트 하산 만토", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q156501 http://lod.nl.go.kr/resource/KAC201614271 https://isni.org/isni/0000000108584934 http://viaf.org/viaf/71500079", "degree": 1, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201614271", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q156501", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-son-honggyu", "label": "손홍규", "type": "critic", "ref": "https://www.wikidata.org/wiki/Q41634609 http://lod.nl.go.kr/resource/KAC201103393 https://isni.org/isni/0000000060701918 http://viaf.org/viaf/88406416", "degree": 4, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201103393", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q41634609", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}], "edges": [{"source": "cb3448", "target": "p-son-honggyu", "type": "subject_of", "weight": 1}, {"source": "cb5842", "target": "p-son-honggyu", "type": "subject_of", "weight": 1}, {"source": "p-son-honggyu", "target": "cb4584", "type": "wrote", "weight": 1}, {"source": "p-son-honggyu", "target": "cb5176", "type": "wrote", "weight": 1}, {"source": "cb4584", "target": "p-amos-oz", "type": "subject_of", "weight": 1}, {"source": "cb4584", "target": "p-anderson", "type": "uses_theory", "weight": 1}, {"source": "cb5176", "target": "p-b-o-ninh", "type": "subject_of", "weight": 1}, {"source": "cb5176", "target": "p-saadat-hasan-manto", "type": "subject_of", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
