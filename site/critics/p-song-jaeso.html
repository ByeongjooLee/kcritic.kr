<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>송재소 — 한국 비평사 온톨로지</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="/kc-shell.css">
</head>
<body>

  <main class="container index-main">
    <section class="critic-profile-hero">
      <div class="critic-profile-byline"><span class="chip role-critic">송재소</span></div>
      <h1 class="index-heading">송재소</h1>
      
      <div class="stat-row">
        <div class="stat"><span class="stat-num">3</span><span class="stat-label">수록 비평글</span></div>
        <div class="stat"><span class="stat-num">1</span><span class="stat-label">비평 대상 작가</span></div>
        <div class="stat"><span class="stat-num">3</span><span class="stat-label">활용 이론가</span></div>
      </div>
    </section>

    <section class="critic-profile-meta">
      <div class="meta-section">
        <h2 class="meta-label">주요 비평 대상</h2>
        <div class="chip-group"><span class="chip role-writer">정약용</span></div>
      </div>
      <div class="meta-section">
        <h2 class="meta-label">자주 활용한 이론가</h2>
        <div class="chip-group"><span class="chip chip-term">박석무 (1)</span> <span class="chip chip-term">변영만 (1)</span> <span class="chip chip-term">지허 (1)</span></div>
      </div>
    </section>
    
    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb2759", "label": "박석무·정해렴 편역주 『다산시 정선』 상·하", "type": "essay", "year": "2001", "degree": 3}, {"id": "cb3109", "label": "지허 스님 『지허 스님의 차』", "type": "essay", "year": "2003", "degree": 2}, {"id": "cb4224", "label": "실시학사 고전문학연구회 역주 『변영만 전집』", "type": "essay", "year": "2006", "degree": 2}, {"id": "p-bak-seokmu", "label": "박석무", "type": "critic", "ref": "http://lod.nl.go.kr/resource/KAC201322921 https://isni.org/isni/0000000021909724 http://viaf.org/viaf/72712182", "degree": 4, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201322921", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}, {"id": "p-byeon-yeongman", "label": "변영만", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q12598197 http://lod.nl.go.kr/resource/KAC2018K3587 https://isni.org/isni/0000000479354169 http://viaf.org/viaf/5194154592516943370001", "degree": 1, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC2018K3587", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q12598197", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-jeong-yakyong", "label": "정약용", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q256246 https://encykorea.aks.ac.kr/Article/E0050549 http://lod.nl.go.kr/resource/KAC200105569 https://isni.org/isni/0000000081227936 http://viaf.org/viaf/44373880", "degree": 17, "lod": [{"href": "https://encykorea.aks.ac.kr/Article/E0050549", "label": "한", "full": "한국민족문화대백과", "bg": "#e8f0e8", "fg": "#2a5a2a"}, {"href": "http://lod.nl.go.kr/resource/KAC200105569", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q256246", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-ji-heo", "label": "지허", "type": "theorist", "ref": "http://lod.nl.go.kr/resource/KAC201226503 https://isni.org/isni/0000000084809720 http://viaf.org/viaf/118073292", "degree": 1, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201226503", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}, {"id": "p-song-jaeso", "label": "송재소", "type": "critic", "ref": "", "degree": 3, "lod": [], "en": ""}], "edges": [{"source": "p-song-jaeso", "target": "cb2759", "type": "wrote", "weight": 1}, {"source": "p-song-jaeso", "target": "cb3109", "type": "wrote", "weight": 1}, {"source": "p-song-jaeso", "target": "cb4224", "type": "wrote", "weight": 1}, {"source": "cb2759", "target": "p-bak-seokmu", "type": "uses_theory", "weight": 1}, {"source": "cb2759", "target": "p-jeong-yakyong", "type": "subject_of", "weight": 1}, {"source": "cb3109", "target": "p-ji-heo", "type": "uses_theory", "weight": 1}, {"source": "cb4224", "target": "p-byeon-yeongman", "type": "uses_theory", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
    <section class="essay-grid">
      <h2 class="section-label">수록 비평글 (3편)</h2>
      
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2001</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb2759.html">박석무·정해렴 편역주 『다산시 정선』 상·하</a>
        </h3>
        <p class="essay-card-source">창작과비평 113호, 창비, 2001</p>
        <div class="essay-card-tags"><span class="tag">정약용</span><span class="tag">박석무</span></div>
      </article>
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2003</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb3109.html">지허 스님 『지허 스님의 차』</a>
        </h3>
        <p class="essay-card-source">창작과비평 119호, 창비, 2003</p>
        <div class="essay-card-tags"><span class="tag">지허</span></div>
      </article>
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2006</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb4224.html">실시학사 고전문학연구회 역주 『변영만 전집』</a>
        </h3>
        <p class="essay-card-source">창작과비평 133호, 창비, 2006</p>
        <div class="essay-card-tags"><span class="tag">변영만</span></div>
      </article>
    </section>
  </main>

  <script src="/kc-shell.js"></script>
</body>
</html>
