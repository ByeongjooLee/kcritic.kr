<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>양재훈 — 한국 비평사 온톨로지</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="/kc-shell.css">
</head>
<body>

  <main class="container index-main">
    <section class="critic-profile-hero">
      <div class="critic-profile-byline"><span class="chip role-critic">양재훈</span></div>
      <h1 class="index-heading">양재훈</h1>
      
      <div class="stat-row">
        <div class="stat"><span class="stat-num">2</span><span class="stat-label">수록 비평글</span></div>
        <div class="stat"><span class="stat-num">2</span><span class="stat-label">비평 대상 작가</span></div>
        <div class="stat"><span class="stat-num">4</span><span class="stat-label">활용 이론가</span></div>
      </div>
    </section>

    <section class="critic-profile-meta">
      <div class="meta-section">
        <h2 class="meta-label">주요 비평 대상</h2>
        <div class="chip-group"><span class="chip role-writer">정태언</span> <span class="chip role-writer">성혜령</span></div>
      </div>
      <div class="meta-section">
        <h2 class="meta-label">자주 활용한 이론가</h2>
        <div class="chip-group"><span class="chip chip-term">헤겔 (1)</span> <span class="chip chip-term">발터 벤야민 (1)</span> <span class="chip chip-term">한영인 (1)</span> <span class="chip chip-term">슬라보이 지젝 (1)</span></div>
      </div>
    </section>
    
    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb5898", "label": "이성혁 『시적인 것과 정치적인 것』", "type": "essay", "year": "2020", "degree": 4}, {"id": "cb7017", "label": "막다른 골목에 처한 소설의 표정", "type": "essay", "year": "2024", "degree": 4}, {"id": "p-00065", "label": "헤겔", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q9235 http://lod.nl.go.kr/resource/KAC199611965 https://isni.org/isni/0000000122828149 http://viaf.org/viaf/89774942", "degree": 92, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199611965", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q9235", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Georg Wilhelm Friedrich Hegel"}, {"id": "p-00227", "label": "발터 벤야민", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q61078 http://lod.nl.go.kr/resource/KAC199602170 https://isni.org/isni/0000000121010732 http://viaf.org/viaf/46757196", "degree": 72, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199602170", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q61078", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Walter Benjamin"}, {"id": "p-han-yeongin", "label": "한영인", "type": "critic", "ref": "", "degree": 16, "lod": [], "en": ""}, {"id": "p-jeong-taeeon", "label": "정태언", "type": "writer", "ref": "http://lod.nl.go.kr/resource/KAC201327867 https://isni.org/isni/0000000475274284 http://viaf.org/viaf/576144928077154340137", "degree": 1, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201327867", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}, {"id": "p-seong-hyeryeong", "label": "성혜령", "type": "critic", "ref": "http://lod.nl.go.kr/resource/KAC202305282 https://isni.org/isni/0000000511055418", "degree": 3, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC202305282", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}, {"id": "p-seulraboye-jijek", "label": "슬라보예 지젝", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q184750 http://lod.nl.go.kr/resource/KAC199630983 https://isni.org/isni/0000000120954619 http://viaf.org/viaf/2478493", "degree": 32, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199630983", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q184750", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-yang-jaehun", "label": "양재훈", "type": "critic", "ref": "", "degree": 2, "lod": [], "en": ""}], "edges": [{"source": "p-yang-jaehun", "target": "cb5898", "type": "wrote", "weight": 1}, {"source": "p-yang-jaehun", "target": "cb7017", "type": "wrote", "weight": 1}, {"source": "cb5898", "target": "p-00065", "type": "uses_theory", "weight": 1}, {"source": "cb5898", "target": "p-00227", "type": "uses_theory", "weight": 1}, {"source": "cb5898", "target": "p-seulraboye-jijek", "type": "uses_theory", "weight": 1}, {"source": "cb7017", "target": "p-han-yeongin", "type": "uses_theory", "weight": 1}, {"source": "cb7017", "target": "p-jeong-taeeon", "type": "subject_of", "weight": 1}, {"source": "cb7017", "target": "p-seong-hyeryeong", "type": "subject_of", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
    <section class="essay-grid">
      <h2 class="section-label">수록 비평글 (2편)</h2>
      
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2020</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb5898.html">이성혁 『시적인 것과 정치적인 것』</a>
        </h3>
        <p class="essay-card-source">창작과비평 188호, 창비, 2020</p>
        <div class="essay-card-tags"><span class="tag">헤겔</span> <span class="tag">발터 벤야민</span> <span class="tag">슬라보이 지젝</span></div>
      </article>
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2024</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb7017.html">막다른 골목에 처한 소설의 표정</a>
        </h3>
        <p class="essay-card-source">창작과비평 204호, 창비, 2024</p>
        <div class="essay-card-tags"><span class="tag">정태언</span> <span class="tag">성혜령</span><span class="tag">한영인</span></div>
      </article>
    </section>
  </main>

  <script src="/kc-shell.js"></script>
</body>
</html>
