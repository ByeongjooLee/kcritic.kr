    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb3967", "label": "실천문학", "type": "essay", "year": "2006", "degree": 2}, {"id": "cb4005", "label": "정치적 올바름은 미학적 품격과 만날 수 있는가", "type": "essay", "year": "2009", "degree": 7}, {"id": "cb5206", "label": "더 넓어지고 깊어지자", "type": "essay", "year": "2015", "degree": 8}, {"id": "choe-seongsil_lee-seonguk-nomadic-criticism_2004", "label": "유쾌한 유목적 비평을 위하여 — 故 이성욱의 책들", "type": "essay", "year": "2004", "degree": 28}, {"id": "hong-jeongseon_contextual-reading-and-criticism_1996", "label": "맥락의 독서와 비평", "type": "essay", "year": "1996", "degree": 29}, {"id": "hong-jeongseon_reality-novel-after-june_1989", "label": "6월 항쟁 이후의 현실과 소설", "type": "essay", "year": "1989", "degree": 29}, {"id": "jeong-gwari_once-upon-literature_1998", "label": "옛날 옛적에 문학이 있었다", "type": "essay", "year": "1998", "degree": 32}, {"id": "jo-hyeongjun_kim-dongsik-cynicism-fascination_2003", "label": "욕망의 발견술 — 김동식, 『냉소와 매혹』", "type": "essay", "year": "2003", "degree": 13}, {"id": "kim-byeongik_roots-of-winter-tree_1992", "label": "‘겨울 나무’의 뿌리 키우기 — 진보주의적 사유의 새로운 시작을 위하여", "type": "essay", "year": "1992", "degree": 11}, {"id": "kim-byeongik_why-novelists-write_2001", "label": "소설가는 왜 소설을 쓰는가 — 이청준·김영현·김영하의 경우", "type": "essay", "year": "2001", "degree": 14}, {"id": "kim-juyeon_young-critics-map-metacriticism_2004", "label": "1990년대 이후 젊은 평단 지형 읽기 3 — 메타 비평의 유혹과 에고들의 매개", "type": "essay", "year": "2004", "degree": 75}, {"id": "kwon-seongwoo_berlin-jeonnohyeop-kim-younghyun_1990", "label": "베를린·전노협, 그리고 김영현 — 90년대 사회와 문학", "type": "essay", "year": "1990", "degree": 11}, {"id": "p-kim-yeonghyeon", "label": "김영현", "type": "critic", "ref": "", "degree": 15, "lod": [], "en": ""}, {"id": "p-mencius", "label": "맹자", "type": "theorist", "ref": "", "degree": 6, "lod": [], "en": ""}, {"id": "park-hyekyung_young-criticism-scene_2001", "label": "젊은 비평의 현장 — 김미현·김태환·오형엽의 비평집", "type": "essay", "year": "2001", "degree": 20}, {"id": "sim-jingyeong_90s-literature-three-gazes_2004", "label": "역사, 육체, 욕망 — ‘90년대 문학’을 따라가는 세 개의 시선", "type": "essay", "year": "2004", "degree": 18}, {"id": "woo-chanje_schizophrenic-flight-poetics-of-idleness_2004", "label": "분열증적 탈주, 혹은 무위(無爲)의 시학", "type": "essay", "year": "2004", "degree": 28}], "edges": [{"source": "cb4005", "target": "p-kim-yeonghyeon", "type": "subject_of", "weight": 1}, {"source": "cb5206", "target": "p-kim-yeonghyeon", "type": "subject_of", "weight": 1}, {"source": "choe-seongsil_lee-seonguk-nomadic-criticism_2004", "target": "p-kim-yeonghyeon", "type": "subject_of", "weight": 1}, {"source": "hong-jeongseon_contextual-reading-and-criticism_1996", "target": "p-kim-yeonghyeon", "type": "subject_of", "weight": 1}, {"source": "hong-jeongseon_reality-novel-after-june_1989", "target": "p-kim-yeonghyeon", "type": "subject_of", "weight": 1}, {"source": "jeong-gwari_once-upon-literature_1998", "target": "p-kim-yeonghyeon", "type": "subject_of", "weight": 1}, {"source": "jo-hyeongjun_kim-dongsik-cynicism-fascination_2003", "target": "p-kim-yeonghyeon", "type": "subject_of", "weight": 1}, {"source": "kim-byeongik_roots-of-winter-tree_1992", "target": "p-kim-yeonghyeon", "type": "subject_of", "weight": 1}, {"source": "kim-byeongik_why-novelists-write_2001", "target": "p-kim-yeonghyeon", "type": "subject_of", "weight": 1}, {"source": "kim-juyeon_young-critics-map-metacriticism_2004", "target": "p-kim-yeonghyeon", "type": "subject_of", "weight": 1}, {"source": "kwon-seongwoo_berlin-jeonnohyeop-kim-younghyun_1990", "target": "p-kim-yeonghyeon", "type": "subject_of", "weight": 1}, {"source": "p-kim-yeonghyeon", "target": "cb3967", "type": "wrote", "weight": 1}, {"source": "park-hyekyung_young-criticism-scene_2001", "target": "p-kim-yeonghyeon", "type": "subject_of", "weight": 1}, {"source": "sim-jingyeong_90s-literature-three-gazes_2004", "target": "p-kim-yeonghyeon", "type": "subject_of", "weight": 1}, {"source": "woo-chanje_schizophrenic-flight-poetics-of-idleness_2004", "target": "p-kim-yeonghyeon", "type": "subject_of", "weight": 1}, {"source": "cb3967", "target": "p-mencius", "type": "uses_theory", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
    <section class="essay-grid">

      <article class="essay-card">

          <span class="essay-card-year">2006</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb3967.html">실천문학</a>
        </h3>
        <p class="essay-card-source">창작과비평 131호, 창비, 2006</p>
        <div class="essay-card-tags"><span class="tag">맹자</span></div>
      </article>
    </section>
  </main>

</body>
