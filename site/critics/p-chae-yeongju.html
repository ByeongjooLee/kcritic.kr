    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "chae-yeongju_writers-letter_2002", "label": "작가의 편지", "type": "essay", "year": "2002", "degree": 2}, {"id": "choe-seongsil_lee-seonguk-nomadic-criticism_2004", "label": "유쾌한 유목적 비평을 위하여 — 故 이성욱의 책들", "type": "essay", "year": "2004", "degree": 28}, {"id": "han-suyeong_chae-yeongju-memorial_2002", "label": "다시 시작된 긴 여행, 혹은 바람의 넋", "type": "essay", "year": "2002", "degree": 3}, {"id": "hong-jeongseon_reality-novel-after-june_1989", "label": "6월 항쟁 이후의 현실과 소설", "type": "essay", "year": "1989", "degree": 29}, {"id": "hwang-jongyeon_return-to-individual-subject_1993", "label": "개인 주체로의 방법적 귀환 — 구효서·박상우·신경숙·채영주의 소설에 대한 고찰", "type": "essay", "year": "1993", "degree": 5}, {"id": "jeong-gwari_chae-yeongju-endless-return_2002", "label": "끝없는 귀환 — 채영주론", "type": "essay", "year": "2002", "degree": 9}, {"id": "kim-chisu_living-in-absence-of-father_1995", "label": "아버지 부재 속에서 살기 — 채영주의 『목마들의 언덕』과 김소진의 『고아떤 뺑덕어멈』", "type": "essay", "year": "1995", "degree": 5}, {"id": "kim-juyeon_collapse-of-sexual-mores-perspectivism_1997", "label": "성관습의 붕괴와 원근법주의 — 세기말의 젊은 소설가들", "type": "essay", "year": "1997", "degree": 9}, {"id": "kim-juyeon_internet-public-literary-practice_2004", "label": "인터넷 대중과 문학적 실천 — 새로운 소설 징후들을 보면서", "type": "essay", "year": "2004", "degree": 22}, {"id": "kwon-oryong_kim-juyeon-fake-truth_1998", "label": "전환의 모색, 그리고 그 모호함 — 김주연 평론집 『가짜의 진실, 그 환상』", "type": "essay", "year": "1998", "degree": 12}, {"id": "kwon-oryong_shaping-despair-chaos_1990", "label": "절망과 혼돈의 형태화", "type": "essay", "year": "1990", "degree": 3}, {"id": "p-chae-yeongju", "label": "채영주", "type": "critic", "ref": "http://lod.nl.go.kr/resource/KAC201719130 https://isni.org/isni/000000046435561X http://viaf.org/viaf/22151351954352600929", "degree": 13, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201719130", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}, {"id": "park-cheolhwa_fight-with-guilt_1991", "label": "죄의식과의 싸움 — 새로운       var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
