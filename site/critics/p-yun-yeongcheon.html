    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb2972", "label": "유종호 『다시 읽는 한국시인』", "type": "essay", "year": "2002", "degree": 6}, {"id": "cb3306", "label": "시와 시대, 그리고 인간", "type": "essay", "year": "2005", "degree": 6}, {"id": "kim-cheol_division-literary-history_1988", "label": "분단문학사의 극복을 위하여", "type": "essay", "year": "1988", "degree": 31}, {"id": "p-00015", "label": "백석", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q489436 https://encykorea.aks.ac.kr/Article/E0022163 http://lod.nl.go.kr/resource/KAC200004747 https://isni.org/isni/0000000116844329 http://viaf.org/viaf/294719363", "degree": 22, "lod": [{"href": "https://encykorea.aks.ac.kr/Article/E0022163", "label": "한", "full": "한국민족문화대백과", "bg": "#e8f0e8", "fg": "#2a5a2a"}, {"href": "http://lod.nl.go.kr/resource/KAC200004747", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q489436", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-gombrich", "label": "곰브리치", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q78504 http://lod.nl.go.kr/resource/KAC199610373 https://isni.org/isni/0000000121462958 http://viaf.org/viaf/105135635", "degree": 7, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199610373", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q78504", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Ernst Gombrich"}, {"id": "p-imhwa", "label": "임화", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q15433904 https://encykorea.aks.ac.kr/Article/E0047762 http://lod.nl.go.kr/resource/KAC201108905 https://isni.org/isni/0000000084484348 http://viaf.org/viaf/43854035", "degree": 46, "lod": [{"href": "https://encykorea.aks.ac.kr/Article/E0047762", "label": "한", "full": "한국민족문화대백과", "bg": "#e8f0e8", "fg": "#2a5a2a"}, {"href": "http://lod.nl.go.kr/resource/KAC201108905", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q15433904", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-oh-janghwan", "label": "오장환", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q16220141 http://lod.nl.go.kr/resource/KAC201108382 https://isni.org/isni/0000000114448007 http://viaf.org/viaf/56166928", "degree": 8, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201108382", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q16220141", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-yun-yeongcheon", "label": "윤영천", "type": "critic", "ref": "http://lod.nl.go.kr/resource/KAC201116381 https://isni.org/isni/0000000027769945 http://viaf.org/viaf/75389768", "degree": 3, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201116381", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}, {"id": "p-이용악", "label": "이용악", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q12612167 http://lod.nl.go.kr/resource/KAC201108909 https://isni.org/isni/0000000082440886 http://viaf.org/viaf/60381849", "degree": 11, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201108909", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q12612167", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}], "edges": [{"source": "cb3306", "target": "p-yun-yeongcheon", "type": "uses_theory", "weight": 1}, {"source": "kim-cheol_division-literary-history_1988", "target": "p-yun-yeongcheon", "type": "uses_theory", "weight": 1}, {"source": "p-yun-yeongcheon", "target": "cb2972", "type": "wrote", "weight": 1}, {"source": "cb2972", "target": "p-00015", "type": "subject_of", "weight": 1}, {"source": "cb2972", "target": "p-gombrich", "type": "uses_theory", "weight": 1}, {"source": "cb2972", "target": "p-imhwa", "type": "subject_of", "weight": 1}, {"source": "cb2972", "target": "p-oh-janghwan", "type": "subject_of", "weight": 1}, {"source": "cb2972", "target": "p-이용악", "type": "subject_of", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
