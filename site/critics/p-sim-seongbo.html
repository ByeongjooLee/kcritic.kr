<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>심성보 — 한국 비평사 온톨로지</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="/kc-shell.css">
</head>
<body>

  <main class="container index-main">
    <section class="critic-profile-hero">
      <div class="critic-profile-byline"><span class="chip role-critic">심성보</span></div>
      <h1 class="index-heading">심성보</h1>
      
      <div class="stat-row">
        <div class="stat"><span class="stat-num">2</span><span class="stat-label">수록 비평글</span></div>
        <div class="stat"><span class="stat-num">0</span><span class="stat-label">비평 대상 작가</span></div>
        <div class="stat"><span class="stat-num">6</span><span class="stat-label">활용 이론가</span></div>
      </div>
    </section>

    <section class="critic-profile-meta">
      <div class="meta-section">
        <h2 class="meta-label">주요 비평 대상</h2>
        <div class="chip-group"><span class="muted">—</span></div>
      </div>
      <div class="meta-section">
        <h2 class="meta-label">자주 활용한 이론가</h2>
        <div class="chip-group"><span class="chip chip-term">벤담 (1)</span> <span class="chip chip-term">푸코 (1)</span> <span class="chip chip-term">마거릿 대처 (1)</span> <span class="chip chip-term">노무현 (1)</span> <span class="chip chip-term">오언 존스 (1)</span> <span class="chip chip-term">지그문트 바우만 (1)</span></div>
      </div>
    </section>
    
    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb3177", "label": "네이스의 반인권성과 비교육성", "type": "essay", "year": "2003", "degree": 4}, {"id": "cb5142", "label": "오언 존스 『차브: 영국식 잉여 유발사건』", "type": "essay", "year": "2015", "degree": 4}, {"id": "p-bentham", "label": "제러미 벤쌈", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q60887 http://lod.nl.go.kr/resource/KAC199602226 https://isni.org/isni/0000000122805406 http://viaf.org/viaf/59078842", "degree": 4, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199602226", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q60887", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Jeremy Bentham"}, {"id": "p-m-foucault", "label": "푸코", "type": "theorist", "ref": "", "degree": 22, "lod": [], "en": ""}, {"id": "p-mageorit-daecheo", "label": "마거릿 대처", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q7416 http://lod.nl.go.kr/resource/KAC201418770 https://isni.org/isni/0000000121459353 http://viaf.org/viaf/102379347", "degree": 4, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201418770", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q7416", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-no-muhyeon", "label": "노무현", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q14345 http://lod.nl.go.kr/resource/KAC201100150 https://isni.org/isni/0000000121219755 http://viaf.org/viaf/15704800", "degree": 58, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201100150", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q14345", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-owen-jones", "label": "오언 존스", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q1518861 http://lod.nl.go.kr/resource/KAC201501972 https://isni.org/isni/0000000123183864 http://viaf.org/viaf/69317323", "degree": 2, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201501972", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q1518861", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-sim-seongbo", "label": "심성보", "type": "critic", "ref": "", "degree": 2, "lod": [], "en": ""}, {"id": "p-zygmunt-bauman", "label": "지그문트 바우만", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q158092 http://lod.nl.go.kr/resource/KAC200204409 https://isni.org/isni/0000000121327983 http://viaf.org/viaf/51744696", "degree": 17, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC200204409", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q158092", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}], "edges": [{"source": "p-sim-seongbo", "target": "cb3177", "type": "wrote", "weight": 1}, {"source": "p-sim-seongbo", "target": "cb5142", "type": "wrote", "weight": 1}, {"source": "cb3177", "target": "p-bentham", "type": "uses_theory", "weight": 1}, {"source": "cb3177", "target": "p-m-foucault", "type": "uses_theory", "weight": 1}, {"source": "cb3177", "target": "p-no-muhyeon", "type": "uses_theory", "weight": 1}, {"source": "cb5142", "target": "p-mageorit-daecheo", "type": "uses_theory", "weight": 1}, {"source": "cb5142", "target": "p-owen-jones", "type": "uses_theory", "weight": 1}, {"source": "cb5142", "target": "p-zygmunt-bauman", "type": "uses_theory", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
    <section class="essay-grid">
      <h2 class="section-label">수록 비평글 (2편)</h2>
      
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2003</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb3177.html">네이스의 반인권성과 비교육성</a>
        </h3>
        <p class="essay-card-source">창작과비평 121호, 창비, 2003</p>
        <div class="essay-card-tags"><span class="tag">벤담</span> <span class="tag">푸코</span> <span class="tag">노무현</span></div>
      </article>
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2015</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb5142.html">오언 존스 『차브: 영국식 잉여 유발사건』</a>
        </h3>
        <p class="essay-card-source">창작과비평 167호, 창비, 2015</p>
        <div class="essay-card-tags"><span class="tag">마거릿 대처</span> <span class="tag">오언 존스</span> <span class="tag">지그문트 바우만</span></div>
      </article>
    </section>
  </main>

  <script src="/kc-shell.js"></script>
</body>
</html>
