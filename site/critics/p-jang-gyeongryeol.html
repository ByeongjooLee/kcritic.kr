<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>장경렬 — 한국 비평사 온톨로지</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">

  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="/kc-shell.css">
</head>
<body>

  <main class="container index-main">
    <section class="critic-profile-hero">
      <div class="critic-profile-byline"><span class="chip role-critic">장경렬</span></div>
      <h1 class="index-heading">장경렬</h1>
      <div class="lod-links"><a href="http://lod.nl.go.kr/resource/KAC201011018" target="_blank" class="lod-badge" title="국립중앙도서관 LOD">NLK LOD ↗</a> <a href="https://isni.org/isni/0000000373985958" target="_blank" class="lod-badge" title="ISNI">ISNI ↗</a> <a href="http://viaf.org/viaf/34307384" target="_blank" class="lod-badge" title="VIAF">VIAF ↗</a></div>
      <div class="stat-row">
        <div class="stat"><span class="stat-num">1</span><span class="stat-label">수록 비평글</span></div>
        <div class="stat"><span class="stat-num">1</span><span class="stat-label">비평 대상 작가</span></div>
        <div class="stat"><span class="stat-num">2</span><span class="stat-label">활용 이론가</span></div>
      </div>
    </section>

    <section class="critic-profile-meta">
      <div class="meta-section">
        <h2 class="meta-label">주요 비평 대상</h2>
        <div class="chip-group"><span class="chip role-writer">서정인</span></div>
      </div>
      <div class="meta-section">
        <h2 class="meta-label">자주 활용한 이론가</h2>
        <div class="chip-group"><span class="chip chip-term">퍼시 라복 (1)</span> <span class="chip chip-term">웨인 부드 (1)</span></div>
      </div>
    </section>
    
    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "jang-gyeongryeol_experimental-novel_1989", "label": "소설상의 실험과 실험적 소설의 가능성 — 서정인의 『달궁』론", "type": "essay", "year": "1989", "degree": 4}, {"id": "p-00145", "label": "퍼시 라보크", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q7167464 https://isni.org/isni/0000000109015792 http://viaf.org/viaf/52583077", "degree": 6, "lod": [{"href": "https://www.wikidata.org/wiki/Q7167464", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Percy Lubbock"}, {"id": "p-booth", "label": "웨인 부드", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q200918 http://lod.nl.go.kr/resource/KAC199602995 https://isni.org/isni/0000000109278162 http://viaf.org/viaf/97690335", "degree": 4, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199602995", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q200918", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Wayne C. Booth"}, {"id": "p-jang-gyeongryeol", "label": "장경렬", "type": "critic", "ref": "http://lod.nl.go.kr/resource/KAC201011018 https://isni.org/isni/0000000373985958 http://viaf.org/viaf/34307384", "degree": 1, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201011018", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}, {"id": "p-seo-jeongin", "label": "서정인", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q12601454 http://lod.nl.go.kr/resource/KAC201110794 https://isni.org/isni/0000000066504376 http://viaf.org/viaf/93279578", "degree": 10, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201110794", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q12601454", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}], "edges": [{"source": "p-jang-gyeongryeol", "target": "jang-gyeongryeol_experimental-novel_1989", "type": "wrote", "weight": 1}, {"source": "jang-gyeongryeol_experimental-novel_1989", "target": "p-00145", "type": "uses_theory", "weight": 1}, {"source": "jang-gyeongryeol_experimental-novel_1989", "target": "p-booth", "type": "uses_theory", "weight": 1}, {"source": "jang-gyeongryeol_experimental-novel_1989", "target": "p-seo-jeongin", "type": "subject_of", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
    <section class="essay-grid">
      <h2 class="section-label">수록 비평글 (1편)</h2>
      
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">1989</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/jang-gyeongryeol_experimental-novel_1989.html">소설상의 실험과 실험적 소설의 가능성 — 서정인의 『달궁』론</a>
        </h3>
        <p class="essay-card-source">문학과사회 6호, 문학과지성사, 1989</p>
        <div class="essay-card-tags"><span class="tag">서정인</span><span class="tag">퍼시 라복</span> <span class="tag">웨인 부드</span></div>
      </article>
    </section>
  </main>

  <script src="/kc-shell.js"></script>
</body>
</html>
