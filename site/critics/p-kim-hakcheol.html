    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb2807", "label": "김학철 산문집 『우렁이 속 같은 세상』", "type": "essay", "year": "2001", "degree": 2}, {"id": "cb2969", "label": "옌뼨, 동아시아의 빛과 그늘", "type": "essay", "year": "2002", "degree": 8}, {"id": "cb5102", "label": "김학철 『아무것도 아닌 것들의 기쁨』", "type": "essay", "year": "2016", "degree": 3}, {"id": "cb5223", "label": "민주적 사회주의자의 길", "type": "essay", "year": "2015", "degree": 7}, {"id": "cb5307", "label": "김근수 외 『지금, 한국의 종교』", "type": "essay", "year": "2017", "degree": 5}, {"id": "cb6970", "label": "이춘 『김명시』", "type": "essay", "year": "2024", "degree": 3}, {"id": "choe-wonsik_restoration-army-and-korean-volunteers_1995", "label": "광복군과 조선의용대", "type": "essay", "year": "1995", "degree": 6}, {"id": "hong-jeongseon_reality-novel-after-june_1989", "label": "6월 항쟁 이후의 현실과 소설", "type": "essay", "year": "1989", "degree": 29}, {"id": "p-diane-moore", "label": "다이앤 무어", "type": "theorist", "ref": "", "degree": 1, "lod": [], "en": ""}, {"id": "p-gim-geunsu", "label": "김근수", "type": "theorist", "ref": "", "degree": 1, "lod": [], "en": ""}, {"id": "p-gim-jinho", "label": "김진호", "type": "critic", "ref": "http://lod.nl.go.kr/resource/KAC201216170 https://isni.org/isni/0000000467636185 http://viaf.org/viaf/386144928078954341433", "degree": 4, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201216170", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}, {"id": "p-jo-seongtaek", "label": "조성택", "type": "theorist", "ref": "", "degree": 1, "lod": [], "en": ""}, {"id": "p-kim-hakcheol", "label": "김학철", "type": "critic", "ref": "https://www.wikidata.org/wiki/Q16261191 http://lod.nl.go.kr/resource/KAC201407190 https://isni.org/isni/0000000037141262 http://viaf.org/viaf/1569578", "degree": 8, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201407190", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q16261191", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}], "edges": [{"source": "cb2807", "target": "p-kim-hakcheol", "type": "subject_of", "weight": 1}, {"source": "cb2969", "target": "p-kim-hakcheol", "type": "subject_of", "weight": 1}, {"source": "cb5102", "target": "p-kim-hakcheol", "type": "subject_of", "weight": 1}, {"source": "cb5223", "target": "p-kim-hakcheol", "type": "subject_of", "weight": 1}, {"source": "cb6970", "target": "p-kim-hakcheol", "type": "subject_of", "weight": 1}, {"source": "choe-wonsik_restoration-army-and-korean-volunteers_1995", "target": "p-kim-hakcheol", "type": "subject_of", "weight": 1}, {"source": "hong-jeongseon_reality-novel-after-june_1989", "target": "p-kim-hakcheol", "type": "subject_of", "weight": 1}, {"source": "p-kim-hakcheol", "target": "cb5307", "type": "wrote", "weight": 1}, {"source": "cb5307", "target": "p-diane-moore", "type": "uses_theory", "weight": 1}, {"source": "cb5307", "target": "p-gim-geunsu", "type": "uses_theory", "weight": 1}, {"source": "cb5307", "target": "p-gim-jinho", "type": "uses_theory", "weight": 1}, {"source": "cb5307", "target": "p-jo-seongtaek", "type": "uses_theory", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
