    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb2598", "label": "임형택 『실사구시의 한국학』", "type": "essay", "year": "2000", "degree": 2}, {"id": "cb3377", "label": "박희병 『운화와 근대』", "type": "essay", "year": "2003", "degree": 3}, {"id": "cb4757", "label": "박희병 『범애와 평등: 홍대용의 사회사상』", "type": "essay", "year": "2013", "degree": 3}, {"id": "cb5656", "label": "박희병 『능호관 이인상 서화평석』", "type": "essay", "year": "2018", "degree": 9}, {"id": "cb7403", "label": "홍대용의 사상적 분투와 혁신성", "type": "essay", "year": "2026", "degree": 7}, {"id": "p-gang-myeonggwan", "label": "강명관", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q112450776 http://lod.nl.go.kr/resource/KAC201221034 https://isni.org/isni/0000000054445583 http://viaf.org/viaf/4850031", "degree": 3, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201221034", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q112450776", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-gim-myeongho", "label": "김명호", "type": "theorist", "ref": "http://lod.nl.go.kr/resource/KAC201228479 https://isni.org/isni/0000000073294434 http://viaf.org/viaf/121856323", "degree": 6, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201228479", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}, {"id": "p-hong-daeyong", "label": "홍대용", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q5894051 http://lod.nl.go.kr/resource/KAC200107573 https://isni.org/isni/0000000023518970 http://viaf.org/viaf/62939013", "degree": 5, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC200107573", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q5894051", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-im-hyeongtaek", "label": "임형택", "type": "critic", "ref": "", "degree": 22, "lod": [], "en": ""}, {"id": "p-mozi", "label": "묵자", "type": "theorist", "ref": "", "degree": 2, "lod": [], "en": ""}, {"id": "p-park-huibyeong", "label": "박희병", "type": "critic", "ref": "", "degree": 6, "lod": [], "en": ""}, {"id": "p-zhuangzi", "label": "장자", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q47739 http://lod.nl.go.kr/resource/KAC200601687 https://isni.org/isni/0000000108862375 http://viaf.org/viaf/100166339", "degree": 12, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC200601687", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q47739", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Zhuang Zhou"}, {"id": "p-zhuxi", "label": "주희", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q9397 http://lod.nl.go.kr/resource/KAC199632197 https://isni.org/isni/0000000121309654 http://viaf.org/viaf/46768804", "degree": 14, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199632197", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q9397", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Zhu Xi"}, {"id": "yu-jungha_lu-xun-images-korea_1998", "label": "우리가 ‘끌어다 쓴’ 루쉰상(像)에 대한 점묘(상)", "type": "essay", "year": "1998", "degree": 43}], "edges": [{"source": "cb3377", "target": "p-park-huibyeong", "type": "uses_theory", "weight": 1}, {"source": "cb4757", "target": "p-park-huibyeong", "type": "uses_theory", "weight": 1}, {"source": "cb5656", "target": "p-park-huibyeong", "type": "uses_theory", "weight": 1}, {"source": "p-park-huibyeong", "target": "cb2598", "type": "wrote", "weight": 1}, {"source": "p-park-huibyeong", "target": "cb7403", "type": "wrote", "weight": 1}, {"source": "yu-jungha_lu-xun-images-korea_1998", "target": "p-park-huibyeong", "type": "uses_theory", "weight": 1}, {"source": "cb2598", "target": "p-im-hyeongtaek", "type": "uses_theory", "weight": 1}, {"source": "cb7403", "target": "p-gang-myeonggwan", "type": "uses_theory", "weight": 1}, {"source": "cb7403", "target": "p-gim-myeongho", "type": "uses_theory", "weight": 1}, {"source": "cb7403", "target": "p-hong-daeyong", "type": "uses_theory", "weight": 1}, {"source": "cb7403", "target": "p-mozi", "type": "uses_theory", "weight": 1}, {"source": "cb7403", "target": "p-zhuangzi", "type": "uses_theory", "weight": 1}, {"source": "cb7403", "target": "p-zhuxi", "type": "uses_theory", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
