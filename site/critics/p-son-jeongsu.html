<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>손정수 — 한국 비평사 온톨로지</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="/kc-shell.css">
</head>
<body>

  <main class="container index-main">
    <section class="critic-profile-hero">
      <div class="critic-profile-byline"><span class="chip role-critic">손정수</span></div>
      <h1 class="index-heading">손정수</h1>
      
      <div class="stat-row">
        <div class="stat"><span class="stat-num">2</span><span class="stat-label">수록 비평글</span></div>
        <div class="stat"><span class="stat-num">4</span><span class="stat-label">비평 대상 작가</span></div>
        <div class="stat"><span class="stat-num">1</span><span class="stat-label">활용 이론가</span></div>
      </div>
    </section>

    <section class="critic-profile-meta">
      <div class="meta-section">
        <h2 class="meta-label">주요 비평 대상</h2>
        <div class="chip-group"><span class="chip role-writer">카프카</span> <span class="chip role-writer">최수철</span> <span class="chip role-writer">정영문</span> <span class="chip role-writer">김중혁</span></div>
      </div>
      <div class="meta-section">
        <h2 class="meta-label">자주 활용한 이론가</h2>
        <div class="chip-group"><span class="chip chip-term">벤야민 (1)</span></div>
      </div>
    </section>
    
    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb3555", "label": "김중혁 소설집 『펭귄뉴스』", "type": "essay", "year": "2006", "degree": 2}, {"id": "p-00092", "label": "카프카", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q905 http://lod.nl.go.kr/resource/KAC199614306 https://isni.org/isni/000000012280370X http://viaf.org/viaf/56611857", "degree": 35, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199614306", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q905", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Franz Kafka"}, {"id": "p-00227", "label": "발터 벤야민", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q61078 http://lod.nl.go.kr/resource/KAC199602170 https://isni.org/isni/0000000121010732 http://viaf.org/viaf/46757196", "degree": 33, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199602170", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q61078", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Walter Benjamin"}, {"id": "p-choe-sucheol", "label": "최수철", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q12619631 http://lod.nl.go.kr/resource/KAC201103401 https://isni.org/isni/0000000067521725 http://viaf.org/viaf/13839071", "degree": 14, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201103401", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q12619631", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-jeong-yeongmun", "label": "정영문", "type": "writer", "ref": "", "degree": 4, "lod": [], "en": ""}, {"id": "p-kim-junghyeok", "label": "김중혁", "type": "writer", "ref": "", "degree": 6, "lod": [], "en": ""}, {"id": "p-son-jeongsu", "label": "손정수", "type": "critic", "ref": "", "degree": 2, "lod": [], "en": ""}, {"id": "son-jeongsu_choe-sucheol-jeong-yeongmun_1999", "label": "어두운 내면을 향해 찍힌 두 개의 발자국 — 최수철의 『분신들』과 정영문의 『검은 이야기 사슬』", "type": "essay", "year": "1999", "degree": 5}], "edges": [{"source": "p-son-jeongsu", "target": "cb3555", "type": "wrote", "weight": 1}, {"source": "p-son-jeongsu", "target": "son-jeongsu_choe-sucheol-jeong-yeongmun_1999", "type": "wrote", "weight": 1}, {"source": "cb3555", "target": "p-kim-junghyeok", "type": "subject_of", "weight": 1}, {"source": "son-jeongsu_choe-sucheol-jeong-yeongmun_1999", "target": "p-00092", "type": "subject_of", "weight": 1}, {"source": "son-jeongsu_choe-sucheol-jeong-yeongmun_1999", "target": "p-00227", "type": "uses_theory", "weight": 1}, {"source": "son-jeongsu_choe-sucheol-jeong-yeongmun_1999", "target": "p-choe-sucheol", "type": "subject_of", "weight": 1}, {"source": "son-jeongsu_choe-sucheol-jeong-yeongmun_1999", "target": "p-jeong-yeongmun", "type": "subject_of", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
    <section class="essay-grid">
      <h2 class="section-label">수록 비평글 (2편)</h2>
      
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">1999</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/son-jeongsu_choe-sucheol-jeong-yeongmun_1999.html">어두운 내면을 향해 찍힌 두 개의 발자국 — 최수철의 『분신들』과 정영문의 『검은 이야기 사슬』</a>
        </h3>
        <p class="essay-card-source">문학과사회 45호, 문학과지성사, 1999</p>
        <div class="essay-card-tags"><span class="tag">카프카</span> <span class="tag">최수철</span> <span class="tag">정영문</span><span class="tag">벤야민</span></div>
      </article>
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2006</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb3555.html">김중혁 소설집 『펭귄뉴스』</a>
        </h3>
        <p class="essay-card-source">창작과비평 132호, 창비, 2006</p>
        <div class="essay-card-tags"><span class="tag">김중혁</span></div>
      </article>
    </section>
  </main>

  <script src="/kc-shell.js"></script>
</body>
</html>
