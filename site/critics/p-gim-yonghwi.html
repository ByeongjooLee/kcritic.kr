    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb6231", "label": "김용옥 『용담유사』", "type": "essay", "year": "2022", "degree": 3}, {"id": "cb6305", "label": "문명전환기의 감각에 대하여", "type": "essay", "year": "2022", "degree": 5}, {"id": "cb7296", "label": "김용휘 『평민철학자 해월 최시형』", "type": "essay", "year": "2025", "degree": 3}, {"id": "p-00161", "label": "니체", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q9358 http://lod.nl.go.kr/resource/KAC199620237 https://isni.org/isni/0000000122828181 http://viaf.org/viaf/89798474", "degree": 80, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199620237", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q9358", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Friedrich Nietzsche"}, {"id": "p-choe-sihyeong", "label": "최시형", "type": "theorist", "ref": "", "degree": 8, "lod": [], "en": ""}, {"id": "p-gim-yonghwi", "label": "김용휘", "type": "critic", "ref": "http://lod.nl.go.kr/resource/KAC201300815 https://isni.org/isni/0000000464887720 http://viaf.org/viaf/458144928081254341840", "degree": 3, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201300815", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}, {"id": "p-karl-polanyi", "label": "칼 폴라니", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q318029 http://lod.nl.go.kr/resource/KAC200207196 https://isni.org/isni/0000000121405742 http://viaf.org/viaf/77112818", "degree": 7, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC200207196", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q318029", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-kate-raworth", "label": "케이트 레이워스", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q37424557 http://lod.nl.go.kr/resource/KAC2018J4166 https://isni.org/isni/0000000385440453 http://viaf.org/viaf/213819831", "degree": 1, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC2018J4166", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q37424557", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-kim-yongok", "label": "김용옥", "type": "critic", "ref": "https://www.wikidata.org/wiki/Q5285889 http://lod.nl.go.kr/resource/KAC201215921 https://isni.org/isni/0000000054558289 http://viaf.org/viaf/15056696", "degree": 12, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201215921", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q5285889", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-naomi-klein", "label": "네이오미 클라인", "type": "theorist", "ref": "", "degree": 2, "lod": [], "en": ""}], "edges": [{"source": "cb7296", "target": "p-gim-yonghwi", "type": "uses_theory", "weight": 1}, {"source": "p-gim-yonghwi", "target": "cb6231", "type": "wrote", "weight": 1}, {"source": "p-gim-yonghwi", "target": "cb6305", "type": "wrote", "weight": 1}, {"source": "cb6231", "target": "p-00161", "type": "uses_theory", "weight": 1}, {"source": "cb6231", "target": "p-kim-yongok", "type": "uses_theory", "weight": 1}, {"source": "cb6305", "target": "p-choe-sihyeong", "type": "uses_theory", "weight": 1}, {"source": "cb6305", "target": "p-karl-polanyi", "type": "uses_theory", "weight": 1}, {"source": "cb6305", "target": "p-kate-raworth", "type": "uses_theory", "weight": 1}, {"source": "cb6305", "target": "p-naomi-klein", "type": "uses_theory", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
