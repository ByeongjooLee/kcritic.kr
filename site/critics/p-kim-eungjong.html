    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "kim-eungjong_annales-history-social-science_1994", "label": "아날: 역사와 사회과학", "type": "essay", "year": "1994", "degree": 9}, {"id": "p-braudel", "label": "페르낭 브로델", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q185105 http://lod.nl.go.kr/resource/KAC199603312 https://isni.org/isni/0000000121200771 http://viaf.org/viaf/9843788", "degree": 3, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199603312", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q185105", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Fernand Braudel"}, {"id": "p-derrida", "label": "데리다", "type": "theorist", "ref": "", "degree": 15, "lod": [], "en": ""}, {"id": "p-dominick-lacapra", "label": "라카프라", "type": "theorist", "ref": "", "degree": 3, "lod": [], "en": ""}, {"id": "p-frye", "label": "노스럽 프라이", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q354256 http://lod.nl.go.kr/resource/KAC199609447 https://isni.org/isni/0000000121318761 http://viaf.org/viaf/49236705", "degree": 4, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199609447", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q354256", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Northrop Frye"}, {"id": "p-hayden-white", "label": "화이트", "type": "theorist", "ref": "", "degree": 3, "lod": [], "en": ""}, {"id": "p-kim-eungjong", "label": "김응종", "type": "critic", "ref": "", "degree": 1, "lod": [], "en": ""}, {"id": "p-ladurie", "label": "에마뉘엘 르루아 라뒤리", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q314148 http://lod.nl.go.kr/resource/KAC199616138 https://isni.org/isni/0000000121171480 http://viaf.org/viaf/13556", "degree": 2, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199616138", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q314148", "label"       var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
