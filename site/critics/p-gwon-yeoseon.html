abel": "권여선", "type": "critic", "ref": "https://www.wikidata.org/wiki/Q15708726 http://lod.nl.go.kr/resource/KAC201007528 https://isni.org/isni/0000000403531499 http://viaf.org/viaf/300037241", "degree": 15, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201007528", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q15708726", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}], "edges": [{"source": "cb3488", "target": "p-gwon-yeoseon", "type": "subject_of", "weight": 1}, {"source": "cb3784", "target": "p-gwon-yeoseon", "type": "subject_of", "weight": 1}, {"source": "cb4172", "target": "p-gwon-yeoseon", "type": "subject_of", "weight": 1}, {"source": "cb4374", "target": "p-gwon-yeoseon", "type": "subject_of", "weight": 1}, {"source": "cb4546", "target": "p-gwon-yeoseon", "type": "subject_of", "weight": 1}, {"source": "cb4748", "target": "p-gwon-yeoseon", "type": "subject_of", "weight": 1}, {"source": "cb4894", "target": "p-gwon-yeoseon", "type": "subject_of", "weight": 1}, {"source": "cb4950", "target": "p-gwon-yeoseon", "type": "subject_of", "weight": 1}, {"source": "cb5189", "target": "p-gwon-yeoseon", "type": "subject_of", "weight": 1}, {"source": "cb5201", "target": "p-gwon-yeoseon", "type": "subject_of", "weight": 1}, {"source": "cb5964", "target": "p-gwon-yeoseon", "type": "subject_of", "weight": 1}, {"source": "cb6302", "target": "p-gwon-yeoseon", "type": "subject_of", "weight": 1}, {"source": "kang-yujeong_japanese-literature-why-read_2006", "target": "p-gwon-yeoseon", "type": "subject_of", "weight": 1}, {"source": "p-gwon-yeoseon", "target": "cb4929", "type": "wrote", "weight": 1}, {"source": "p-gwon-yeoseon", "target": "cb5377", "type": "wrote", "weight": 1}, {"source": "cb4929", "target": "p-00068", "type": "subject_of", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
