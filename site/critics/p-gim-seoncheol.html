<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>김선철 — 한국 비평사 온톨로지</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="/kc-shell.css">
</head>
<body>

  <main class="container index-main">
    <section class="critic-profile-hero">
      <div class="critic-profile-byline"><span class="chip role-critic">김선철</span></div>
      <h1 class="index-heading">김선철</h1>
      
      <div class="stat-row">
        <div class="stat"><span class="stat-num">2</span><span class="stat-label">수록 비평글</span></div>
        <div class="stat"><span class="stat-num">0</span><span class="stat-label">비평 대상 작가</span></div>
        <div class="stat"><span class="stat-num">5</span><span class="stat-label">활용 이론가</span></div>
      </div>
    </section>

    <section class="critic-profile-meta">
      <div class="meta-section">
        <h2 class="meta-label">주요 비평 대상</h2>
        <div class="chip-group"><span class="muted">—</span></div>
      </div>
      <div class="meta-section">
        <h2 class="meta-label">자주 활용한 이론가</h2>
        <div class="chip-group"><span class="chip chip-term">찰스 틸리 (1)</span> <span class="chip chip-term">존 마코프 (1)</span> <span class="chip chip-term">배링턴 무어 (1)</span> <span class="chip chip-term">레이나 립시츠 (1)</span> <span class="chip chip-term">새뮤얼 헌팅턴 (1)</span></div>
      </div>
    </section>
    
    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb3736", "label": "한국 민주화 다시 보기", "type": "essay", "year": "2007", "degree": 5}, {"id": "cb6921", "label": "레이나 립시츠 『미국이 불타오른다』", "type": "essay", "year": "2023", "degree": 2}, {"id": "p-chalseu-tilri", "label": "찰스 틸리", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q717635 http://lod.nl.go.kr/resource/KAC199627583 https://isni.org/isni/0000000121468217 http://viaf.org/viaf/108159739", "degree": 2, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199627583", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q717635", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-gim-seoncheol", "label": "김선철", "type": "critic", "ref": "", "degree": 2, "lod": [], "en": ""}, {"id": "p-john-markoff", "label": "존 마코프", "type": "theorist", "ref": "", "degree": 1, "lod": [], "en": ""}, {"id": "p-moore", "label": "배링턴 무어", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q241199 http://lod.nl.go.kr/resource/KAC199619226 https://isni.org/isni/0000000109211646 http://viaf.org/viaf/85174773", "degree": 3, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199619226", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q241199", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Barrington Moore, Jr."}, {"id": "p-reina-ripsicheu", "label": "레이나 립시츠", "type": "theorist", "ref": "", "degree": 1, "lod": [], "en": ""}, {"id": "p-saemyueol-heontingteon", "label": "새뮤얼 헌팅턴", "type": "theorist", "ref": "", "degree": 5, "lod": [], "en": ""}], "edges": [{"source": "p-gim-seoncheol", "target": "cb3736", "type": "wrote", "weight": 1}, {"source": "p-gim-seoncheol", "target": "cb6921", "type": "wrote", "weight": 1}, {"source": "cb3736", "target": "p-chalseu-tilri", "type": "uses_theory", "weight": 1}, {"source": "cb3736", "target": "p-john-markoff", "type": "uses_theory", "weight": 1}, {"source": "cb3736", "target": "p-moore", "type": "uses_theory", "weight": 1}, {"source": "cb3736", "target": "p-saemyueol-heontingteon", "type": "uses_theory", "weight": 1}, {"source": "cb6921", "target": "p-reina-ripsicheu", "type": "uses_theory", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
    <section class="essay-grid">
      <h2 class="section-label">수록 비평글 (2편)</h2>
      
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2007</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb3736.html">한국 민주화 다시 보기</a>
        </h3>
        <p class="essay-card-source">창작과비평 137호, 창비, 2007</p>
        <div class="essay-card-tags"><span class="tag">찰스 틸리</span> <span class="tag">존 마코프</span> <span class="tag">배링턴 무어</span> <span class="tag">새뮤얼 헌팅턴</span></div>
      </article>
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2023</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb6921.html">레이나 립시츠 『미국이 불타오른다』</a>
        </h3>
        <p class="essay-card-source">창작과비평 202호, 창비, 2023</p>
        <div class="essay-card-tags"><span class="tag">레이나 립시츠</span></div>
      </article>
    </section>
  </main>

  <script src="/kc-shell.js"></script>
</body>
</html>
