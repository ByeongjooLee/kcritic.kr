<!DOCTYPE html>

<head>

  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="/kc-shell.css">
</head>
<body>

  <main class="container index-main">
    <section class="critic-profile-hero">

      <h1 class="index-heading">강계숙</h1>
      
      <div class="stat-row">
        <div class="stat"><span class="stat-num">2</span><span class="stat-label">수록 비평글</span></div>
        <div class="stat"><span class="stat-num">5</span><span class="stat-label">비평 대상 작가</span></div>
        <div class="stat"><span class="stat-num">3</span><span class="stat-label">활용 이론가</span></div>
      </div>
    </section>

    <section class="critic-profile-meta">
      <div class="meta-section">
        <h2 class="meta-label">주요 비평 대상</h2>
        <div class="chip-group"><span class="chip role-writer">서정주</span> <span class="chip role-writer">최정례</span> <span class="chip role-writer">이윤학</span> <span class="chip role-writer">남진우</span> <span class="chip role-writer">박형준</span></div>
      </div>
      <div class="meta-section">
        <h2 class="meta-label">자주 활용한 이론가</h2>
        <div class="chip-group"><span class="chip chip-term">아우구스티누스 (1)</span> <span class="chip chip-term">최문규 (1)</span> <span class="chip chip-term">장자 (1)</span></div>
      </div>
    </section>
    
    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb2999", "label": "기억의 힘", "type": "essay", "year": "2004", "degree": 5}, {"id": "cb3026", "label": "환(幻)의 순간, 초월의 문턱", "type": "essay", "year": "2002", "degree": 5}, {"id": "cb4044", "label": "존재론적 비명으로서의 시적인 것", "type": "essay", "year": "2009", "degree": 11}, {"id": "p-00195", "label": "서정주", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q624277 https://encykorea.aks.ac.kr/Article/E0071543 http://lod.nl.go.kr/resource/KAC200207962 https://isni.org/isni/000000008403163X http://viaf.org/viaf/53008278", "degree": 91, "lod": [{"href": "https://encykorea.aks.ac.kr/Article/E0071543", "label": "한", "full": "한국민족문화대백과", "bg": "#e8f0e8", "fg": "#2a5a2a"}, {"href": "http://lod.nl.go.kr/resource/KAC200207962", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q624277", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-augustine", "label": "아우구스티누스", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q8018 http://lod.nl.go.kr/resource/KAC199601187 https://isni.org/isni/0000000121376443 http://viaf.org/viaf/66806872", "degree": 8, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199601187", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q8018", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Augustine of Hippo"}, {"id": "p-choe-jeongrye", "label": "최정례", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q15830151 http://lod.nl.go.kr/resource/KAC201115380 https://isni.org/isni/0000000356844088 http://viaf.org/viaf/187457419", "degree": 5, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201115380", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q15830151", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-choe-mungyu", "label": "최문규", "type": "critic", "ref": "", "degree": 5, "lod": [], "en": ""}, {"id": "p-gang-gyesuk", "label": "강계숙", "type": "critic", "ref": "", "degree": 3, "lod": [], "en": ""}, {"id": "p-lee-yunhak", "label": "이윤학", "type": "writer", "ref": "", "degree": 14, "lod": [], "en": ""}, {"id": "p-nam-jinwoo", "label": "남진우", "type": "critic", "ref": "http://lod.nl.go.kr/resource/KAC201307295 https://isni.org/isni/0000000046334947 http://viaf.org/viaf/36767934", "degree": 19, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201307295", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}, {"id": "p-park-hyeongjun-poet", "label": "박형준", "type": "critic", "ref": "", "degree": 16, "lod": [], "en": ""}, {"id": "p-zhuangzi", "label": "장자", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q47739 http://lod.nl.go.kr/resource/KAC200601687 https://isni.org/isni/0000000108862375 http://viaf.org/viaf/100166339", "degree": 11, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC200601687", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q47739", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Zhuang Zhou"}], "edges": [{"source": "cb4044", "target": "p-gang-gyesuk", "type": "subject_of", "weight": 1}, {"source": "p-gang-gyesuk", "target": "cb2999", "type": "wrote", "weight": 1}, {"source": "p-gang-gyesuk", "target": "cb3026", "type": "wrote", "weight": 1}, {"source": "cb2999", "target": "p-00195", "type": "subject_of", "weight": 1}, {"source": "cb2999", "target": "p-augustine", "type": "uses_theory", "weight": 1}, {"source": "cb2999", "target": "p-lee-yunhak", "type": "subject_of", "weight": 1}, {"source": "cb2999", "target": "p-park-hyeongjun-poet", "type": "subject_of", "weight": 1}, {"source": "cb3026", "target": "p-choe-jeongrye", "type": "subject_of", "weight": 1}, {"source": "cb3026", "target": "p-choe-mungyu", "type": "uses_theory", "weight": 1}, {"source": "cb3026", "target": "p-nam-jinwoo", "type": "subject_of", "weight": 1}, {"source": "cb3026", "target": "p-zhuangzi", "type": "uses_theory", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
    <section class="essay-grid">
      <h2 class="section-label">수록 비평글 (2편)</h2>
      
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2002</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb3026.html">환(幻)의 순간, 초월의 문턱</a>
        </h3>
        <p class="essay-card-source">창작과비평 118호, 창비, 2002</p>
        <div class="essay-card-tags"><span class="tag">최정례</span> <span class="tag">남진우</span><span class="tag">최문규</span> <span class="tag">장자</span></div>
      </article>
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2004</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb2999.html">기억의 힘</a>
        </h3>
        <p class="essay-card-source">창작과비평 123호, 창비, 2004</p>
        <div class="essay-card-tags"><span class="tag">서정주</span> <span class="tag">이윤학</span> <span class="tag">박형준</span><span class="tag">아우구스티누스</span></div>
      </article>
    </section>
  </main>

</body>
