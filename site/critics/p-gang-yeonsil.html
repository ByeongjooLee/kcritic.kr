<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>강연실 — 한국 비평사 온톨로지</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="/kc-shell.css">
</head>
<body>

  <main class="container index-main">
    <section class="critic-profile-hero">
      <div class="critic-profile-byline"><span class="chip role-critic">강연실</span></div>
      <h1 class="index-heading">강연실</h1>
      
      <div class="stat-row">
        <div class="stat"><span class="stat-num">3</span><span class="stat-label">수록 비평글</span></div>
        <div class="stat"><span class="stat-num">0</span><span class="stat-label">비평 대상 작가</span></div>
        <div class="stat"><span class="stat-num">3</span><span class="stat-label">활용 이론가</span></div>
      </div>
    </section>

    <section class="critic-profile-meta">
      <div class="meta-section">
        <h2 class="meta-label">주요 비평 대상</h2>
        <div class="chip-group"><span class="muted">—</span></div>
      </div>
      <div class="meta-section">
        <h2 class="meta-label">자주 활용한 이론가</h2>
        <div class="chip-group"><span class="chip chip-term">홍성욱 (1)</span> <span class="chip chip-term">장재연 (1)</span> <span class="chip chip-term">전치형 (1)</span></div>
      </div>
    </section>
    
    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb5777", "label": "장재연 『공기 파는 사회에 반대한다』", "type": "essay", "year": "2019", "degree": 2}, {"id": "cb5812", "label": "전치형‧홍성욱 『미래는 오지 않는다』", "type": "essay", "year": "2019", "degree": 3}, {"id": "cb6102", "label": "노동환경건강연구소 기획 『고통에 이름을 붙이는 사람들』", "type": "essay", "year": "2021", "degree": 1}, {"id": "p-gang-yeonsil", "label": "강연실", "type": "critic", "ref": "", "degree": 3, "lod": [], "en": ""}, {"id": "p-hong-seonguk", "label": "홍성욱", "type": "critic", "ref": "https://www.wikidata.org/wiki/Q114359098 http://lod.nl.go.kr/resource/KAC201206835 https://isni.org/isni/0000000035824510 http://viaf.org/viaf/43691069", "degree": 9, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201206835", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q114359098", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-jang-jaeyeon", "label": "장재연", "type": "theorist", "ref": "http://lod.nl.go.kr/resource/KAC201707155 https://isni.org/isni/0000000460142887 http://viaf.org/viaf/82149616497303750209", "degree": 1, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201707155", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}, {"id": "p-jeon-chihyeong", "label": "전치형", "type": "critic", "ref": "http://lod.nl.go.kr/resource/KAC201514501 https://isni.org/isni/000000046482368X http://viaf.org/viaf/37153061254419201656", "degree": 6, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201514501", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}], "edges": [{"source": "p-gang-yeonsil", "target": "cb5777", "type": "wrote", "weight": 1}, {"source": "p-gang-yeonsil", "target": "cb5812", "type": "wrote", "weight": 1}, {"source": "p-gang-yeonsil", "target": "cb6102", "type": "wrote", "weight": 1}, {"source": "cb5777", "target": "p-jang-jaeyeon", "type": "uses_theory", "weight": 1}, {"source": "cb5812", "target": "p-hong-seonguk", "type": "uses_theory", "weight": 1}, {"source": "cb5812", "target": "p-jeon-chihyeong", "type": "uses_theory", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
    <section class="essay-grid">
      <h2 class="section-label">수록 비평글 (3편)</h2>
      
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2019</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb5777.html">장재연 『공기 파는 사회에 반대한다』</a>
        </h3>
        <p class="essay-card-source">창작과비평 185호, 창비, 2019</p>
        <div class="essay-card-tags"><span class="tag">장재연</span></div>
      </article>
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2019</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb5812.html">전치형‧홍성욱 『미래는 오지 않는다』</a>
        </h3>
        <p class="essay-card-source">창작과비평 186호, 창비, 2019</p>
        <div class="essay-card-tags"><span class="tag">홍성욱</span> <span class="tag">전치형</span></div>
      </article>
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2021</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb6102.html">노동환경건강연구소 기획 『고통에 이름을 붙이는 사람들』</a>
        </h3>
        <p class="essay-card-source">창작과비평 193호, 창비, 2021</p>
        <div class="essay-card-tags"></div>
      </article>
    </section>
  </main>

  <script src="/kc-shell.js"></script>
</body>
</html>
