<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>정이현 — 한국 비평사 온톨로지</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="/kc-shell.css">
</head>
<body>

  <main class="container index-main">
    <section class="critic-profile-hero">
      <div class="critic-profile-byline"><a href="https://www.wikidata.org/wiki/Q6312529" target="_blank" class="chip role-critic chip-linked">정이현 <span class="chip-ext">↗</span></a></div>
      <h1 class="index-heading">정이현</h1>
      <div class="lod-links"><a href="http://lod.nl.go.kr/resource/KAC201106797" target="_blank" class="lod-badge" title="국립중앙도서관 LOD">NLK LOD ↗</a> <a href="https://www.wikidata.org/wiki/Q6312529" target="_blank" class="lod-badge" title="Wikidata">Wikidata ↗</a> <a href="https://isni.org/isni/0000000073307071" target="_blank" class="lod-badge" title="ISNI">ISNI ↗</a> <a href="http://viaf.org/viaf/66425933" target="_blank" class="lod-badge" title="VIAF">VIAF ↗</a></div>
      <div class="stat-row">
        <div class="stat"><span class="stat-num">1</span><span class="stat-label">수록 비평글</span></div>
        <div class="stat"><span class="stat-num">1</span><span class="stat-label">비평 대상 작가</span></div>
        <div class="stat"><span class="stat-num">1</span><span class="stat-label">활용 이론가</span></div>
      </div>
    </section>

    <section class="critic-profile-meta">
      <div class="meta-section">
        <h2 class="meta-label">주요 비평 대상</h2>
        <div class="chip-group"><span class="chip role-writer">정미경</span></div>
      </div>
      <div class="meta-section">
        <h2 class="meta-label">자주 활용한 이론가</h2>
        <div class="chip-group"><span class="chip chip-term">레너드 코페트 (1)</span></div>
      </div>
    </section>
    
    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb3017", "label": "낭만적 사랑은 어떻게 부정되는가", "type": "essay", "year": "2004", "degree": 7}, {"id": "cb3940", "label": "속물들의 윤리학", "type": "essay", "year": "2008", "degree": 7}, {"id": "cb5299", "label": "다음. 다음이라는 건 없다는 말", "type": "essay", "year": "2017", "degree": 3}, {"id": "p-jeong-ihyeon", "label": "정이현", "type": "critic", "ref": "https://www.wikidata.org/wiki/Q6312529 http://lod.nl.go.kr/resource/KAC201106797 https://isni.org/isni/0000000073307071 http://viaf.org/viaf/66425933", "degree": 3, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201106797", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q6312529", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-jeong-migyeong", "label": "정미경", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q12615596 http://lod.nl.go.kr/resource/KAC201101558 https://isni.org/isni/0000000044647608 http://viaf.org/viaf/66230397", "degree": 5, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201101558", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q12615596", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-leonard-koppett", "label": "레너드 코페트", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q15505720 http://lod.nl.go.kr/resource/KAC200901611 https://isni.org/isni/0000000087222087 http://viaf.org/viaf/23386261", "degree": 1, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC200901611", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q15505720", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}], "edges": [{"source": "cb3017", "target": "p-jeong-ihyeon", "type": "subject_of", "weight": 1}, {"source": "cb3940", "target": "p-jeong-ihyeon", "type": "subject_of", "weight": 1}, {"source": "p-jeong-ihyeon", "target": "cb5299", "type": "wrote", "weight": 1}, {"source": "cb5299", "target": "p-jeong-migyeong", "type": "subject_of", "weight": 1}, {"source": "cb5299", "target": "p-leonard-koppett", "type": "uses_theory", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
    <section class="essay-grid">
      <h2 class="section-label">수록 비평글 (1편)</h2>
      
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2017</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb5299.html">다음. 다음이라는 건 없다는 말</a>
        </h3>
        <p class="essay-card-source">창작과비평 175호, 창비, 2017</p>
        <div class="essay-card-tags"><span class="tag">정미경</span><span class="tag">레너드 코페트</span></div>
      </article>
    </section>
  </main>

  <script src="/kc-shell.js"></script>
</body>
</html>
