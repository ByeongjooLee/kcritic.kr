    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb3533", "label": "야스꾸니 신사와 사까모또 료오마", "type": "essay", "year": "2004", "degree": 5}, {"id": "cb5110", "label": "노동과 정치를 잃고, 윤동주에게 공명하다", "type": "essay", "year": "2016", "degree": 4}, {"id": "p-gim-eunggyo", "label": "김응교", "type": "critic", "ref": "https://www.wikidata.org/wiki/Q97477846 http://lod.nl.go.kr/resource/KAC201116486 https://isni.org/isni/0000000460210042 http://viaf.org/viaf/120149617038203752092", "degree": 2, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201116486", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q97477846", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-hujiokka-nobukkajjeu", "label": "후지오까 노부까쯔", "type": "theorist", "ref": "", "degree": 1, "lod": [], "en": ""}, {"id": "p-kawamura-minato", "label": "가와무라 미나토", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q1669091 http://lod.nl.go.kr/resource/KAC200109248 https://isni.org/isni/0000000082886730 http://viaf.org/viaf/108222101", "degree": 5, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC200109248", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q1669091", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-kim-gu", "label": "김구", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q215737 https://encykorea.aks.ac.kr/Article/E0008753 http://lod.nl.go.kr/resource/KAC201111836 https://isni.org/isni/0000000083894118 http://viaf.org/viaf/64909377", "degree": 6, "lod": [{"href": "https://encykorea.aks.ac.kr/Article/E0008753", "label": "한", "full": "한국민족문화대백과", "bg": "#e8f0e8", "fg": "#2a5a2a"}, {"href": "http://lod.nl.go.kr/resource/KAC201111836", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q215737", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Kim Ku"}, {"id": "p-siba-ryoottaroo", "label": "시바 료오따로오", "type": "writer", "ref": "", "degree": 1, "lod": [], "en": ""}], "edges": [{"source": "cb5110", "target": "p-gim-eunggyo", "type": "uses_theory", "weight": 1}, {"source": "p-gim-eunggyo", "target": "cb3533", "type": "wrote", "weight": 1}, {"source": "cb3533", "target": "p-hujiokka-nobukkajjeu", "type": "uses_theory", "weight": 1}, {"source": "cb3533", "target": "p-kawamura-minato", "type": "uses_theory", "weight": 1}, {"source": "cb3533", "target": "p-kim-gu", "type": "uses_theory", "weight": 1}, {"source": "cb3533", "target": "p-siba-ryoottaroo", "type": "subject_of", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>

        </div>

          <a href="../essays/cb3533.html">야스꾸니 신사와 사까모또 료오마</a>
        </h3>
        <p class="essay-card-source">창작과비평 123호, 창비, 2004</p>
        <div class="essay-card-tags"><span class="tag">시바 료오따로오</span><span class="tag">후지오까 노부까쯔</span> <span class="tag">가와무라 미나토</span> <span class="tag">김구</span></div>
      </article>
    </section>
