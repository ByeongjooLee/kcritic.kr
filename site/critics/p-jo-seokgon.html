    <section class="critic-profile-meta">
      <div class="meta-section">

      </div>
      <div class="meta-section">

        <div class="chip-group"><span class="chip chip-term">김일영 (1)</span> <span class="chip chip-term">이병천 (1)</span> <span class="chip chip-term">이정우 (1)</span> <span class="chip chip-term">이준식 (1)</span> <span class="chip chip-term">장하준 (1)</span> <span class="chip chip-term">킨들버거 (1)</span> <span class="chip chip-term">루이스 (1)</span> <span class="chip chip-term">유철규 (1)</span></div>

    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb3315", "label": "박정희신화와 박정희체제", "type": "essay", "year": "2005", "degree": 9}, {"id": "cb3595", "label": "신정완 외 『우리 안의 보편성』", "type": "essay", "year": "2006", "degree": 7}, {"id": "p-gim-ilyeong", "label": "김일영", "type": "theorist", "ref": "", "degree": 1, "lod": [], "en": ""}, {"id": "p-i-byeongcheon", "label": "이병천", "type": "theorist", "ref": "", "degree": 2, "lod": [], "en": ""}, {"id": "p-i-jeongu", "label": "이정우", "type": "critic", "ref": "", "degree": 4, "lod": [], "en": ""}, {"id": "p-i-junsik", "label": "이준식", "type": "critic", "ref": "", "degree": 3, "lod": [], "en": ""}, {"id": "p-jang-hajun", "label": "장하준", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q32729 http://lod.nl.go.kr/resource/KAC201116503 https://isni.org/isni/0000000108714401 http://viaf.org/viaf/13212822", "degree": 6, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201116503", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q32729", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-jo-seokgon", "label": "조석곤", "type": "critic", "ref": "http://lod.nl.go.kr/resource/KAC201504631 https://isni.org/isni/0000000083331876 http://viaf.org/viaf/118737669", "degree": 2, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201504631", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}, {"id": "p-kin-deulbeogeo", "label": "킨들버거", "type": "theorist", "ref": "", "degree": 1, "lod": [], "en": ""}, {"id": "p-wyndham-lewis", "label": "루이스", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q780102 http://lod.nl.go.kr/resource/KAC202351886 https://isni.org/isni/0000000121296312 http://viaf.org/viaf/41843119", "degree": 2, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC202351886", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q780102", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Wyndham Lewis"}, {"id": "p-yu-cheolgyu", "label": "유철규", "type": "critic", "ref": "", "degree": 6, "lod": [], "en": ""}], "edges": [{"source": "cb3595", "target": "p-jo-seokgon", "type": "uses_theory", "weight": 1}, {"source": "p-jo-seokgon", "target": "cb3315", "type": "wrote", "weight": 1}, {"source": "cb3315", "target": "p-gim-ilyeong", "type": "uses_theory", "weight": 1}, {"source": "cb3315", "target": "p-i-byeongcheon", "type": "uses_theory", "weight": 1}, {"source": "cb3315", "target": "p-i-jeongu", "type": "uses_theory", "weight": 1}, {"source": "cb3315", "target": "p-i-junsik", "type": "uses_theory", "weight": 1}, {"source": "cb3315", "target": "p-jang-hajun", "type": "uses_theory", "weight": 1}, {"source": "cb3315", "target": "p-kin-deulbeogeo", "type": "uses_theory", "weight": 1}, {"source": "cb3315", "target": "p-wyndham-lewis", "type": "uses_theory", "weight": 1}, {"source": "cb3315", "target": "p-yu-cheolgyu", "type": "uses_theory", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
    <section class="essay-grid">

          <span class="essay-card-year">2005</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb3315.html">박정희신화와 박정희체제</a>
        </h3>
        <p class="essay-card-source">창작과비평 128호, 창비, 2005</p>
        <div class="essay-card-tags"><span class="tag">김일영</span> <span class="tag">이병천</span> <span class="tag">이정우</span> <span class="tag">이준식</span> <span class="tag">장하준</span> <span class="tag">킨들버거</span> <span class="tag">루이스</span> <span class="tag">유철규</span></div>
      </article>
    </section>
  </main>

</body>
