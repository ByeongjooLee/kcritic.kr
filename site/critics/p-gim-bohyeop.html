<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>김보협 — 한국 비평사 온톨로지</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="/kc-shell.css">
</head>
<body>

  <main class="container index-main">
    <section class="critic-profile-hero">
      <div class="critic-profile-byline"><span class="chip role-critic">김보협</span></div>
      <h1 class="index-heading">김보협</h1>
      
      <div class="stat-row">
        <div class="stat"><span class="stat-num">2</span><span class="stat-label">수록 비평글</span></div>
        <div class="stat"><span class="stat-num">1</span><span class="stat-label">비평 대상 작가</span></div>
        <div class="stat"><span class="stat-num">5</span><span class="stat-label">활용 이론가</span></div>
      </div>
    </section>

    <section class="critic-profile-meta">
      <div class="meta-section">
        <h2 class="meta-label">주요 비평 대상</h2>
        <div class="chip-group"><span class="chip role-writer">윤석열</span></div>
      </div>
      <div class="meta-section">
        <h2 class="meta-label">자주 활용한 이론가</h2>
        <div class="chip-group"><span class="chip chip-term">박근혜 (1)</span> <span class="chip chip-term">김어준 (1)</span> <span class="chip chip-term">홍준표 (1)</span> <span class="chip chip-term">이명박 (1)</span> <span class="chip chip-term">진중권 (1)</span></div>
      </div>
    </section>
    
    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb4477", "label": "김어준 『닥치고 정치』", "type": "essay", "year": "2011", "degree": 4}, {"id": "cb7032", "label": "‘제7공화국’을 향한 조국혁신당의 제언", "type": "essay", "year": "2024", "degree": 4}, {"id": "p-bak-geunhye", "label": "박근혜", "type": "theorist", "ref": "", "degree": 41, "lod": [], "en": ""}, {"id": "p-gim-bohyeop", "label": "김보협", "type": "critic", "ref": "", "degree": 2, "lod": [], "en": ""}, {"id": "p-gim-eojun", "label": "김어준", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q12587958 http://lod.nl.go.kr/resource/KAC201203108 https://isni.org/isni/0000000461082097 http://viaf.org/viaf/259150468200004170777", "degree": 1, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201203108", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q12587958", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-hong-junpyo", "label": "홍준표", "type": "theorist", "ref": "", "degree": 3, "lod": [], "en": ""}, {"id": "p-i-myeongbak", "label": "이명박", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q14342 http://lod.nl.go.kr/resource/KAC201116201 https://isni.org/isni/0000000078831411 http://viaf.org/viaf/54050630", "degree": 59, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201116201", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q14342", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-jin-junggwon", "label": "진중권", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q6668980 http://lod.nl.go.kr/resource/KAC201230482 https://isni.org/isni/0000000064329092 http://viaf.org/viaf/56505586", "degree": 3, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201230482", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q6668980", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-yun-seokyeol", "label": "윤석열", "type": "writer", "ref": "", "degree": 34, "lod": [], "en": ""}], "edges": [{"source": "p-gim-bohyeop", "target": "cb4477", "type": "wrote", "weight": 1}, {"source": "p-gim-bohyeop", "target": "cb7032", "type": "wrote", "weight": 1}, {"source": "cb4477", "target": "p-gim-eojun", "type": "uses_theory", "weight": 1}, {"source": "cb4477", "target": "p-i-myeongbak", "type": "uses_theory", "weight": 1}, {"source": "cb4477", "target": "p-jin-junggwon", "type": "uses_theory", "weight": 1}, {"source": "cb7032", "target": "p-bak-geunhye", "type": "uses_theory", "weight": 1}, {"source": "cb7032", "target": "p-hong-junpyo", "type": "uses_theory", "weight": 1}, {"source": "cb7032", "target": "p-yun-seokyeol", "type": "subject_of", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
    <section class="essay-grid">
      <h2 class="section-label">수록 비평글 (2편)</h2>
      
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2011</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb4477.html">김어준 『닥치고 정치』</a>
        </h3>
        <p class="essay-card-source">창작과비평 154호, 창비, 2011</p>
        <div class="essay-card-tags"><span class="tag">김어준</span> <span class="tag">이명박</span> <span class="tag">진중권</span></div>
      </article>
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2024</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb7032.html">‘제7공화국’을 향한 조국혁신당의 제언</a>
        </h3>
        <p class="essay-card-source">창작과비평 205호, 창비, 2024</p>
        <div class="essay-card-tags"><span class="tag">윤석열</span><span class="tag">박근혜</span> <span class="tag">홍준표</span></div>
      </article>
    </section>
  </main>

  <script src="/kc-shell.js"></script>
</body>
</html>
