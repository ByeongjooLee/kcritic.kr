    <section class="critic-profile-meta">
      <div class="meta-section">
        <h2 class="meta-label">주요 비평 대상</h2>
        <div class="chip-group"><span class="chip role-writer">고종석</span> <span class="chip role-writer">임화</span></div>
      </div>
      <div class="meta-section">
        <h2 class="meta-label">자주 활용한 이론가</h2>
        <div class="chip-group"><span class="chip chip-term">카라타니 고진 (1)</span> <span class="chip chip-term">권성우 (1)</span> <span class="chip chip-term">서경식 (1)</span></div>

    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb3348", "label": "서영채 평론집 『문학의 윤리』", "type": "essay", "year": "2005", "degree": 2}, {"id": "cb3959", "label": "권성우 평론집 『낭만적 망명』", "type": "essay", "year": "2008", "degree": 5}, {"id": "cb5993", "label": "이수형 평론집 『문학, 잉여의 몫』", "type": "essay", "year": "2013", "degree": 4}, {"id": "p-go-jongseok", "label": "고종석", "type": "critic", "ref": "", "degree": 7, "lod": [], "en": ""}, {"id": "p-i-suhyeong", "label": "이수형", "type": "critic", "ref": "http://lod.nl.go.kr/resource/KAC201213091 https://isni.org/isni/0000000464632672 http://viaf.org/viaf/174152138529710981242", "degree": 3, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201213091", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}, {"id": "p-imhwa", "label": "임화", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q15433904 https://encykorea.aks.ac.kr/Article/E0047762 http://lod.nl.go.kr/resource/KAC201108905 https://isni.org/isni/0000000084484348 http://viaf.org/viaf/43854035", "degree": 41, "lod": [{"href": "https://encykorea.aks.ac.kr/Article/E0047762", "label": "한", "full": "한국민족문화대백과", "bg": "#e8f0e8", "fg": "#2a5a2a"}, {"href": "http://lod.nl.go.kr/resource/KAC201108905", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q15433904", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-karatani-gojin", "label": "카라타니 고진", "type": "theorist", "ref": "", "degree": 4, "lod": [], "en": ""}, {"id": "p-kwon-seongwoo", "label": "권성우", "type": "critic", "ref": "http://lod.nl.go.kr/resource/KAC201424483 https://isni.org/isni/0000000464570117 http://viaf.org/viaf/116152138533710980898", "degree": 21, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201424483", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}, {"id": "p-seo-gyeongsik", "label": "서경식", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q11250148 http://lod.nl.go.kr/resource/KAC200206995 https://isni.org/isni/0000000119388023 http://viaf.org/viaf/108224026", "degree": 7, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC200206995", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q11250148", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}], "edges": [{"source": "cb5993", "target": "p-i-suhyeong", "type": "uses_theory", "weight": 1}, {"source": "p-i-suhyeong", "target": "cb3348", "type": "wrote", "weight": 1}, {"source": "p-i-suhyeong", "target": "cb3959", "type": "wrote", "weight": 1}, {"source": "cb3348", "target": "p-karatani-gojin", "type": "uses_theory", "weight": 1}, {"source": "cb3959", "target": "p-go-jongseok", "type": "subject_of", "weight": 1}, {"source": "cb3959", "target": "p-imhwa", "type": "subject_of", "weight": 1}, {"source": "cb3959", "target": "p-kwon-seongwoo", "type": "uses_theory", "weight": 1}, {"source": "cb3959", "target": "p-seo-gyeongsik", "type": "uses_theory", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>

        </div>

          <a href="../essays/cb3348.html">서영채 평론집 『문학의 윤리』</a>
        </h3>
        <p class="essay-card-source">창작과비평 129호, 창비, 2005</p>
        <div class="essay-card-tags"><span class="tag">카라타니 고진</span></div>
      </article>
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2008</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb3959.html">권성우 평론집 『낭만적 망명』</a>
        </h3>
        <p class="essay-card-source">창작과비평 142호, 창비, 2008</p>
        <div class="essay-card-tags"><span class="tag">고종석</span> <span class="tag">임화</span><span class="tag">권성우</span> <span class="tag">서경식</span></div>
