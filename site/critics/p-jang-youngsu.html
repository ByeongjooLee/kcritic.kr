    <script>
    (function() {
      var graphData = {"nodes": [{"id": "jang-yeongsu_stages-of-openness_1989", "label": "열림의 여러 모습과 단계", "type": "essay", "year": "1989", "degree": 5}, {"id": "kim-hyon_industrialization-poetry_1980", "label": "산업화 시대의 시", "type": "essay", "year": "1980", "degree": 32}, {"id": "kim-hyon_jang-youngsu_1980", "label": "미국의 웃음", "type": "essay", "year": "1980", "degree": 3}, {"id": "kim-hyon_kwak-jaegu_1990", "label": "추상적 정열에서 구체적 사랑으로", "type": "essay", "year": "1990", "degree": 14}, {"id": "kim-hyon_living-poems-2_1983", "label": "살아 있는 시들 (제2권 거대한 낙원에서)", "type": "essay", "year": "1983", "degree": 49}, {"id": "kim-hyon_orphan-consciousness_1980", "label": "고아 의식의 시적 변용", "type": "essay", "year": "1980", "degree": 4}, {"id": "kim-uchang_science-tech-literature_1993", "label": "과학 기술 시대의 문학 — 현실주의를 넘어서", "type": "essay", "year": "1993", "degree": 31}, {"id": "p-choe-seungja", "label": "최승자", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q12619648 http://lod.nl.go.kr/resource/KAC201110135 https://isni.org/isni/0000000078791755 http://viaf.org/viaf/1380918", "degree": 6, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201110135", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q12619648", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-hong-yeongchul", "label": "홍영철", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q16092624 http://viaf.org/viaf/167154981789367740655", "degree": 2, "lod": [{"href": "https://www.wikidata.org/wiki/Q16092624", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-jang-youngsu", "label": "장영수", "type": "critic", "ref": "", "degree": 8, "lod": [], "en": ""}, {"id": "p-jung-inseop", "label": "정인섭", "type": "writer", "ref": "", "degree": 2, "lod": [], "en": ""}], "edges": [{"source": "jang-yeongsu_stages-of-openness_1989", "target": "p-jang-youngsu", "type": "subject_of", "weight": 1}, {"source": "kim-hyon_industrialization-poetry_1980", "target": "p-jang-youngsu", "type": "subject_of", "weight": 1}, {"source": "kim-hyon_jang-youngsu_1980", "target": "p-jang-youngsu", "type": "subject_of", "weight": 1}, {"source": "kim-hyon_kwak-jaegu_1990", "target": "p-jang-youngsu", "type": "subject_of", "weight": 1}, {"source": "kim-hyon_living-poems-2_1983", "target": "p-jang-youngsu", "type": "subject_of", "weight": 1}, {"source": "kim-hyon_orphan-consciousness_1980", "target": "p-jang-youngsu", "type": "subject_of", "weight": 1}, {"source": "kim-uchang_science-tech-literature_1993", "target": "p-jang-youngsu", "type": "subject_of", "weight": 1}, {"source": "p-jang-youngsu", "target": "jang-yeongsu_stages-of-openness_1989", "type": "wrote", "weight": 1}, {"source": "jang-yeongsu_stages-of-openness_1989", "target": "p-choe-seungja", "type": "subject_of", "weight": 1}, {"source": "jang-yeongsu_stages-of-openness_1989", "target": "p-hong-yeongchul", "type": "subject_of", "weight": 1}, {"source": "jang-yeongsu_stages-of-openness_1989", "target": "p-jung-inseop", "type": "subject_of", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#c9986a',
        writer: '#6a9bc9',
        theorist: '#9a7ac9',
        essay: '#c8c8a8'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#4a2400',
        writer: '#0e2d4a',
        theorist: '#2d1050',
        essay: '#3a3a2a'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#c9c7bf',
              'target-arrow-color': '#c9c7bf',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#6b3e26' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
