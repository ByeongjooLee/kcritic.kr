    <section class="critic-mini-graph-section">

      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>

      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "jeong-gwari_phenomenology-korean-criticism_1994", "label": "특이한 생존. 한국 비평의 현상학", "type": "essay", "year": "1994", "degree": 16}, {"id": "kim-cheol_sublation-and-realization-of-literary-history_1993", "label": "문학사의 ‘지양’과 ‘실현’", "type": "essay", "year": "1993", "degree": 7}, {"id": "lee-gwangho_mode-of-being-of-the-novel_1990", "label": "소설의 존재 방식", "type": "essay", "year": "1990", "degree": 4}, {"id": "lee-gwangho_place-of-realism_1993", "label": "리얼리즘이 있던 자리 — 현길언·양귀자의 소설", "type": "essay", "year": "1993", "degree": 3}, {"id": "p-go-wonjeong", "label": "고원정", "type": "writer", "ref": "", "degree": 2, "lod": [], "en": ""}, {"id": "p-hyeon-gireon", "label": "현길언", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q12624992 http://lod.nl.go.kr/resource/KAC201106577 https://isni.org/isni/0000000116432914 http://viaf.org/viaf/52844656", "degree": 4, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201106577", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q12624992", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-lee-gwangho", "label": "이광호", "type": "critic", "ref": "", "degree": 4, "lod": [], "en": ""}, {"id": "p-lee-seungu", "label": "이승우", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q498290 http://lod.nl.go.kr/resource/KAC201011877 https://isni.org/isni/000000045302126X http://viaf.org/viaf/14890546", "degree": 5, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201011877", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q498290", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-yang-gwija", "label": "양귀자", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q8048394 http://lod.nl.go.kr/resource/KAC201107179 https://isni.org/isni/0000000081869648 http://viaf.org/viaf/117886350", "degree": 7, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201107179", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q8048394", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}], "edges": [{"source": "jeong-gwari_phenomenology-korean-criticism_1994", "target": "p-lee-gwangho", "type": "uses_theory", "weight": 1}, {"source": "kim-cheol_sublation-and-realization-of-literary-history_1993", "target": "p-lee-gwangho", "type": "uses_theory", "weight": 1}, {"source": "p-lee-gwangho", "target": "lee-gwangho_mode-of-being-of-the-novel_1990", "type": "wrote", "weight": 1}, {"source": "p-lee-gwangho", "target": "lee-gwangho_place-of-realism_1993", "type": "wrote", "weight": 1}, {"source": "lee-gwangho_mode-of-being-of-the-novel_1990", "target": "p-go-wonjeong", "type": "subject_of", "weight": 1}, {"source": "lee-gwangho_mode-of-being-of-the-novel_1990", "target": "p-hyeon-gireon", "type": "subject_of", "weight": 1}, {"source": "lee-gwangho_mode-of-being-of-the-novel_1990", "target": "p-lee-seungu", "type": "subject_of", "weight": 1}, {"source": "lee-gwangho_place-of-realism_1993", "target": "p-hyeon-gireon", "type": "subject_of", "weight": 1}, {"source": "lee-gwangho_place-of-realism_1993", "target": "p-yang-gwija", "type": "subject_of", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
