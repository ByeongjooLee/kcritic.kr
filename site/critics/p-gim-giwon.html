</head>
<body>

  <main class="container index-main">
    <section class="critic-profile-hero">
      <div class="critic-profile-byline"><a href="https://www.wikidata.org/wiki/Q18648114" target="_blank" class="chip role-critic chip-linked">김기원 <span class="chip-ext">↗</span></a></div>
      <h1 class="index-heading">김기원</h1>
      <div class="lod-links"><a href="http://lod.nl.go.kr/resource/KAC201230994" target="_blank" class="lod-badge" title="국립중앙도서관 LOD">NLK LOD ↗</a> <a href="https://www.wikidata.org/wiki/Q18648114" target="_blank" class="lod-badge" title="Wikidata">Wikidata ↗</a> <a href="https://isni.org/isni/0000000084392064" target="_blank" class="lod-badge" title="ISNI">ISNI ↗</a> <a href="http://viaf.org/viaf/34319200" target="_blank" class="lod-badge" title="VIAF">VIAF ↗</a></div>
      <div class="stat-row">
        <div class="stat"><span class="stat-num">1</span><span class="stat-label">수록 비평글</span></div>
        <div class="stat"><span class="stat-num">0</span><span class="stat-label">비평 대상 작가</span></div>
        <div class="stat"><span class="stat-num">1</span><span class="stat-label">활용 이론가</span></div>
      </div>
    </section>

    <section class="critic-profile-meta">
      <div class="meta-section">
        <h2 class="meta-label">주요 비평 대상</h2>
        <div class="chip-group"><span class="muted">—</span></div>
      </div>
      <div class="meta-section">
        <h2 class="meta-label">자주 활용한 이론가</h2>
        <div class="chip-group"><span class="chip chip-term">노무현 (1)</span></div>
      </div>
    </section>
    
    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb3529", "label": "재벌개혁, 어디까지 가야 하나", "type": "essay", "year": "2004", "degree": 3}, {"id": "cb3721", "label": "신자유주의, 세계화, 한국경제", "type": "essay", "year": "2007", "degree": 5}, {"id": "cb3722", "label": "김대중－노무현 정권은 시장만능주의인가", "type": "essay", "year": "2007", "degree": 2}, {"id": "cb3724", "label": "대안체제 모색과 ‘한반도경제’", "type": "essay", "year": "2007", "degree": 6}, {"id": "cb4403", "label": "더 나은 체제를 향해", "type": "essay", "year": "2011", "degree": 4}, {"id": "cb4644", "label": "진보개혁진영이 진정 세상을 바꾸고 싶다면", "type": "essay", "year": "2012", "degree": 7}, {"id": "cb5063", "label": "김기원추모사업회 엮음 『개혁적 진보의 메아리: 경제학자 김기원 유고집』", "type": "essay", "year": "2016", "degree": 2}, {"id": "p-gim-giwon", "label": "김기원", "type": "critic", "ref": "https://www.wikidata.org/wiki/Q18648114 http://lod.nl.go.kr/resource/KAC201230994 https://isni.org/isni/0000000084392064 http://viaf.org/viaf/34319200", "degree": 7, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201230994", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q18648114", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-no-muhyeon", "label": "노무현", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q14345 http://lod.nl.go.kr/resource/KAC201100150 https://isni.org/isni/0000000121219755 http://viaf.org/viaf/15704800", "degree": 53, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201100150", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q14345", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}], "edges": [{"source": "cb3529", "target": "p-gim-giwon", "type": "uses_theory", "weight": 1}, {"source": "cb3721", "target": "p-gim-giwon", "type": "uses_theory", "weight": 1}, {"source": "cb3724", "target": "p-gim-giwon", "type": "uses_theory", "weight": 1}, {"source": "cb4403", "target": "p-gim-giwon", "type": "uses_theory", "weight": 1}, {"source": "cb4644", "target": "p-gim-giwon", "type": "uses_theory", "weight": 1}, {"source": "cb5063", "target": "p-gim-giwon", "type": "uses_theory", "weight": 1}, {"source": "p-gim-giwon", "target": "cb3722", "type": "wrote", "weight": 1}, {"source": "cb3722", "target": "p-no-muhyeon", "type": "uses_theory", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
    <section class="essay-grid">
      <h2 class="section-label">수록 비평글 (1편)</h2>
      
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2007</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb3722.html">김대중－노무현 정권은 시장만능주의인가</a>
        </h3>
        <p class="essay-card-source">창작과비평 137호, 창비, 2007</p>
        <div class="essay-card-tags"><span class="tag">노무현</span></div>
      </article>
    </section>
  </main>

  <script src="/kc-shell.js"></script>
</body>
</html>
