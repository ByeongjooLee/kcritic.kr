    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb6985", "label": "세계에서 또다시 추방당한다 하더라도", "type": "essay", "year": "2024", "degree": 7}, {"id": "p-00032", "label": "조태일", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q12617126 https://encykorea.aks.ac.kr/Article/E0052727 http://lod.nl.go.kr/resource/KAC201219361 https://isni.org/isni/0000000026217719 http://viaf.org/viaf/13699380", "degree": 13, "lod": [{"href": "https://encykorea.aks.ac.kr/Article/E0052727", "label": "한", "full": "한국민족문화대백과", "bg": "#e8f0e8", "fg": "#2a5a2a"}, {"href": "http://lod.nl.go.kr/resource/KAC201219361", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q12617126", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-00199", "label": "신경림", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q3482149 http://lod.nl.go.kr/resource/KAC201200501 https://isni.org/isni/0000000079981745 http://viaf.org/viaf/59193837", "degree": 37, "lod": [{"href": "https://encykorea.aks.ac.kr/Article/E0013094", "label": "한(작품)", "full": "한국민족문화대백과 (작품)", "bg": "#f0ede8", "fg": "#5a3a2a"}, {"href": "http://lod.nl.go.kr/resource/KAC201200501", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q3482149", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-baek-musan", "label": "백무산", "type": "critic", "ref": "https://www.wikidata.org/wiki/Q12597765 http://lod.nl.go.kr/resource/KAC201207404 https://isni.org/isni/0000000052401739 http://viaf.org/viaf/14691065", "degree": 21, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201207404", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q12597765", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-choe-jiin", "label": "최지인", "type": "critic", "ref": "http://lod.nl.go.kr/resource/KAC201422542 https://isni.org/isni/000000047691962X http://viaf.org/viaf/644144928076754340329", "degree": 3, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201422542", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}, {"id": "p-i-yonghun", "label": "이용훈", "type": "writer", "ref": "", "degree": 2, "lod": [], "en": ""}, {"id": "p-ki-hyongdo", "label": "기형도", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q5557767 http://lod.nl.go.kr/resource/KAC201302235 https://isni.org/isni/0000000116481898 http://viaf.org/viaf/56526141", "degree": 20, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201302235", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q5557767", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-so-jongmin", "label": "소종민", "type": "critic", "ref": "http://lod.nl.go.kr/resource/KAC201708943 https://isni.org/isni/0000000477838901 http://viaf.org/viaf/26149841852902841022", "degree": 1, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201708943", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}], "edges": [{"source": "p-so-jongmin", "target": "cb6985", "type": "wrote", "weight": 1}, {"source": "cb6985", "target": "p-00032", "type": "subject_of", "weight": 1}, {"source": "cb6985", "target": "p-00199", "type": "subject_of", "weight": 1}, {"source": "cb6985", "target": "p-baek-musan", "type": "subject_of", "weight": 1}, {"source": "cb6985", "target": "p-choe-jiin", "type": "subject_of", "weight": 1}, {"source": "cb6985", "target": "p-i-yonghun", "type": "subject_of", "weight": 1}, {"source": "cb6985", "target": "p-ki-hyongdo", "type": "subject_of", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
