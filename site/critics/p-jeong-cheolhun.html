      <div class="stat-row">
        <div class="stat"><span class="stat-num">1</span><span class="stat-label">수록 비평글</span></div>
        <div class="stat"><span class="stat-num">3</span><span class="stat-label">비평 대상 작가</span></div>
        <div class="stat"><span class="stat-num">0</span><span class="stat-label">활용 이론가</span></div>
      </div>
    </section>

    <section class="critic-profile-meta">
      <div class="meta-section">
        <h2 class="meta-label">주요 비평 대상</h2>
        <div class="chip-group"><span class="chip role-writer">최인훈</span> <span class="chip role-writer">이창동</span> <span class="chip role-writer">박상륭</span></div>
      </div>
      <div class="meta-section">

        <div class="chip-group"><span class="muted">—</span></div>
      </div>

    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb2668", "label": "정철훈 김승희 신대철 시집", "type": "essay", "year": "2001", "degree": 4}, {"id": "cb3503", "label": "거미의 집짓기와 소화법", "type": "essay", "year": "2006", "degree": 11}, {"id": "cb3622", "label": "통일시대를 위하여", "type": "essay", "year": "2006", "degree": 11}, {"id": "cb5621", "label": "최인훈 선생의 마지막 병상을 방문하고", "type": "essay", "year": "2018", "degree": 4}, {"id": "p-00033", "label": "최인훈", "type": "critic", "ref": "https://www.wikidata.org/wiki/Q11274314 http://lod.nl.go.kr/resource/KAC201108593 https://isni.org/isni/0000000116984436 http://viaf.org/viaf/110167855", "degree": 60, "lod": [{"href": "https://encykorea.aks.ac.kr/Article/E0005204", "label": "한(작품)", "full": "한국민족문화대백과 (작품)", "bg": "#f0ede8", "fg": "#5a3a2a"}, {"href": "http://lod.nl.go.kr/resource/KAC201108593", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q11274314", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-jeong-cheolhun", "label": "정철훈", "type": "critic", "ref": "http://lod.nl.go.kr/resource/KAC201228287 https://isni.org/isni/0000000464430069 http://viaf.org/viaf/49145375901483681916", "degree": 4, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201228287", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}, {"id": "p-lee-changdong", "label": "이창동", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q239656 http://lod.nl.go.kr/resource/KAC201229402 https://isni.org/isni/0000000122824674 http://viaf.org/viaf/84408838", "degree": 14, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201229402", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q239656", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-park-sangryung", "label": "박상륭", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q7137999 http://lod.nl.go.kr/resource/KAC201008927 https://isni.org/isni/0000000024628434 http://viaf.org/viaf/28396953", "degree": 19, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201008927", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q7137999", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}], "edges": [{"source": "cb2668", "target": "p-jeong-cheolhun", "type": "subject_of", "weight": 1}, {"source": "cb3503", "target": "p-jeong-cheolhun", "type": "subject_of", "weight": 1}, {"source": "cb3622", "target": "p-jeong-cheolhun", "type": "subject_of", "weight": 1}, {"source": "p-jeong-cheolhun", "target": "cb5621", "type": "wrote", "weight": 1}, {"source": "cb5621", "target": "p-00033", "type": "subject_of", "weight": 1}, {"source": "cb5621", "target": "p-lee-changdong", "type": "subject_of", "weight": 1}, {"source": "cb5621", "target": "p-park-sangryung", "type": "subject_of", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
    <section class="essay-grid">
      <h2 class="section-label">수록 비평글 (1편)</h2>
      
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2018</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb5621.html">최인훈 선생의 마지막 병상을 방문하고</a>
        </h3>
        <p class="essay-card-source">창작과비평 181호, 창비, 2018</p>
        <div class="essay-card-tags"><span class="tag">최인훈</span> <span class="tag">이창동</span> <span class="tag">박상륭</span></div>
      </article>
    </section>
  </main>

</body>
</html>
