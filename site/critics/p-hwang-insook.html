    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "gwon-hyeokung_hwang-insook-doppelganger_2004", "label": "도플갱어의 꿈 — 황인숙론", "type": "essay", "year": "2004", "degree": 4}, {"id": "hwang-insook_writers-letter_2004", "label": "승화에게", "type": "essay", "year": "2004", "degree": 3}, {"id": "jo-namhyeon_theory-practice-criticism_2003", "label": "이론 비평과 실천 비평의 순환", "type": "essay", "year": "2003", "degree": 55}, {"id": "kim-dongwon_her-oppression-liberation_1994", "label": "그녀에 대하여 — 여성을 둘러싼 억압과 해방의 시적 이미지", "type": "essay", "year": "1994", "degree": 10}, {"id": "kim-dongwon_wavering-road_1991", "label": "흔들리는 길 — 우리 시대 젊은 시인 9인의 시의 행보", "type": "essay", "year": "1991", "degree": 10}, {"id": "kim-heonseon_lyric-of-homeless-age_1990", "label": "집 없는 시대의 서정적 묘사와 그 전망", "type": "essay", "year": "1990", "degree": 17}, {"id": "kim-hyon_hwang-insook_1990", "label": "이루어지지 않는 바람", "type": "essay", "year": "1990", "degree": 8}, {"id": "kim-jinsu_hwang-insuk-face-of-darkness_1998", "label": "‘어둠의 얼굴’의 현상학 — 고통을 껴안고 고통을 넘어서기", "type": "essay", "year": "1998", "degree": 4}, {"id": "kim-jinsu_lyric-poetry-horizon_2001", "label": "서정시의 지평과 새로운 모색", "type": "essay", "year": "2001", "degree": 11}, {"id": "nam-jinwoo_witch-and-cat_1988", "label": "마녀와 고양이", "type": "essay", "year": "1988", "degree": 6}, {"id": "p-hwang-insook", "label": "황인숙", "type": "critic", "ref": "https://www.wikidata.org/wiki/Q15310058 http://lod.nl.go.kr/resource/KAC201322328 https://isni.org/isni/0000000383205329 http://viaf.org/viaf/268126996", "degree": 11, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201322328", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q15310058", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-yi-jeha", "label": "이제하", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q14174766 http://lod.nl.go.kr/resource/KAC201010438 https://isni.org/isni/0000000362123316 http://viaf.org/viaf/224429703", "degree": 10, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201010438", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q14174766", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}], "edges": [{"source": "gwon-hyeokung_hwang-insook-doppelganger_2004", "target": "p-hwang-insook", "type": "subject_of", "weight": 1}, {"source": "hwang-insook_writers-letter_2004", "target": "p-hwang-insook", "type": "subject_of", "weight": 1}, {"source": "jo-namhyeon_theory-practice-criticism_2003", "target": "p-hwang-insook", "type": "subject_of", "weight": 1}, {"source": "kim-dongwon_her-oppression-liberation_1994", "target": "p-hwang-insook", "type": "subject_of", "weight": 1}, {"source": "kim-dongwon_wavering-road_1991", "target": "p-hwang-insook", "type": "subject_of", "weight": 1}, {"source": "kim-heonseon_lyric-of-homeless-age_1990", "target": "p-hwang-insook", "type": "subject_of", "weight": 1}, {"source": "kim-hyon_hwang-insook_1990", "target": "p-hwang-insook", "type": "subject_of", "weight": 1}, {"source": "kim-jinsu_hwang-insuk-face-of-darkness_1998", "target": "p-hwang-insook", "type": "subject_of", "weight": 1}, {"source": "kim-jinsu_lyric-poetry-horizon_2001", "target": "p-hwang-insook", "type": "subject_of", "weight": 1}, {"source": "nam-jinwoo_witch-and-cat_1988", "target": "p-hwang-insook", "type": "subject_of", "weight": 1}, {"source": "p-hwang-insook", "target": "hwang-insook_writers-letter_2004", "type": "wrote", "weight": 1}, {"source": "hwang-insook_writers-letter_2004", "target": "p-yi-jeha", "type": "subject_of", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
