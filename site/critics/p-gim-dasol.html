    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb7014", "label": "불가피한 미래란 없다", "type": "essay", "year": "2024", "degree": 5}, {"id": "cb7408", "label": "사라짐의 자리에서 시작되는 미래", "type": "essay", "year": "2026", "degree": 3}, {"id": "p-bak-munyeong", "label": "박문영", "type": "writer", "ref": "", "degree": 2, "lod": [], "en": ""}, {"id": "p-gim-dasol", "label": "김다솔", "type": "critic", "ref": "http://lod.nl.go.kr/resource/KAC202303726 https://isni.org/isni/0000000510865785", "degree": 2, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC202303726", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}, {"id": "p-jeong-jidon", "label": "정지돈", "type": "writer", "ref": "http://lod.nl.go.kr/resource/KAC201512037 https://isni.org/isni/0000000477420222 http://viaf.org/viaf/176149366040985600775", "degree": 1, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201512037", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}, {"id": "p-jeong-yongjun", "label": "정용준", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q12615858 http://lod.nl.go.kr/resource/KAC201107061 https://isni.org/isni/0000000369951018 http://viaf.org/viaf/234826589", "degree": 5, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201107061", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q12615858", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-ju-yeongha", "label": "주영하", "type": "writer", "ref": "", "degree": 1, "lod": [], "en": ""}, {"id": "p-kim-hongjung", "label": "김홍중", "type": "critic", "ref": "", "degree": 9, "lod": [], "en": ""}, {"id": "p-shoshana-zuboff", "label": "쇼샤나 주보프", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q15953956 http://lod.nl.go.kr/resource/KAC202117070 https://isni.org/isni/0000000374501847", "degree": 1, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC202117070", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q15953956", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}], "edges": [{"source": "p-gim-dasol", "target": "cb7014", "type": "wrote", "weight": 1}, {"source": "p-gim-dasol", "target": "cb7408", "type": "wrote", "weight": 1}, {"source": "cb7014", "target": "p-bak-munyeong", "type": "subject_of", "weight": 1}, {"source": "cb7014", "target": "p-jeong-jidon", "type": "subject_of", "weight": 1}, {"source": "cb7014", "target": "p-kim-hongjung", "type": "subject_of", "weight": 1}, {"source": "cb7014", "target": "p-shoshana-zuboff", "type": "uses_theory", "weight": 1}, {"source": "cb7408", "target": "p-jeong-yongjun", "type": "subject_of", "weight": 1}, {"source": "cb7408", "target": "p-ju-yeongha", "type": "subject_of", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
