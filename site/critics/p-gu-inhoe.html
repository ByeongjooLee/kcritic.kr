    <section class="critic-profile-meta">

        <h2 class="meta-label">주요 비평 대상</h2>

      </div>

        <div class="chip-group"><span class="chip chip-term">마르크스 (1)</span> <span class="chip chip-term">최장집 (1)</span> <span class="chip chip-term">조지프 스티글리츠 (1)</span> <span class="chip chip-term">케이트 피킷 (1)</span> <span class="chip chip-term">문재인 (1)</span> <span class="chip chip-term">리처드 윌킨슨 (1)</span> <span class="chip chip-term">토마 피케티 (1)</span></div>

    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb5752", "label": "소득불평등의 원인과 실태", "type": "essay", "year": "2019", "degree": 8}, {"id": "p-00152", "label": "마르크스", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q9061 http://lod.nl.go.kr/resource/KAC199617910 https://isni.org/isni/0000000122796570 http://viaf.org/viaf/49228757", "degree": 124, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199617910", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q9061", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Karl Marx"}, {"id": "p-choe-jangjip", "label": "최장집", "type": "theorist", "ref": "http://lod.nl.go.kr/resource/KAC201211211 https://isni.org/isni/0000000083914000 http://viaf.org/viaf/69015660", "degree": 26, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201211211", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}, {"id": "p-gu-inhoe", "label": "구인회", "type": "critic", "ref": "", "degree": 1, "lod": [], "en": ""}, {"id": "p-joseph-e-stiglitz", "label": "조지프 스티글리츠", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q18430 http://lod.nl.go.kr/resource/KAC200207601 https://isni.org/isni/0000000121267538 http://viaf.org/viaf/32057966", "degree": 7, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC200207601", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q18430", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-kate-pickett", "label": "케이트 피킷", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q1588504 http://lod.nl.go.kr/resource/KAC201207322 https://isni.org/isni/0000000116794384 http://viaf.org/viaf/80861977", "degree": 2, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201207322", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q1588504", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-mun-jaein", "label": "문재인", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q21001 http://lod.nl.go.kr/resource/KAC201113552 https://isni.org/isni/0000000460202827 http://viaf.org/viaf/72149616723003751010", "degree": 40, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201113552", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q21001", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-richard-wilkinson", "label": "리처드 윌킨슨", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q2096593 http://lod.nl.go.kr/resource/KAC200308894 https://isni.org/isni/0000000121396479 http://viaf.org/viaf/74022316", "degree": 2, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC200308894", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q2096593", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-thomas-piketty", "label": "토마 피케티", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q984448 http://lod.nl.go.kr/resource/KAC201425417 https://isni.org/isni/0000000110415486 http://viaf.org/viaf/17309833", "degree": 6, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201425417", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q984448", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}], "edges": [{"source": "p-gu-inhoe", "target": "cb5752", "type": "wrote", "weight": 1}, {"source": "cb5752", "target": "p-00152", "type": "uses_theory", "weight": 1}, {"source": "cb5752", "target": "p-choe-jangjip", "type": "uses_theory", "weight": 1}, {"source": "cb5752", "target": "p-joseph-e-stiglitz", "type": "uses_theory", "weight": 1}, {"source": "cb5752", "target": "p-kate-pickett", "type": "uses_theory", "weight": 1}, {"source": "cb5752", "target": "p-mun-jaein", "type": "uses_theory", "weight": 1}, {"source": "cb5752", "target": "p-richard-wilkinson", "type": "uses_theory", "weight": 1}, {"source": "cb5752", "target": "p-thomas-piketty", "type": "uses_theory", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
    <section class="essay-grid">
      <h2 class="section-label">수록 비평글 (1편)</h2>
      
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2019</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb5752.html">소득불평등의 원인과 실태</a>
        </h3>
        <p class="essay-card-source">창작과비평 185호, 창비, 2019</p>
        <div class="essay-card-tags"><span class="tag">마르크스</span> <span class="tag">최장집</span> <span class="tag">조지프 스티글리츠</span> <span class="tag">케이트 피킷</span> <span class="tag">문재인</span> <span class="tag">리처드 윌킨슨</span> <span class="tag">토마 피케티</span></div>
      </article>
    </section>
