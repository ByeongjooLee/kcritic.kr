</head>
<body>

  <main class="container index-main">
    <section class="critic-profile-hero">
      <div class="critic-profile-byline"><span class="chip role-critic">윤선태</span></div>
      <h1 class="index-heading">윤선태</h1>
      <div class="lod-links"><a href="http://lod.nl.go.kr/resource/KAC201505363" target="_blank" class="lod-badge" title="국립중앙도서관 LOD">NLK LOD ↗</a> <a href="https://isni.org/isni/0000000464462415" target="_blank" class="lod-badge" title="ISNI">ISNI ↗</a> <a href="http://viaf.org/viaf/77152138602010981802" target="_blank" class="lod-badge" title="VIAF">VIAF ↗</a></div>
      <div class="stat-row">
        <div class="stat"><span class="stat-num">1</span><span class="stat-label">수록 비평글</span></div>
        <div class="stat"><span class="stat-num">0</span><span class="stat-label">비평 대상 작가</span></div>
        <div class="stat"><span class="stat-num">4</span><span class="stat-label">활용 이론가</span></div>
      </div>
    </section>

    <section class="critic-profile-meta">
      <div class="meta-section">
        <h2 class="meta-label">주요 비평 대상</h2>
        <div class="chip-group"><span class="muted">—</span></div>
      </div>
      <div class="meta-section">
        <h2 class="meta-label">자주 활용한 이론가</h2>
        <div class="chip-group"><span class="chip chip-term">안정복 (1)</span> <span class="chip chip-term">콜링우드 (1)</span> <span class="chip chip-term">하야시 타이스케 (1)</span> <span class="chip chip-term">몸젠 (1)</span></div>
      </div>
    </section>
    
    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb4095", "label": "‘통일신라론’을 다시 말한다", "type": "essay", "year": "2009", "degree": 5}, {"id": "cb4137", "label": "한국 근대문학 연구와 식민주의", "type": "essay", "year": "2010", "degree": 14}, {"id": "cb4421", "label": "식민주의와 근대의 특권화를 넘어서", "type": "essay", "year": "2011", "degree": 10}, {"id": "cb6795", "label": "김흥규 『근대의 특권화를 넘어서』", "type": "essay", "year": "2023", "degree": 5}, {"id": "p-an-jeongbok", "label": "안정복", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q6821059 http://lod.nl.go.kr/resource/KAC201420576 https://isni.org/isni/0000000026641376 http://viaf.org/viaf/33330060", "degree": 1, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201420576", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q6821059", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-collingwood", "label": "콜링우드", "type": "theorist", "ref": "", "degree": 2, "lod": [], "en": ""}, {"id": "p-hayasi-taiseuke", "label": "하야시 타이스케", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q6533371 http://lod.nl.go.kr/resource/KAC201319772 https://isni.org/isni/0000000082336747 http://viaf.org/viaf/53088071", "degree": 1, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201319772", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q6533371", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-mom-jen", "label": "몸젠", "type": "theorist", "ref": "", "degree": 1, "lod": [], "en": ""}, {"id": "p-yun-seontae", "label": "윤선태", "type": "critic", "ref": "http://lod.nl.go.kr/resource/KAC201505363 https://isni.org/isni/0000000464462415 http://viaf.org/viaf/77152138602010981802", "degree": 4, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201505363", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}], "edges": [{"source": "cb4137", "target": "p-yun-seontae", "type": "uses_theory", "weight": 1}, {"source": "cb4421", "target": "p-yun-seontae", "type": "uses_theory", "weight": 1}, {"source": "cb6795", "target": "p-yun-seontae", "type": "uses_theory", "weight": 1}, {"source": "p-yun-seontae", "target": "cb4095", "type": "wrote", "weight": 1}, {"source": "cb4095", "target": "p-an-jeongbok", "type": "uses_theory", "weight": 1}, {"source": "cb4095", "target": "p-collingwood", "type": "uses_theory", "weight": 1}, {"source": "cb4095", "target": "p-hayasi-taiseuke", "type": "uses_theory", "weight": 1}, {"source": "cb4095", "target": "p-mom-jen", "type": "uses_theory", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
    <section class="essay-grid">
      <h2 class="section-label">수록 비평글 (1편)</h2>
      
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2009</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb4095.html">‘통일신라론’을 다시 말한다</a>
        </h3>
        <p class="essay-card-source">창작과비평 146호, 창비, 2009</p>
        <div class="essay-card-tags"><span class="tag">안정복</span> <span class="tag">콜링우드</span> <span class="tag">하야시 타이스케</span> <span class="tag">몸젠</span></div>
      </article>
    </section>
  </main>

  <script src="/kc-shell.js"></script>
</body>
</html>
