    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb6087", "label": "휴머니즘의 외부와 열림의 존재론", "type": "essay", "year": "2021", "degree": 5}, {"id": "cb6354", "label": "여성의 돌봄에서 공동체의 돌봄으로", "type": "essay", "year": "2023", "degree": 6}, {"id": "p-00186", "label": "릴케", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q76483 http://lod.nl.go.kr/resource/KAC199623067 https://isni.org/isni/0000000121312247 http://viaf.org/viaf/46897170", "degree": 34, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199623067", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q76483", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Rainer Maria Rilke"}, {"id": "p-deleuze", "label": "들뢰즈", "type": "theorist", "ref": "", "degree": 55, "lod": [], "en": ""}, {"id": "p-gim-juwon", "label": "김주원", "type": "critic", "ref": "", "degree": 2, "lod": [], "en": ""}, {"id": "p-gim-mijeong", "label": "김미정", "type": "critic", "ref": "", "degree": 12, "lod": [], "en": ""}, {"id": "p-gim-yudam", "label": "김유담", "type": "critic", "ref": "http://lod.nl.go.kr/resource/KAC201823317 https://isni.org/isni/0000000467936700 http://viaf.org/viaf/161153409740341581785", "degree": 5, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201823317", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}, {"id": "p-hwang-jeongeun", "label": "황정은", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q12625900 http://lod.nl.go.kr/resource/KAC201103334 https://isni.org/isni/0000000118516177 http://viaf.org/viaf/169655004", "degree": 27, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201103334", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q12625900", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-maedeulrin-beonting", "label": "매들린 번팅", "type": "theorist", "ref": "http://lod.nl.go.kr/resource/KAC2024B2114 https://isni.org/isni/0000000041964632", "degree": 2, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC2024B2114", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}, {"id": "p-sin-haeuk", "label": "신해욱", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q16084367 http://lod.nl.go.kr/resource/KAC201215083 https://isni.org/isni/0000000447949643 http://viaf.org/viaf/38152138521810980703", "degree": 2, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201215083", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q16084367", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-sin-hyeongcheol", "label": "신형철", "type": "critic", "ref": "https://www.wikidata.org/wiki/Q16084418 http://lod.nl.go.kr/resource/KAC201105768 https://isni.org/isni/0000000077460583 http://viaf.org/viaf/107944853", "degree": 23, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201105768", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q16084418", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-woolf", "label": "버지니아 울프", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q40909 http://lod.nl.go.kr/resource/KAC199630555 https://isni.org/isni/0000000120959604 http://viaf.org/viaf/39385478", "degree": 13, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199630555", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q40909", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Virginia Woolf"}], "edges": [{"source": "p-gim-juwon", "target": "cb6087", "type": "wrote", "weight": 1}, {"source": "p-gim-juwon", "target": "cb6354", "type": "wrote", "weight": 1}, {"source": "cb6087", "target": "p-00186", "type": "uses_theory", "weight": 1}, {"source": "cb6087", "target": "p-deleuze", "type": "uses_theory", "weight": 1}, {"source": "cb6087", "target": "p-sin-haeuk", "type": "subject_of", "weight": 1}, {"source": "cb6087", "target": "p-sin-hyeongcheol", "type": "uses_theory", "weight": 1}, {"source": "cb6354", "target": "p-gim-mijeong", "type": "uses_theory", "weight": 1}, {"source": "cb6354", "target": "p-gim-yudam", "type": "subject_of", "weight": 1}, {"source": "cb6354", "target": "p-hwang-jeongeun", "type": "subject_of", "weight": 1}, {"source": "cb6354", "target": "p-maedeulrin-beonting", "type": "uses_theory", "weight": 1}, {"source": "cb6354", "target": "p-woolf", "type": "uses_theory", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>

      </article>
