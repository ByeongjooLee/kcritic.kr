  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="/kc-shell.css">
</head>
<body>

  <main class="container index-main">
    <section class="critic-profile-hero">
      <div class="critic-profile-byline"><span class="chip role-critic">조문영</span></div>
      <h1 class="index-heading">조문영</h1>
      <div class="lod-links"><a href="http://lod.nl.go.kr/resource/KAC201420949" target="_blank" class="lod-badge" title="국립중앙도서관 LOD">NLK LOD ↗</a> <a href="https://isni.org/isni/0000000464382706" target="_blank" class="lod-badge" title="ISNI">ISNI ↗</a> <a href="http://viaf.org/viaf/60152138529410981244" target="_blank" class="lod-badge" title="VIAF">VIAF ↗</a></div>
      <div class="stat-row">
        <div class="stat"><span class="stat-num">2</span><span class="stat-label">수록 비평글</span></div>
        <div class="stat"><span class="stat-num">0</span><span class="stat-label">비평 대상 작가</span></div>
        <div class="stat"><span class="stat-num">3</span><span class="stat-label">활용 이론가</span></div>
      </div>
    </section>

    <section class="critic-profile-meta">
      <div class="meta-section">
        <h2 class="meta-label">주요 비평 대상</h2>
        <div class="chip-group"><span class="muted">—</span></div>
      </div>
      <div class="meta-section">
        <h2 class="meta-label">자주 활용한 이론가</h2>
        <div class="chip-group"><span class="chip chip-term">알튀세르 (1)</span> <span class="chip chip-term">쑨거 (1)</span> <span class="chip chip-term">원톄쥔 (1)</span></div>
      </div>
    </section>
    
    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb4880", "label": "원 톄쥔 『백년의 급진』", "type": "essay", "year": "2014", "degree": 4}, {"id": "cb6363", "label": "조문영 『빈곤 과정』", "type": "essay", "year": "2023", "degree": 2}, {"id": "cb6917", "label": "김진희 외 『그여자가방에들어가신다』", "type": "essay", "year": "2023", "degree": 1}, {"id": "p-jo-munyeong", "label": "조문영", "type": "critic", "ref": "http://lod.nl.go.kr/resource/KAC201420949 https://isni.org/isni/0000000464382706 http://viaf.org/viaf/60152138529410981244", "degree": 3, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201420949", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}, {"id": "p-l-althusser", "label": "알튀세르", "type": "theorist", "ref": "", "degree": 10, "lod": [], "en": ""}, {"id": "p-ssun-geo", "label": "쑨거", "type": "theorist", "ref": "http://lod.nl.go.kr/resource/KAC200309188 https://isni.org/isni/0000000083291878 http://viaf.org/viaf/117531683", "degree": 11, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC200309188", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}, {"id": "p-won-tyejwin", "label": "원톄쥔", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q9064162 http://lod.nl.go.kr/resource/KAC201100342 http://viaf.org/viaf/197304026", "degree": 3, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201100342", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q9064162", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}], "edges": [{"source": "cb6363", "target": "p-jo-munyeong", "type": "uses_theory", "weight": 1}, {"source": "p-jo-munyeong", "target": "cb4880", "type": "wrote", "weight": 1}, {"source": "p-jo-munyeong", "target": "cb6917", "type": "wrote", "weight": 1}, {"source": "cb4880", "target": "p-l-althusser", "type": "uses_theory", "weight": 1}, {"source": "cb4880", "target": "p-ssun-geo", "type": "uses_theory", "weight": 1}, {"source": "cb4880", "target": "p-won-tyejwin", "type": "uses_theory", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
    <section class="essay-grid">
      <h2 class="section-label">수록 비평글 (2편)</h2>
      
      <article class="essay-card">

        <h3 class="essay-card-title">
          <a href="../essays/cb4880.html">원 톄쥔 『백년의 급진』</a>
        </h3>
        <p class="essay-card-source">창작과비평 163호, 창비, 2014</p>
        <div class="essay-card-tags"><span class="tag">알튀세르</span> <span class="tag">쑨거</span> <span class="tag">원톄쥔</span></div>
      </article>
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2023</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb6917.html">김진희 외 『그여자가방에들어가신다』</a>
        </h3>
        <p class="essay-card-source">창작과비평 202호, 창비, 2023</p>
        <div class="essay-card-tags"></div>
      </article>
    </section>
  </main>

  <script src="/kc-shell.js"></script>
</body>
</html>
