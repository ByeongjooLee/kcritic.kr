<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>박성원 — 한국 비평사 온톨로지</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="/kc-shell.css">
</head>
<body>

  <main class="container index-main">
    <section class="critic-profile-hero">
      <div class="critic-profile-byline"><span class="chip role-critic">박성원</span></div>
      <h1 class="index-heading">박성원</h1>
      
      <div class="stat-row">
        <div class="stat"><span class="stat-num">1</span><span class="stat-label">수록 비평글</span></div>
        <div class="stat"><span class="stat-num">1</span><span class="stat-label">비평 대상 작가</span></div>
        <div class="stat"><span class="stat-num">0</span><span class="stat-label">활용 이론가</span></div>
      </div>
    </section>

    <section class="critic-profile-meta">
      <div class="meta-section">
        <h2 class="meta-label">주요 비평 대상</h2>
        <div class="chip-group"><span class="chip role-writer">박성원</span></div>
      </div>
      <div class="meta-section">
        <h2 class="meta-label">자주 활용한 이론가</h2>
        <div class="chip-group"><span class="muted">—</span></div>
      </div>
    </section>
    
    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "jang-seokju_diverging-discourses-of-disillusion-park-cheongho_1996", "label": "분화해가는 환멸의 담론들 — 박청호의 소설에 대하여", "type": "essay", "year": "1996", "degree": 18}, {"id": "kim-juyeon_collapse-of-sexual-mores-perspectivism_1997", "label": "성관습의 붕괴와 원근법주의 — 세기말의 젊은 소설가들", "type": "essay", "year": "1997", "degree": 9}, {"id": "kwon-oryong_kim-juyeon-fake-truth_1998", "label": "전환의 모색, 그리고 그 모호함 — 김주연 평론집 『가짜의 진실, 그 환상』", "type": "essay", "year": "1998", "degree": 12}, {"id": "kwon-seongwoo_new-generation-critics-dialogue_1997", "label": "신세대 문학에 대한 비평가의 대화", "type": "essay", "year": "1997", "degree": 27}, {"id": "lee-seonguk_literature-and-kitsch_1998", "label": "문학과 키치", "type": "essay", "year": "1998", "degree": 22}, {"id": "oh-yunho_park-seongwon-narcissism-reader_2000", "label": "나르시시즘에 중독된 ‘나’에게", "type": "essay", "year": "2000", "degree": 3}, {"id": "p-park-seongwon", "label": "박성원", "type": "critic", "ref": "", "degree": 11, "lod": [], "en": ""}, {"id": "park-seongwon_writers-letter_2000", "label": "작가의 편지", "type": "essay", "year": "2000", "degree": 2}, {"id": "seong-minyeop_three-young-novelistic-personalities_1995", "label": "세 개의 젊은 소설적 개성과 신세대 소설", "type": "essay", "year": "1995", "degree": 11}, {"id": "sin-sujeong_television-kid-play_1997", "label": "텔레비전 키드의 유희", "type": "essay", "year": "1997", "degree": 13}, {"id": "woo-chanje_park-seongwon-strange-reversible-reaction_2000", "label": "연기하는 ‘이상한 가역 반응’ — 박성원론", "type": "essay", "year": "2000", "degree": 6}], "edges": [{"source": "jang-seokju_diverging-discourses-of-disillusion-park-cheongho_1996", "target": "p-park-seongwon", "type": "subject_of", "weight": 1}, {"source": "kim-juyeon_collapse-of-sexual-mores-perspectivism_1997", "target": "p-park-seongwon", "type": "subject_of", "weight": 1}, {"source": "kwon-oryong_kim-juyeon-fake-truth_1998", "target": "p-park-seongwon", "type": "subject_of", "weight": 1}, {"source": "kwon-seongwoo_new-generation-critics-dialogue_1997", "target": "p-park-seongwon", "type": "subject_of", "weight": 1}, {"source": "lee-seonguk_literature-and-kitsch_1998", "target": "p-park-seongwon", "type": "subject_of", "weight": 1}, {"source": "oh-yunho_park-seongwon-narcissism-reader_2000", "target": "p-park-seongwon", "type": "subject_of", "weight": 1}, {"source": "p-park-seongwon", "target": "park-seongwon_writers-letter_2000", "type": "wrote", "weight": 1}, {"source": "park-seongwon_writers-letter_2000", "target": "p-park-seongwon", "type": "subject_of", "weight": 1}, {"source": "seong-minyeop_three-young-novelistic-personalities_1995", "target": "p-park-seongwon", "type": "subject_of", "weight": 1}, {"source": "sin-sujeong_television-kid-play_1997", "target": "p-park-seongwon", "type": "subject_of", "weight": 1}, {"source": "woo-chanje_park-seongwon-strange-reversible-reaction_2000", "target": "p-park-seongwon", "type": "subject_of", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
    <section class="essay-grid">
      <h2 class="section-label">수록 비평글 (1편)</h2>
      
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2000</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/park-seongwon_writers-letter_2000.html">작가의 편지</a>
        </h3>
        <p class="essay-card-source">문학과사회 52호, 문학과지성사, 2000</p>
        <div class="essay-card-tags"><span class="tag">박성원</span></div>
      </article>
    </section>
  </main>

  <script src="/kc-shell.js"></script>
</body>
</html>
