<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>정우영 — 한국 비평사 온톨로지</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="/kc-shell.css">
</head>
<body>

  <main class="container index-main">
    <section class="critic-profile-hero">
      <div class="critic-profile-byline"><span class="chip role-critic">정우영</span></div>
      <h1 class="index-heading">정우영</h1>
      
      <div class="stat-row">
        <div class="stat"><span class="stat-num">2</span><span class="stat-label">수록 비평글</span></div>
        <div class="stat"><span class="stat-num">5</span><span class="stat-label">비평 대상 작가</span></div>
        <div class="stat"><span class="stat-num">0</span><span class="stat-label">활용 이론가</span></div>
      </div>
    </section>

    <section class="critic-profile-meta">
      <div class="meta-section">
        <h2 class="meta-label">주요 비평 대상</h2>
        <div class="chip-group"><span class="chip role-writer">신경림</span> <span class="chip role-writer">김선향</span> <span class="chip role-writer">이명윤</span> <span class="chip role-writer">문동만</span> <span class="chip role-writer">손택수</span></div>
      </div>
      <div class="meta-section">
        <h2 class="meta-label">자주 활용한 이론가</h2>
        <div class="chip-group"><span class="muted">—</span></div>
      </div>
    </section>
    
    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb5950", "label": "생활의 발견", "type": "essay", "year": "2020", "degree": 3}, {"id": "cb7240", "label": "훈기로 설레는 발견의 시들", "type": "essay", "year": "2025", "degree": 4}, {"id": "p-00199", "label": "신경림", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q3482149 http://lod.nl.go.kr/resource/KAC201200501 https://isni.org/isni/0000000079981745 http://viaf.org/viaf/59193837", "degree": 37, "lod": [{"href": "https://encykorea.aks.ac.kr/Article/E0013094", "label": "한(작품)", "full": "한국민족문화대백과 (작품)", "bg": "#f0ede8", "fg": "#5a3a2a"}, {"href": "http://lod.nl.go.kr/resource/KAC201200501", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q3482149", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-gim-seonhyang", "label": "김선향", "type": "writer", "ref": "http://lod.nl.go.kr/resource/KAC201615495 https://isni.org/isni/000000047770484X http://viaf.org/viaf/583148996065159752517", "degree": 2, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201615495", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}, {"id": "p-i-myeongyun", "label": "이명윤", "type": "writer", "ref": "http://lod.nl.go.kr/resource/KAC201736274 https://isni.org/isni/0000000468549198 http://viaf.org/viaf/41151352047052602502", "degree": 2, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201736274", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}, {"id": "p-jeong-uyeong", "label": "정우영", "type": "critic", "ref": "", "degree": 2, "lod": [], "en": ""}, {"id": "p-mun-dongman", "label": "문동만", "type": "writer", "ref": "http://lod.nl.go.kr/resource/KAC201308264 https://isni.org/isni/0000000467679513 http://viaf.org/viaf/530144928081554341397", "degree": 1, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201308264", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}, {"id": "p-son-taeksu", "label": "손택수", "type": "critic", "ref": "http://lod.nl.go.kr/resource/KAC201102812 https://isni.org/isni/0000000053360852 http://viaf.org/viaf/54454676", "degree": 6, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201102812", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}], "edges": [{"source": "p-jeong-uyeong", "target": "cb5950", "type": "wrote", "weight": 1}, {"source": "p-jeong-uyeong", "target": "cb7240", "type": "wrote", "weight": 1}, {"source": "cb5950", "target": "p-i-myeongyun", "type": "subject_of", "weight": 1}, {"source": "cb5950", "target": "p-mun-dongman", "type": "subject_of", "weight": 1}, {"source": "cb7240", "target": "p-00199", "type": "subject_of", "weight": 1}, {"source": "cb7240", "target": "p-gim-seonhyang", "type": "subject_of", "weight": 1}, {"source": "cb7240", "target": "p-son-taeksu", "type": "subject_of", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
    <section class="essay-grid">
      <h2 class="section-label">수록 비평글 (2편)</h2>
      
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2020</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb5950.html">생활의 발견</a>
        </h3>
        <p class="essay-card-source">창작과비평 190호, 창비, 2020</p>
        <div class="essay-card-tags"><span class="tag">이명윤</span> <span class="tag">문동만</span></div>
      </article>
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2025</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb7240.html">훈기로 설레는 발견의 시들</a>
        </h3>
        <p class="essay-card-source">창작과비평 209호, 창비, 2025</p>
        <div class="essay-card-tags"><span class="tag">신경림</span> <span class="tag">김선향</span> <span class="tag">손택수</span></div>
      </article>
    </section>
  </main>

  <script src="/kc-shell.js"></script>
</body>
</html>
