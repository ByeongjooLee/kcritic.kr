    <section class="critic-profile-meta">

    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb3431", "label": "해리 포터는 아동문학의 고전으로 남을 것인가", "type": "essay", "year": "2005", "degree": 6}, {"id": "p-00209", "label": "스티븐슨", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q1512 http://lod.nl.go.kr/resource/KAC199626492 https://isni.org/isni/0000000122831567 http://viaf.org/viaf/95207986", "degree": 4, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199626492", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q1512", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Robert Louis Stevenson"}, {"id": "p-barrie", "label": "J. M. 배리", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q81796 http://lod.nl.go.kr/resource/KAC200508436 https://isni.org/isni/0000000080775690 http://viaf.org/viaf/64001320", "degree": 1, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC200508436", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q81796", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-jack-zipes", "label": "잭 자이프스", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q165578 http://lod.nl.go.kr/resource/KAC199630976 https://isni.org/isni/000000012147326X http://viaf.org/viaf/109329562", "degree": 1, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199630976", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q165578", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-rowling", "label": "J. K. 롤링", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q34660 http://lod.nl.go.kr/resource/KAC200203553 https://isni.org/isni/000000012148628X http://viaf.org/viaf/116796842", "degree": 1, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC200203553", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q34660", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-son-hyangsuk", "label": "손향숙", "type": "critic", "ref": "http://lod.nl.go.kr/resource/KAC201213366 https://isni.org/isni/000000046104623X http://viaf.org/viaf/212150468348104172269", "degree": 1, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201213366", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}, {"id": "p-thomas-hughes", "label": "토머스 휴스", "type": "writer", "ref": "", "degree": 1, "lod": [], "en": ""}], "edges": [{"source": "p-son-hyangsuk", "target": "cb3431", "type": "wrote", "weight": 1}, {"source": "cb3431", "target": "p-00209", "type": "subject_of", "weight": 1}, {"source": "cb3431", "target": "p-barrie", "type": "subject_of", "weight": 1}, {"source": "cb3431", "target": "p-jack-zipes", "type": "subject_of", "weight": 1}, {"source": "cb3431", "target": "p-rowling", "type": "subject_of", "weight": 1}, {"source": "cb3431", "target": "p-thomas-hughes", "type": "subject_of", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>

        </div>

          <a href="../essays/cb3431.html">해리 포터는 아동문학의 고전으로 남을 것인가</a>
        </h3>
        <p class="essay-card-source">창작과비평 130호, 창비, 2005</p>
        <div class="essay-card-tags"><span class="tag">로버트 루이스 스티븐슨</span> <span class="tag">J. M. 배리</span> <span class="tag">잭 자이프스</span> <span class="tag">J. K. 롤링</span> <span class="tag">토머스 휴스</span></div>
      </article>
    </section>
