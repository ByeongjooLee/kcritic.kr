      <h1 class="index-heading">박정민</h1>

      <div class="stat-row">
        <div class="stat"><span class="stat-num">2</span><span class="stat-label">수록 비평글</span></div>
        <div class="stat"><span class="stat-num">2</span><span class="stat-label">비평 대상 작가</span></div>
        <div class="stat"><span class="stat-num">0</span><span class="stat-label">활용 이론가</span></div>

    <section class="critic-profile-meta">
      <div class="meta-section">
        <h2 class="meta-label">주요 비평 대상</h2>
        <div class="chip-group"><span class="chip role-writer">정지용</span> <span class="chip role-writer">박민규</span></div>
      </div>
      <div class="meta-section">

        <div class="chip-group"><span class="muted">—</span></div>
      </div>

    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb6790", "label": "박민규 『죽은 왕녀를 위한 파반느』", "type": "essay", "year": "2023", "degree": 2}, {"id": "cb7284", "label": "수치심의 역사(내 삶을 돌본 것 ④)", "type": "essay", "year": "2025", "degree": 2}, {"id": "p-00086", "label": "정지용", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q4707772 https://encykorea.aks.ac.kr/Article/E0050953 http://lod.nl.go.kr/resource/KAC201009552 https://isni.org/isni/0000000084824322 http://viaf.org/viaf/118926996", "degree": 52, "lod": [{"href": "https://encykorea.aks.ac.kr/Article/E0050953", "label": "한", "full": "한국민족문화대백과", "bg": "#e8f0e8", "fg": "#2a5a2a"}, {"href": "https://encykorea.aks.ac.kr/Article/E0062938", "label": "한(작품)", "full": "한국민족문화대백과 (작품)", "bg": "#f0ede8", "fg": "#5a3a2a"}, {"href": "http://lod.nl.go.kr/resource/KAC201009552", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q4707772", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-bak-jeongmin", "label": "박정민", "type": "critic", "ref": "https://www.wikidata.org/wiki/Q12597061 http://lod.nl.go.kr/resource/KAC201807652 https://isni.org/isni/0000000468312852 http://viaf.org/viaf/74154013820109192656", "degree": 2, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201807652", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q12597061", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-bak-mingyu", "label": "박민규", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q7137903 http://lod.nl.go.kr/resource/KAC201009357 https://isni.org/isni/0000000044221463 http://viaf.org/viaf/53915357", "degree": 23, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201009357", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q7137903", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}], "edges": [{"source": "p-bak-jeongmin", "target": "cb6790", "type": "wrote", "weight": 1}, {"source": "p-bak-jeongmin", "target": "cb7284", "type": "wrote", "weight": 1}, {"source": "cb6790", "target": "p-bak-mingyu", "type": "subject_of", "weight": 1}, {"source": "cb7284", "target": "p-00086", "type": "subject_of", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>

      </article>
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2025</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb7284.html">수치심의 역사(내 삶을 돌본 것 ④)</a>
        </h3>
        <p class="essay-card-source">창작과비평 210호, 창비, 2025</p>
        <div class="essay-card-tags"><span class="tag">정지용</span></div>
