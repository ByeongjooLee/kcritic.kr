    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb3655", "label": "대한민국 ‘레짐 체인지’", "type": "essay", "year": "2007", "degree": 9}, {"id": "cb4425", "label": "문재인 『문재인의 운명』", "type": "essay", "year": "2011", "degree": 4}, {"id": "p-an-byeongjin", "label": "안병진", "type": "critic", "ref": "http://lod.nl.go.kr/resource/KAC201230104 https://isni.org/isni/0000000046649359 http://viaf.org/viaf/46422272", "degree": 2, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201230104", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}, {"id": "p-bak-seil", "label": "박세일", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q11243258 http://lod.nl.go.kr/resource/KAC201200870 https://isni.org/isni/0000000084703766 http://viaf.org/viaf/120146936686213781054", "degree": 4, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201200870", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q11243258", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-choe-jangjip", "label": "최장집", "type": "theorist", "ref": "http://lod.nl.go.kr/resource/KAC201211211 https://isni.org/isni/0000000083914000 http://viaf.org/viaf/69015660", "degree": 19, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201211211", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}, {"id": "p-david-plotke", "label": "데이비드 플롯케", "type": "theorist", "ref": "", "degree": 1, "lod": [], "en": ""}, {"id": "p-gim-dongchun", "label": "김동춘", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q21575776 http://lod.nl.go.kr/resource/KAC201232151 https://isni.org/isni/0000000078504779 http://viaf.org/viaf/103661441", "degree": 8, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201232151", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q21575776", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-gim-geuntae", "label": "김근태", "type": "theorist", "ref": "", "degree": 3, "lod": [], "en": ""}, {"id": "p-gim-yunjae", "label": "김윤재", "type": "theorist", "ref": "", "degree": 1, "lod": [], "en": ""}, {"id": "p-no-muhyeon", "label": "노무현", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q14345 http://lod.nl.go.kr/resource/KAC201100150 https://isni.org/isni/0000000121219755 http://viaf.org/viaf/15704800", "degree": 53, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201100150", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q14345", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-song-hogeun", "label": "송호근", "type": "theorist", "ref": "", "degree": 4, "lod": [], "en": ""}], "edges": [{"source": "cb4425", "target": "p-an-byeongjin", "type": "uses_theory", "weight": 1}, {"source": "p-an-byeongjin", "target": "cb3655", "type": "wrote", "weight": 1}, {"source": "cb3655", "target": "p-bak-seil", "type": "uses_theory", "weight": 1}, {"source": "cb3655", "target": "p-choe-jangjip", "type": "uses_theory", "weight": 1}, {"source": "cb3655", "target": "p-david-plotke", "type": "uses_theory", "weight": 1}, {"source": "cb3655", "target": "p-gim-dongchun", "type": "uses_theory", "weight": 1}, {"source": "cb3655", "target": "p-gim-geuntae", "type": "uses_theory", "weight": 1}, {"source": "cb3655", "target": "p-gim-yunjae", "type": "uses_theory", "weight": 1}, {"source": "cb3655", "target": "p-no-muhyeon", "type": "uses_theory", "weight": 1}, {"source": "cb3655", "target": "p-song-hogeun", "type": "uses_theory", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
