    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb3980", "label": "조해진 소설집 『천사들의 도시』", "type": "essay", "year": "2009", "degree": 3}, {"id": "cb4908", "label": "외국어로 말 걸기", "type": "essay", "year": "2014", "degree": 6}, {"id": "cb5086", "label": "세계의 불안을 견디는 두가지 방식", "type": "essay", "year": "2016", "degree": 10}, {"id": "cb5434", "label": "조해진 장편소설 『로기완을 만났다』", "type": "essay", "year": "2011", "degree": 2}, {"id": "cb5964", "label": "생명, 노동, 돌봄의 문학", "type": "essay", "year": "2020", "degree": 12}, {"id": "cb7065", "label": "이철 『장동일지』", "type": "essay", "year": "2024", "degree": 4}, {"id": "cb7104", "label": "슬픔 곁에 모이는 빛", "type": "essay", "year": "2024", "degree": 3}, {"id": "p-jo-haejin", "label": "조해진", "type": "critic", "ref": "https://www.wikidata.org/wiki/Q45025266 http://lod.nl.go.kr/resource/KAC201105206 https://isni.org/isni/0000000075989416 http://viaf.org/viaf/106768974", "degree": 7, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201105206", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q45025266", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-seo-gyeongsik", "label": "서경식", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q11250148 http://lod.nl.go.kr/resource/KAC200206995 https://isni.org/isni/0000000119388023 http://viaf.org/viaf/108224026", "degree": 8, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC200206995", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q11250148", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-seo-junsik", "label": "서준식", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q24868670 http://lod.nl.go.kr/resource/KAC201723069 https://isni.org/isni/0000000084399733 http://viaf.org/viaf/35768091", "degree": 2, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201723069", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q24868670", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-seo-seung", "label": "서승", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q7635172 http://lod.nl.go.kr/resource/KAC200901659 https://isni.org/isni/0000000082199121 http://viaf.org/viaf/38230057", "degree": 1, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC200901659", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q7635172", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}], "edges": [{"source": "cb3980", "target": "p-jo-haejin", "type": "subject_of", "weight": 1}, {"source": "cb4908", "target": "p-jo-haejin", "type": "subject_of", "weight": 1}, {"source": "cb5086", "target": "p-jo-haejin", "type": "subject_of", "weight": 1}, {"source": "cb5434", "target": "p-jo-haejin", "type": "subject_of", "weight": 1}, {"source": "cb5964", "target": "p-jo-haejin", "type": "subject_of", "weight": 1}, {"source": "cb7104", "target": "p-jo-haejin", "type": "subject_of", "weight": 1}, {"source": "p-jo-haejin", "target": "cb7065", "type": "wrote", "weight": 1}, {"source": "cb7065", "target": "p-seo-gyeongsik", "type": "uses_theory", "weight": 1}, {"source": "cb7065", "target": "p-seo-junsik", "type": "uses_theory", "weight": 1}, {"source": "cb7065", "target": "p-seo-seung", "type": "uses_theory", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
