      <div class="stat-row">
        <div class="stat"><span class="stat-num">2</span><span class="stat-label">수록 비평글</span></div>

    <section class="critic-profile-meta">
      <div class="meta-section">
        <h2 class="meta-label">주요 비평 대상</h2>
        <div class="chip-group"><span class="chip role-writer">윤석열</span></div>
      </div>
      <div class="meta-section">
        <h2 class="meta-label">자주 활용한 이론가</h2>
        <div class="chip-group"><span class="chip chip-term">최시형 (1)</span> <span class="chip chip-term">도원 (1)</span> <span class="chip chip-term">김상준 (1)</span> <span class="chip chip-term">트럼프 (1)</span></div>
      </div>

    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb4478", "label": "김상준 『맹자의 땀, 성왕의 피』", "type": "essay", "year": "2011", "degree": 2}, {"id": "cb7054", "label": "‘나라 만들기’를 향한 서사적 도정(K-담론을 모색한다 ③)", "type": "essay", "year": "2024", "degree": 5}, {"id": "cb7124", "label": "빛의 서사로 써나갈 새로운 질서", "type": "essay", "year": "2025", "degree": 5}, {"id": "cb7200", "label": "백영서·황정아 엮음 『문명전환의 한국사상』", "type": "essay", "year": "2025", "degree": 6}, {"id": "cb7247", "label": "백민정 『정약용의 정치사상』", "type": "essay", "year": "2025", "degree": 3}, {"id": "p-baek-minjeong", "label": "백민정", "type": "critic", "ref": "http://lod.nl.go.kr/resource/KAC201232138 https://isni.org/isni/0000000464719620 http://viaf.org/viaf/11763680", "degree": 5, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201232138", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}, {"id": "p-choe-sihyeong", "label": "최시형", "type": "theorist", "ref": "", "degree": 8, "lod": [], "en": ""}, {"id": "p-do-won", "label": "도원", "type": "theorist", "ref": "", "degree": 1, "lod": [], "en": ""}, {"id": "p-gim-sangjun", "label": "김상준", "type": "theorist", "ref": "http://lod.nl.go.kr/resource/KAC201109696 https://isni.org/isni/0000000040364942 http://viaf.org/viaf/21610110", "degree": 3, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201109696", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}, {"id": "p-teu-reompeu", "label": "트럼프", "type": "theorist", "ref": "", "degree": 6, "lod": [], "en": ""}, {"id": "p-yun-seokyeol", "label": "윤석열", "type": "writer", "ref": "", "degree": 34, "lod": [], "en": ""}], "edges": [{"source": "cb7054", "target": "p-baek-minjeong", "type": "uses_theory", "weight": 1}, {"source": "cb7200", "target": "p-baek-minjeong", "type": "uses_theory", "weight": 1}, {"source": "cb7247", "target": "p-baek-minjeong", "type": "uses_theory", "weight": 1}, {"source": "p-baek-minjeong", "target": "cb4478", "type": "wrote", "weight": 1}, {"source": "p-baek-minjeong", "target": "cb7124", "type": "wrote", "weight": 1}, {"source": "cb4478", "target": "p-gim-sangjun", "type": "uses_theory", "weight": 1}, {"source": "cb7124", "target": "p-choe-sihyeong", "type": "uses_theory", "weight": 1}, {"source": "cb7124", "target": "p-do-won", "type": "uses_theory", "weight": 1}, {"source": "cb7124", "target": "p-teu-reompeu", "type": "uses_theory", "weight": 1}, {"source": "cb7124", "target": "p-yun-seokyeol", "type": "subject_of", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>

        </h3>
        <p class="essay-card-source">창작과비평 154호, 창비, 2011</p>
        <div class="essay-card-tags"><span class="tag">김상준</span></div>
      </article>
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2025</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb7124.html">빛의 서사로 써나갈 새로운 질서</a>
        </h3>
        <p class="essay-card-source">창작과비평 207호, 창비, 2025</p>
        <div class="essay-card-tags"><span class="tag">윤석열</span><span class="tag">최시형</span> <span class="tag">도원</span> <span class="tag">트럼프</span></div>
      </article>
    </section>
  </main>

</body>
