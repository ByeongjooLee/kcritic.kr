<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>박상수 — 한국 비평사 온톨로지</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="/kc-shell.css">
</head>
<body>

  <main class="container index-main">
    <section class="critic-profile-hero">
      <div class="critic-profile-byline"><span class="chip role-critic">박상수</span></div>
      <h1 class="index-heading">박상수</h1>
      
      <div class="stat-row">
        <div class="stat"><span class="stat-num">2</span><span class="stat-label">수록 비평글</span></div>
        <div class="stat"><span class="stat-num">3</span><span class="stat-label">비평 대상 작가</span></div>
        <div class="stat"><span class="stat-num">0</span><span class="stat-label">활용 이론가</span></div>
      </div>
    </section>

    <section class="critic-profile-meta">
      <div class="meta-section">
        <h2 class="meta-label">주요 비평 대상</h2>
        <div class="chip-group"><span class="chip role-writer">황유원</span> <span class="chip role-writer">민구</span> <span class="chip role-writer">박정대</span></div>
      </div>
      <div class="meta-section">
        <h2 class="meta-label">자주 활용한 이론가</h2>
        <div class="chip-group"><span class="muted">—</span></div>
      </div>
    </section>
    
    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb5375", "label": "통감하는 주체, 유무의 경계 너머의 말들", "type": "essay", "year": "2017", "degree": 8}, {"id": "cb5435", "label": "박정대 시집 『삶이라는 직업』", "type": "essay", "year": "2011", "degree": 2}, {"id": "cb5487", "label": "위기 속의 비평과 시의 미학적 윤리", "type": "essay", "year": "2017", "degree": 12}, {"id": "cb6221", "label": "자본주의에 대처하는 우리의 자세", "type": "essay", "year": "2022", "degree": 9}, {"id": "cb6961", "label": "안전하고 평화롭게 살고 싶다, 시 속에서라도", "type": "essay", "year": "2024", "degree": 3}, {"id": "cb7286", "label": "평면화된 윤리를 교란하기", "type": "essay", "year": "2025", "degree": 6}, {"id": "p-bak-sangsu", "label": "박상수", "type": "critic", "ref": "", "degree": 6, "lod": [], "en": ""}, {"id": "p-hwang-yuwon", "label": "황유원", "type": "writer", "ref": "http://lod.nl.go.kr/resource/KAC201504153 https://isni.org/isni/0000000477423204 http://viaf.org/viaf/719144928080754341510", "degree": 2, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201504153", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}, {"id": "p-min-gu", "label": "민구", "type": "writer", "ref": "http://lod.nl.go.kr/resource/KAC201500092 https://isni.org/isni/0000000464353120 http://viaf.org/viaf/16152138537810981421", "degree": 1, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201500092", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}, {"id": "p-park-jeongdae", "label": "박정대", "type": "writer", "ref": "", "degree": 4, "lod": [], "en": ""}], "edges": [{"source": "cb5375", "target": "p-bak-sangsu", "type": "uses_theory", "weight": 1}, {"source": "cb5487", "target": "p-bak-sangsu", "type": "uses_theory", "weight": 1}, {"source": "cb6221", "target": "p-bak-sangsu", "type": "uses_theory", "weight": 1}, {"source": "cb7286", "target": "p-bak-sangsu", "type": "uses_theory", "weight": 1}, {"source": "p-bak-sangsu", "target": "cb5435", "type": "wrote", "weight": 1}, {"source": "p-bak-sangsu", "target": "cb6961", "type": "wrote", "weight": 1}, {"source": "cb5435", "target": "p-park-jeongdae", "type": "subject_of", "weight": 1}, {"source": "cb6961", "target": "p-hwang-yuwon", "type": "subject_of", "weight": 1}, {"source": "cb6961", "target": "p-min-gu", "type": "subject_of", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
    <section class="essay-grid">
      <h2 class="section-label">수록 비평글 (2편)</h2>
      
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2011</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb5435.html">박정대 시집 『삶이라는 직업』</a>
        </h3>
        <p class="essay-card-source">창작과비평 153호, 창비, 2011</p>
        <div class="essay-card-tags"><span class="tag">박정대</span></div>
      </article>
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2024</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb6961.html">안전하고 평화롭게 살고 싶다, 시 속에서라도</a>
        </h3>
        <p class="essay-card-source">창작과비평 203호, 창비, 2024</p>
        <div class="essay-card-tags"><span class="tag">황유원</span> <span class="tag">민구</span></div>
      </article>
    </section>
  </main>

  <script src="/kc-shell.js"></script>
</body>
</html>
