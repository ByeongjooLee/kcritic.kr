    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb5092", "label": "이주자의 시민권을 민주화하기", "type": "essay", "year": "2016", "degree": 9}, {"id": "p-baek-yeonggyeong", "label": "백영경", "type": "critic", "ref": "http://lod.nl.go.kr/resource/KAC201303953 https://isni.org/isni/0000000461108437 http://viaf.org/viaf/231150468229804171643", "degree": 24, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201303953", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}, {"id": "p-bak-u", "label": "박우", "type": "theorist", "ref": "", "degree": 1, "lod": [], "en": ""}, {"id": "p-derrida", "label": "데리다", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q130631 http://lod.nl.go.kr/resource/KAC199606951 https://isni.org/isni/0000000121429146 http://viaf.org/viaf/88958529", "degree": 61, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199606951", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q130631", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-jo-hyoje", "label": "조효제", "type": "critic", "ref": "https://www.wikidata.org/wiki/Q133634249 http://lod.nl.go.kr/resource/KAC201212566 https://isni.org/isni/0000000049636246 http://viaf.org/viaf/59011971", "degree": 19, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201212566", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q133634249", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-lefebvre", "label": "앙리 르페브르", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q162597 http://lod.nl.go.kr/resource/KAC199616270 https://isni.org/isni/0000000068357525 http://viaf.org/viaf/14808728", "degree": 5, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199616270", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q162597", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Henri Lefebvre"}, {"id": "p-n-sarkozy", "label": "사르코지", "type": "theorist", "ref": "", "degree": 1, "lod": [], "en": ""}, {"id": "p-nancy-fraser", "label": "낸시 프레이저", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q267536 http://lod.nl.go.kr/resource/KAC200902074 https://isni.org/isni/0000000121477084 http://viaf.org/viaf/110699555", "degree": 10, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC200902074", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q267536", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-seilra-benhabibeu", "label": "세일라 벤하비브", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q263235 http://lod.nl.go.kr/resource/KAC200807453 https://isni.org/isni/0000000116975716 http://viaf.org/viaf/108276544", "degree": 2, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC200807453", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q263235", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-yang-hyeu", "label": "양혜우", "type": "critic", "ref": "", "degree": 1, "lod": [], "en": ""}], "edges": [{"source": "p-yang-hyeu", "target": "cb5092", "type": "wrote", "weight": 1}, {"source": "cb5092", "target": "p-baek-yeonggyeong", "type": "uses_theory", "weight": 1}, {"source": "cb5092", "target": "p-bak-u", "type": "uses_theory", "weight": 1}, {"source": "cb5092", "target": "p-derrida", "type": "uses_theory", "weight": 1}, {"source": "cb5092", "target": "p-jo-hyoje", "type": "uses_theory", "weight": 1}, {"source": "cb5092", "target": "p-lefebvre", "type": "uses_theory", "weight": 1}, {"source": "cb5092", "target": "p-n-sarkozy", "type": "uses_theory", "weight": 1}, {"source": "cb5092", "target": "p-nancy-fraser", "type": "uses_theory", "weight": 1}, {"source": "cb5092", "target": "p-seilra-benhabibeu", "type": "uses_theory", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
    <section class="essay-grid">
      <h2 class="section-label">수록 비평글 (1편)</h2>
      
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2016</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb5092.html">이주자의 시민권을 민주화하기</a>
        </h3>
        <p class="essay-card-source">창작과비평 172호, 창비, 2016</p>
        <div class="essay-card-tags"><span class="tag">백영경</span> <span class="tag">박우</span> <span class="tag">자크 데리다</span> <span class="tag">조효제</span> <span class="tag">앙리 르페브르</span> <span class="tag">사르코지</span> <span class="tag">낸시 프레이저</span> <span class="tag">세일라 벤하비브</span></div>
      </article>
    </section>
