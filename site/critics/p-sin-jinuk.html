    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb4751", "label": "지식의 정치와 새로운 인문학", "type": "essay", "year": "2013", "degree": 7}, {"id": "cb6072", "label": "더 큰 정의로 공정을 다시 쓴다", "type": "essay", "year": "2021", "degree": 4}, {"id": "cb6218", "label": "집토끼가 아니라 호랑이다", "type": "essay", "year": "2022", "degree": 5}, {"id": "cb6232", "label": "신진욱 『그런 세대는 없다』", "type": "essay", "year": "2022", "degree": 2}, {"id": "cb6343", "label": "‘적’을 만드는 정부와 시민사회 연대의 재건", "type": "essay", "year": "2023", "degree": 5}, {"id": "cb6767", "label": "구해근 『특권 중산층』", "type": "essay", "year": "2023", "degree": 3}, {"id": "p-00230", "label": "막스 베버", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q9387 http://lod.nl.go.kr/resource/KAC199629452 https://isni.org/isni/000000012145101X http://viaf.org/viaf/100180950", "degree": 38, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199629452", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q9387", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Max Weber"}, {"id": "p-e-laclau", "label": "라클라우", "type": "theorist", "ref": "", "degree": 4, "lod": [], "en": ""}, {"id": "p-gramsci", "label": "그람시", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q83003 http://lod.nl.go.kr/resource/KAC199610612 https://isni.org/isni/0000000122790742 http://viaf.org/viaf/44299576", "degree": 10, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199610612", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q83003", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-gu-haegeun", "label": "구해근", "type": "critic", "ref": "https://www.wikidata.org/wiki/Q120682949 http://lod.nl.go.kr/resource/KAC201502913 https://isni.org/isni/0000000084017539 http://viaf.org/viaf/94472167", "degree": 2, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201502913", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q120682949", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-michael-sandel", "label": "마이클 샌델", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q381044 http://lod.nl.go.kr/resource/KAC200801771 https://isni.org/isni/0000000117646033 http://viaf.org/viaf/56671734", "degree": 3, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC200801771", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q381044", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-sin-jinuk", "label": "신진욱", "type": "critic", "ref": "http://lod.nl.go.kr/resource/KAC201217254 https://isni.org/isni/0000000042617763 http://viaf.org/viaf/8485111", "degree": 6, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201217254", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}], "edges": [{"source": "cb4751", "target": "p-sin-jinuk", "type": "uses_theory", "weight": 1}, {"source": "cb6218", "target": "p-sin-jinuk", "type": "uses_theory", "weight": 1}, {"source": "cb6232", "target": "p-sin-jinuk", "type": "uses_theory", "weight": 1}, {"source": "cb6343", "target": "p-sin-jinuk", "type": "uses_theory", "weight": 1}, {"source": "p-sin-jinuk", "target": "cb6072", "type": "wrote", "weight": 1}, {"source": "p-sin-jinuk", "target": "cb6767", "type": "wrote", "weight": 1}, {"source": "cb6072", "target": "p-00230", "type": "uses_theory", "weight": 1}, {"source": "cb6072", "target": "p-gramsci", "type": "uses_theory", "weight": 1}, {"source": "cb6072", "target": "p-michael-sandel", "type": "uses_theory", "weight": 1}, {"source": "cb6767", "target": "p-e-laclau", "type": "uses_theory", "weight": 1}, {"source": "cb6767", "target": "p-gu-haegeun", "type": "uses_theory", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
