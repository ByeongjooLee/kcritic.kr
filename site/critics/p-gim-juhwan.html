<body>

      <div class="stat-row">
        <div class="stat"><span class="stat-num">1</span><span class="stat-label">수록 비평글</span></div>
        <div class="stat"><span class="stat-num">1</span><span class="stat-label">비평 대상 작가</span></div>
        <div class="stat"><span class="stat-num">3</span><span class="stat-label">활용 이론가</span></div>
      </div>
    </section>

    <section class="critic-profile-meta">
      <div class="meta-section">
        <h2 class="meta-label">주요 비평 대상</h2>
        <div class="chip-group"><span class="chip role-writer">움베르토 에코</span></div>
      </div>
      <div class="meta-section">
        <h2 class="meta-label">자주 활용한 이론가</h2>
        <div class="chip-group"><span class="chip chip-term">앤서니 기든스 (1)</span> <span class="chip chip-term">바흐친 (1)</span> <span class="chip chip-term">프랜시스 케언크로스 (1)</span></div>
      </div>
    </section>
    
    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb2599", "label": "F.케언크로스 『거리의 소멸디지털혁명』, A.기든스 『질주하는 세계』", "type": "essay", "year": "2000", "degree": 5}, {"id": "cb2664", "label": "3cm의 사회학", "type": "essay", "year": "2001", "degree": 2}, {"id": "cb7059", "label": "‘살다’의 세가지 변주곡", "type": "essay", "year": "2024", "degree": 7}, {"id": "p-anthony-giddens", "label": "앤서니 기든스", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q220008 http://lod.nl.go.kr/resource/KAC199610027 https://isni.org/isni/0000000121468356 http://viaf.org/viaf/108178108", "degree": 3, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199610027", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q220008", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-bakhtin", "label": "바흐친", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q185375 http://lod.nl.go.kr/resource/KAC199601442 https://isni.org/isni/0000000121029425 http://viaf.org/viaf/88958796", "degree": 43, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199601442", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q185375", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Mikhail Bakhtin"}, {"id": "p-frances-cairncross", "label": "프랜시스 케언크로스", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q5478559 http://lod.nl.go.kr/resource/KAC201907255 https://isni.org/isni/000000011628216X http://viaf.org/viaf/41901237", "degree": 1, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201907255", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q5478559", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-gim-juhwan", "label": "김주환", "type": "critic", "ref": "http://lod.nl.go.kr/resource/KAC201220727 https://isni.org/isni/0000000464578055 http://viaf.org/viaf/162152138638010982781", "degree": 3, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201220727", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}, {"id": "p-umberto-eco", "label": "움베르토 에코", "type": "writer", "ref": "", "degree": 13, "lod": [], "en": ""}], "edges": [{"source": "cb2664", "target": "p-gim-juhwan", "type": "uses_theory", "weight": 1}, {"source": "cb7059", "target": "p-gim-juhwan", "type": "uses_theory", "weight": 1}, {"source": "p-gim-juhwan", "target": "cb2599", "type": "wrote", "weight": 1}, {"source": "cb2599", "target": "p-anthony-giddens", "type": "uses_theory", "weight": 1}, {"source": "cb2599", "target": "p-bakhtin", "type": "uses_theory", "weight": 1}, {"source": "cb2599", "target": "p-frances-cairncross", "type": "uses_theory", "weight": 1}, {"source": "cb2599", "target": "p-umberto-eco", "type": "subject_of", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
    <section class="essay-grid">
      <h2 class="section-label">수록 비평글 (1편)</h2>
      
      <article class="essay-card">

          <span class="essay-card-year">2000</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb2599.html">F.케언크로스 『거리의 소멸디지털혁명』, A.기든스 『질주하는 세계』</a>
        </h3>
        <p class="essay-card-source">창작과비평 109호, 창비, 2000</p>
        <div class="essay-card-tags"><span class="tag">움베르토 에코</span><span class="tag">앤서니 기든스</span> <span class="tag">바흐친</span> <span class="tag">프랜시스 케언크로스</span></div>
      </article>
    </section>
  </main>

</body>
</html>
