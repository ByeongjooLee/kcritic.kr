    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb2560", "label": "새로운 연대를 위한 비평의 열정", "type": "essay", "year": "2000", "degree": 5}, {"id": "cb2659", "label": "새로운 출발점에 선 민족문학론", "type": "essay", "year": "2001", "degree": 2}, {"id": "cb3076", "label": "우리 시대의 사랑‧성‧환경 이야기", "type": "essay", "year": "2003", "degree": 8}, {"id": "cb3407", "label": "87년 이후의 민족문학론", "type": "essay", "year": "2005", "degree": 11}, {"id": "cb3549", "label": "흔들리는 민족문학", "type": "essay", "year": "2006", "degree": 8}, {"id": "cb3565", "label": "소설가의 책상, 에쎄이스트의 책상", "type": "essay", "year": "2004", "degree": 5}, {"id": "cb3568", "label": "공선옥 문학은 어느만큼 와 있는가", "type": "essay", "year": "2004", "degree": 4}, {"id": "cb3622", "label": "통일시대를 위하여", "type": "essay", "year": "2006", "degree": 11}, {"id": "p-00152", "label": "마르크스", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q9061 http://lod.nl.go.kr/resource/KAC199617910 https://isni.org/isni/0000000122796570 http://viaf.org/viaf/49228757", "degree": 90, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199617910", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q9061", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Karl Marx"}, {"id": "p-bang-hyeonseok", "label": "방현석", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q12597600 http://lod.nl.go.kr/resource/KAC201010904 https://isni.org/isni/0000000382944736 http://viaf.org/viaf/266848280", "degree": 11, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201010904", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q12597600", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-cha-wonhyeon", "label": "차원현", "type": "theorist", "ref": "http://lod.nl.go.kr/resource/KAC201232433 https://isni.org/isni/0000000047488067 http://viaf.org/viaf/73642496", "degree": 2, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201232433", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}, {"id": "p-gim-hakyeong", "label": "김학영", "type": "writer", "ref": "", "degree": 1, "lod": [], "en": ""}, {"id": "p-gim-myeonghwan", "label": "김명환", "type": "critic", "ref": "", "degree": 10, "lod": [], "en": ""}, {"id": "p-sin-seungyeop", "label": "신승엽", "type": "critic", "ref": "", "degree": 9, "lod": [], "en": ""}, {"id": "p-yi-hoeseong", "label": "이회성", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q904489 http://lod.nl.go.kr/resource/KAC199640769 https://isni.org/isni/0000000082631535 http://viaf.org/viaf/72707887", "degree": 2, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199640769", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q904489", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-yu-jaehyeon", "label": "유재현", "type": "critic", "ref": "", "degree": 3, "lod": [], "en": ""}, {"id": "sin-seungyeop_ideology-real-basis_1990", "label": "이념과 현실적 토대의 굳건한 결합으로", "type": "essay", "year": "1990", "degree": 1}], "edges": [{"source": "cb2560", "target": "p-sin-seungyeop", "type": "uses_theory", "weight": 1}, {"source": "cb2659", "target": "p-sin-seungyeop", "type": "uses_theory", "weight": 1}, {"source": "cb3076", "target": "p-sin-seungyeop", "type": "uses_theory", "weight": 1}, {"source": "cb3407", "target": "p-sin-seungyeop", "type": "uses_theory", "weight": 1}, {"source": "cb3565", "target": "p-sin-seungyeop", "type": "uses_theory", "weight": 1}, {"source": "cb3568", "target": "p-sin-seungyeop", "type": "uses_theory", "weight": 1}, {"source": "cb3622", "target": "p-sin-seungyeop", "type": "uses_theory", "weight": 1}, {"source": "p-sin-seungyeop", "target": "cb3549", "type": "wrote", "weight": 1}, {"source": "p-sin-seungyeop", "target": "sin-seungyeop_ideology-real-basis_1990", "type": "wrote", "weight": 1}, {"source": "cb3549", "target": "p-00152", "type": "uses_theory", "weight": 1}, {"source": "cb3549", "target": "p-bang-hyeonseok", "type": "subject_of", "weight": 1}, {"source": "cb3549", "target": "p-cha-wonhyeon", "type": "uses_theory", "weight": 1}, {"source": "cb3549", "target": "p-gim-hakyeong", "type": "subject_of", "weight": 1}, {"source": "cb3549", "target": "p-gim-myeonghwan", "type": "uses_theory", "weight": 1}, {"source": "cb3549", "target": "p-yi-hoeseong", "type": "subject_of", "weight": 1}, {"source": "cb3549", "target": "p-yu-jaehyeon", "type": "subject_of", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
