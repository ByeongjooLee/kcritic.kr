<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이향규 — 한국 비평사 온톨로지</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="/kc-shell.css">
</head>
<body>

  <main class="container index-main">
    <section class="critic-profile-hero">
      <div class="critic-profile-byline"><span class="chip role-critic">이향규</span></div>
      <h1 class="index-heading">이향규</h1>
      
      <div class="stat-row">
        <div class="stat"><span class="stat-num">3</span><span class="stat-label">수록 비평글</span></div>
        <div class="stat"><span class="stat-num">5</span><span class="stat-label">비평 대상 작가</span></div>
        <div class="stat"><span class="stat-num">0</span><span class="stat-label">활용 이론가</span></div>
      </div>
    </section>

    <section class="critic-profile-meta">
      <div class="meta-section">
        <h2 class="meta-label">주요 비평 대상</h2>
        <div class="chip-group"><span class="chip role-writer">정현종</span> <span class="chip role-writer">윤동주</span> <span class="chip role-writer">박희순</span> <span class="chip role-writer">한강</span> <span class="chip role-writer">나태주</span></div>
      </div>
      <div class="meta-section">
        <h2 class="meta-label">자주 활용한 이론가</h2>
        <div class="chip-group"><span class="muted">—</span></div>
      </div>
    </section>
    
    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb5243", "label": "‘탈북자’를 넘어서", "type": "essay", "year": "2016", "degree": 3}, {"id": "cb5581", "label": "코끼리를 이야기할 시간", "type": "essay", "year": "2018", "degree": 1}, {"id": "cb5740", "label": "고향은 부칸입니다", "type": "essay", "year": "2019", "degree": 4}, {"id": "p-00091", "label": "정현종", "type": "critic", "ref": "https://www.wikidata.org/wiki/Q12616152 http://lod.nl.go.kr/resource/KAC201207472 https://isni.org/isni/0000000083942968 http://viaf.org/viaf/74032003", "degree": 65, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201207472", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q12616152", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-00247", "label": "윤동주", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q625089 https://encykorea.aks.ac.kr/Article/E0042294 http://lod.nl.go.kr/resource/KAC201110203 https://isni.org/isni/0000000081384480 http://viaf.org/viaf/59228311", "degree": 36, "lod": [{"href": "https://encykorea.aks.ac.kr/Article/E0042294", "label": "한", "full": "한국민족문화대백과", "bg": "#e8f0e8", "fg": "#2a5a2a"}, {"href": "http://lod.nl.go.kr/resource/KAC201110203", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q625089", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-bak-huisun", "label": "박희순", "type": "writer", "ref": "", "degree": 1, "lod": [], "en": ""}, {"id": "p-han-gang", "label": "한강", "type": "writer", "ref": "", "degree": 20, "lod": [], "en": ""}, {"id": "p-i-hyanggyu", "label": "이향규", "type": "critic", "ref": "", "degree": 3, "lod": [], "en": ""}, {"id": "p-na-taeju", "label": "나태주", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q21575842 http://lod.nl.go.kr/resource/KAC201110471 https://isni.org/isni/0000000082708731 http://viaf.org/viaf/77634481", "degree": 1, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201110471", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q21575842", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}], "edges": [{"source": "p-i-hyanggyu", "target": "cb5243", "type": "wrote", "weight": 1}, {"source": "p-i-hyanggyu", "target": "cb5581", "type": "wrote", "weight": 1}, {"source": "p-i-hyanggyu", "target": "cb5740", "type": "wrote", "weight": 1}, {"source": "cb5243", "target": "p-00091", "type": "subject_of", "weight": 1}, {"source": "cb5243", "target": "p-han-gang", "type": "subject_of", "weight": 1}, {"source": "cb5740", "target": "p-00247", "type": "subject_of", "weight": 1}, {"source": "cb5740", "target": "p-bak-huisun", "type": "subject_of", "weight": 1}, {"source": "cb5740", "target": "p-na-taeju", "type": "subject_of", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
    <section class="essay-grid">
      <h2 class="section-label">수록 비평글 (3편)</h2>
      
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2016</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb5243.html">‘탈북자’를 넘어서</a>
        </h3>
        <p class="essay-card-source">창작과비평 174호, 창비, 2016</p>
        <div class="essay-card-tags"><span class="tag">정현종</span> <span class="tag">한강</span></div>
      </article>
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2018</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb5581.html">코끼리를 이야기할 시간</a>
        </h3>
        <p class="essay-card-source">창작과비평 180호, 창비, 2018</p>
        <div class="essay-card-tags"></div>
      </article>
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2019</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb5740.html">고향은 부칸입니다</a>
        </h3>
        <p class="essay-card-source">창작과비평 184호, 창비, 2019</p>
        <div class="essay-card-tags"><span class="tag">윤동주</span> <span class="tag">박희순</span> <span class="tag">나태주</span></div>
      </article>
    </section>
  </main>

  <script src="/kc-shell.js"></script>
</body>
</html>
