    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>

37", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q9358", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Friedrich Nietzsche"}, {"id": "p-00186", "label": "릴케", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q76483 http://lod.nl.go.kr/resource/KAC199623067 https://isni.org/isni/0000000121312247 http://viaf.org/viaf/46897170", "degree": 30, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199623067", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q76483", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Rainer Maria Rilke"}, {"id": "p-bakhtin", "label": "바흐친", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q185375 http://lod.nl.go.kr/resource/KAC199601442 https://isni.org/isni/0000000121029425 http://viaf.org/viaf/88958796", "degree": 34, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199601442", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q185375", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Mikhail Bakhtin"}, {"id": "p-g-bachelard", "label": "바슐라르", "type": "theorist", "ref": "", "degree": 3, "lod": [], "en": ""}, {"id": "p-shin-dongyeop", "label": "신동엽", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q12604190 http://lod.nl.go.kr/resource/KAC201106395 https://isni.org/isni/0000000384316119 http://viaf.org/viaf/275063697", "degree": 19, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201106395", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q12604190", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-son-taeksu", "label": "손택수", "type": "critic", "ref": "", "degree": 6, "lod": [], "en": ""}], "edges": [{"source": "cb3084", "target": "p-son-taeksu", "type": "subject_of", "weight": 1}, {"source": "cb3130", "target": "p-son-taeksu", "type": "subject_of", "weight": 1}, {"source": "cb3318", "target": "p-son-taeksu", "type": "subject_of", "weight": 1}, {"source": "cb4279", "target": "p-son-taeksu", "type": "subject_of", "weight": 1}, {"source": "cb7240", "target": "p-son-taeksu", "type": "subject_of", "weight": 1}, {"source": "p-son-taeksu", "target": "cb3280", "type": "wrote", "weight": 1}, {"source": "cb3280", "target": "p-00032", "type": "subject_of", "weight": 1}, {"source": "cb3280", "target": "p-00059", "type": "subject_of", "weight": 1}, {"source": "cb3280", "target": "p-00161", "type": "uses_theory", "weight": 1}, {"source": "cb3280", "target": "p-00186", "type": "uses_theory", "weight": 1}, {"source": "cb3280", "target": "p-bakhtin", "type": "uses_theory", "weight": 1}, {"source": "cb3280", "target": "p-g-bachelard", "type": "uses_theory", "weight": 1}, {"source": "cb3280", "target": "p-shin-dongyeop", "type": "subject_of", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>

        <p class="essay-card-source">창작과비평 127호, 창비, 2005</p>

      </article>
