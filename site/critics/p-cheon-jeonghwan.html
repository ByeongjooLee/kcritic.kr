      <div class="meta-section">

    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb3134", "label": "대중의 눈을 통한 ‘근대’의 재발견", "type": "essay", "year": "2004", "degree": 7}, {"id": "cb3523", "label": "정희진 『페미니즘의 도전』", "type": "essay", "year": "2006", "degree": 2}, {"id": "cb3756", "label": "세계문학 수용에 관한 몇가지 단상", "type": "essay", "year": "2007", "degree": 9}, {"id": "cb4201", "label": "고병권 외 『리영희 프리즘』", "type": "essay", "year": "2010", "degree": 4}, {"id": "cb5141", "label": "프랭크 도너휴 『최후의 교수들』", "type": "essay", "year": "2015", "degree": 3}, {"id": "cb5186", "label": "‘가능한 미래’를 성찰하는 문학", "type": "essay", "year": "2015", "degree": 9}, {"id": "cb5747", "label": "윤지관 『위기의 대학을 넘어서』", "type": "essay", "year": "2019", "degree": 3}, {"id": "kim-dongsik_archaeology-korean-literary-modernity_2004", "label": "한국 문학의 근대성에 대한 고고학적 탐색", "type": "essay", "year": "2004", "degree": 11}, {"id": "p-bak-geunhye", "label": "박근혜", "type": "theorist", "ref": "", "degree": 41, "lod": [], "en": ""}, {"id": "p-cheon-jeonghwan", "label": "천정환", "type": "critic", "ref": "http://lod.nl.go.kr/resource/KAC201232410 https://isni.org/isni/0000000464357607 http://viaf.org/viaf/50152138539010981568", "degree": 8, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201232410", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}], "en": ""}, {"id": "p-frank-donoghue", "label": "프랭크 도너휴", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q112491334 http://lod.nl.go.kr/resource/KAC201428644 https://isni.org/isni/0000000055128811 http://viaf.org/viaf/74003093", "degree": 1, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201428644", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q112491334", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-jeong-huijin", "label": "정희진", "type": "critic", "ref": "https://www.wikidata.org/wiki/Q18880801 http://lod.nl.go.kr/resource/KAC201304957 https://isni.org/isni/0000000467727319 http://viaf.org/viaf/100145375897083680354", "degree": 9, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201304957", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q18880801", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}], "edges": [{"source": "cb3134", "target": "p-cheon-jeonghwan", "type": "uses_theory", "weight": 1}, {"source": "cb3756", "target": "p-cheon-jeonghwan", "type": "uses_theory", "weight": 1}, {"source": "cb4201", "target": "p-cheon-jeonghwan", "type": "uses_theory", "weight": 1}, {"source": "cb5186", "target": "p-cheon-jeonghwan", "type": "uses_theory", "weight": 1}, {"source": "cb5747", "target": "p-cheon-jeonghwan", "type": "uses_theory", "weight": 1}, {"source": "kim-dongsik_archaeology-korean-literary-modernity_2004", "target": "p-cheon-jeonghwan", "type": "uses_theory", "weight": 1}, {"source": "p-cheon-jeonghwan", "target": "cb3523", "type": "wrote", "weight": 1}, {"source": "p-cheon-jeonghwan", "target": "cb5141", "type": "wrote", "weight": 1}, {"source": "cb3523", "target": "p-jeong-huijin", "type": "uses_theory", "weight": 1}, {"source": "cb5141", "target": "p-bak-geunhye", "type": "uses_theory", "weight": 1}, {"source": "cb5141", "target": "p-frank-donoghue", "type": "uses_theory", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
    <section class="essay-grid">
      <h2 class="section-label">수록 비평글 (2편)</h2>

        <p class="essay-card-source">창작과비평 132호, 창비, 2006</p>
        <div class="essay-card-tags"><span class="tag">정희진</span></div>
      </article>
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2015</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb5141.html">프랭크 도너휴 『최후의 교수들』</a>

        <div class="essay-card-tags"><span class="tag">박근혜</span> <span class="tag">프랭크 도너휴</span></div>
