    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb4122", "label": "이명박시대, 민주적 법치와 도덕성의 위기", "type": "essay", "year": "2010", "degree": 6}, {"id": "cb4790", "label": "분단체제와 87년체제의 교차로에서", "type": "essay", "year": "2013", "degree": 7}, {"id": "cb4933", "label": "‘사회를 말하는 사회’와 분단체제론", "type": "essay", "year": "2014", "degree": 9}, {"id": "cb4934", "label": "불확실한 삶에서 움트는 신군사주의", "type": "essay", "year": "2014", "degree": 8}, {"id": "cb5067", "label": "게일 루빈 『일탈』", "type": "essay", "year": "2016", "degree": 3}, {"id": "cb5485", "label": "커먼즈와 새로운 체제: 대안을 찾아서", "type": "essay", "year": "2017", "degree": 6}, {"id": "cb5487", "label": "위기 속의 비평과 시의 미학적 윤리", "type": "essay", "year": "2017", "degree": 12}, {"id": "cb5549", "label": "소수자 인권과 한국사회 시민권의 재구성", "type": "essay", "year": "2016", "degree": 3}, {"id": "cb5571", "label": "문학성과 커먼즈", "type": "essay", "year": "2018", "degree": 7}, {"id": "p-foucault", "label": "미셸 푸코", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q44272 http://lod.nl.go.kr/resource/KAC199609116 https://isni.org/isni/000000012146278X http://viaf.org/viaf/104722665", "degree": 75, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199609116", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q44272", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Michel Foucault"}, {"id": "p-geil-rubin", "label": "게일 루빈", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q444593 http://lod.nl.go.kr/resource/KAC201519227 https://isni.org/isni/0000000002994441 http://viaf.org/viaf/19898616", "degree": 3, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201519227", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q444593", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-seo-dongjin", "label": "서동진", "type": "critic", "ref": "https://www.wikidata.org/wiki/Q21058405 http://lod.nl.go.kr/resource/KAC201229649 https://isni.org/isni/0000000464450967 http://viaf.org/viaf/51145375901683681622", "degree": 9, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201229649", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q21058405", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}], "edges": [{"source": "cb4122", "target": "p-seo-dongjin", "type": "uses_theory", "weight": 1}, {"source": "cb4790", "target": "p-seo-dongjin", "type": "uses_theory", "weight": 1}, {"source": "cb4933", "target": "p-seo-dongjin", "type": "uses_theory", "weight": 1}, {"source": "cb4934", "target": "p-seo-dongjin", "type": "uses_theory", "weight": 1}, {"source": "cb5485", "target": "p-seo-dongjin", "type": "uses_theory", "weight": 1}, {"source": "cb5487", "target": "p-seo-dongjin", "type": "uses_theory", "weight": 1}, {"source": "cb5549", "target": "p-seo-dongjin", "type": "uses_theory", "weight": 1}, {"source": "cb5571", "target": "p-seo-dongjin", "type": "uses_theory", "weight": 1}, {"source": "p-seo-dongjin", "target": "cb5067", "type": "wrote", "weight": 1}, {"source": "cb5067", "target": "p-foucault", "type": "uses_theory", "weight": 1}, {"source": "cb5067", "target": "p-geil-rubin", "type": "uses_theory", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
