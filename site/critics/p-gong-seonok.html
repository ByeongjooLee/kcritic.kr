<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공선옥 — 한국 비평사 온톨로지</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="/kc-shell.css">
</head>
<body>

  <main class="container index-main">
    <section class="critic-profile-hero">
      <div class="critic-profile-byline"><span class="chip role-critic">공선옥</span></div>
      <h1 class="index-heading">공선옥</h1>
      
      <div class="stat-row">
        <div class="stat"><span class="stat-num">1</span><span class="stat-label">수록 비평글</span></div>
        <div class="stat"><span class="stat-num">0</span><span class="stat-label">비평 대상 작가</span></div>
        <div class="stat"><span class="stat-num">0</span><span class="stat-label">활용 이론가</span></div>
      </div>
    </section>

    <section class="critic-profile-meta">
      <div class="meta-section">
        <h2 class="meta-label">주요 비평 대상</h2>
        <div class="chip-group"><span class="muted">—</span></div>
      </div>
      <div class="meta-section">
        <h2 class="meta-label">자주 활용한 이론가</h2>
        <div class="chip-group"><span class="muted">—</span></div>
      </div>
    </section>
    
    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb3076", "label": "우리 시대의 사랑‧성‧환경 이야기", "type": "essay", "year": "2003", "degree": 8}, {"id": "cb3407", "label": "87년 이후의 민족문학론", "type": "essay", "year": "2005", "degree": 10}, {"id": "cb3435", "label": "성장서사와 균열의 상상력", "type": "essay", "year": "2005", "degree": 6}, {"id": "cb3568", "label": "공선옥 문학은 어느만큼 와 있는가", "type": "essay", "year": "2004", "degree": 4}, {"id": "cb3921", "label": "문학의 새로움은 어디서 오는가", "type": "essay", "year": "2008", "degree": 13}, {"id": "cb4078", "label": "타자의 인식과 공공성의 성찰", "type": "essay", "year": "2009", "degree": 7}, {"id": "cb4172", "label": "소설의 정치성, 몇가지 풍경들", "type": "essay", "year": "2010", "degree": 8}, {"id": "cb4894", "label": "그 시린 진리를 찬물처럼", "type": "essay", "year": "2014", "degree": 8}, {"id": "cb5964", "label": "생명, 노동, 돌봄의 문학", "type": "essay", "year": "2020", "degree": 12}, {"id": "cb6104", "label": "공선옥 『춥고 더운 우리 집』", "type": "essay", "year": "2021", "degree": 2}, {"id": "cb6958", "label": "담양산보(潭陽散步)(내가 사는 곳 ⑨)", "type": "essay", "year": "2024", "degree": 1}, {"id": "p-gong-seonok", "label": "공선옥", "type": "critic", "ref": "", "degree": 13, "lod": [], "en": ""}, {"id": "sim-jingyeong_90s-literature-three-gazes_2004", "label": "역사, 육체, 욕망 — ‘90년대 문학’을 따라가는 세 개의 시선", "type": "essay", "year": "2004", "degree": 18}, {"id": "woo-chanje_korean-novel-pain-enjoyment_1999", "label": "한국 소설의 고통과 향유", "type": "essay", "year": "1999", "degree": 94}], "edges": [{"source": "cb3076", "target": "p-gong-seonok", "type": "subject_of", "weight": 1}, {"source": "cb3407", "target": "p-gong-seonok", "type": "subject_of", "weight": 1}, {"source": "cb3435", "target": "p-gong-seonok", "type": "subject_of", "weight": 1}, {"source": "cb3568", "target": "p-gong-seonok", "type": "subject_of", "weight": 1}, {"source": "cb3921", "target": "p-gong-seonok", "type": "subject_of", "weight": 1}, {"source": "cb4078", "target": "p-gong-seonok", "type": "subject_of", "weight": 1}, {"source": "cb4172", "target": "p-gong-seonok", "type": "subject_of", "weight": 1}, {"source": "cb4894", "target": "p-gong-seonok", "type": "subject_of", "weight": 1}, {"source": "cb5964", "target": "p-gong-seonok", "type": "subject_of", "weight": 1}, {"source": "cb6104", "target": "p-gong-seonok", "type": "subject_of", "weight": 1}, {"source": "p-gong-seonok", "target": "cb6958", "type": "wrote", "weight": 1}, {"source": "sim-jingyeong_90s-literature-three-gazes_2004", "target": "p-gong-seonok", "type": "subject_of", "weight": 1}, {"source": "woo-chanje_korean-novel-pain-enjoyment_1999", "target": "p-gong-seonok", "type": "subject_of", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
    <section class="essay-grid">
      <h2 class="section-label">수록 비평글 (1편)</h2>
      
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2024</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb6958.html">담양산보(潭陽散步)(내가 사는 곳 ⑨)</a>
        </h3>
        <p class="essay-card-source">창작과비평 203호, 창비, 2024</p>
        <div class="essay-card-tags"></div>
      </article>
    </section>
  </main>

  <script src="/kc-shell.js"></script>
</body>
</html>
