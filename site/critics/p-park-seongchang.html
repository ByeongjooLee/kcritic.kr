    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "p-00017", "label": "발자크", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q9711 http://lod.nl.go.kr/resource/KAC199601509 https://isni.org/isni/0000000123478072 http://viaf.org/viaf/29529595", "degree": 24, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199601509", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q9711", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Honoré de Balzac"}, {"id": "p-00059", "label": "괴테", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q5879 http://lod.nl.go.kr/resource/KAC199610270 https://isni.org/isni/0000000120999104 http://viaf.org/viaf/24602065", "degree": 31, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199610270", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q5879", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Johann Wolfgang von Goethe"}, {"id": "p-barthes", "label": "롤랑 바르트", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q179109 http://lod.nl.go.kr/resource/KAC199601746 https://isni.org/isni/0000000121009643 http://viaf.org/viaf/44295060", "degree": 24, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199601746", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q179109", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Roland Barthes"}, {"id": "p-derrida", "label": "데리다", "type": "theorist", "ref": "", "degree": 15, "lod": [], "en": ""}, {"id": "p-eagleton", "label": "테리 이글턴", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q315349 http://lod.nl.go.kr/resource/KAC199607728 https://isni.org/isni/0000000121394035 http://viaf.org/viaf/73874087", "degree": 6, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199607728", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q315349", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Terry Eagleton"}, {"id": "p-jameson", "label": "프레드릭 제임슨", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q347362 http://lod.nl.go.kr/resource/KAC199613727 https://isni.org/isni/0000000121468591 http://viaf.org/viaf/108213141", "degree": 9, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199613727", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q347362", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Fredric Jameson"}, {"id": "p-park-seongchang", "label": "박성창", "type": "critic", "ref": "", "degree": 1, "lod": [], "en": ""}, {"id": "p-rousset", "label": "루세", "type": "theorist", "ref": "", "degree": 1, "lod": [], "en": ""}, {"id": "p-saussure", "label": "소쉬르", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q13230 http://lod.nl.go.kr/resource/KAC199624171 https://isni.org/isni/0000000122831460 http://viaf.org/viaf/95158205", "degree": 6, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199624171", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q13230", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Ferdinand de Saussure"}, {"id": "park-seongchang_text-structure-and-deconstruction_1992", "label": "문학 텍스트의 구조와 탈구조 — 바르트와 데리다를 중심으로", "type": "essay", "year": "1992", "degree": 9}], "edges": [{"source": "p-park-seongchang", "target": "park-seongchang_text-structure-and-deconstruction_1992", "type": "wrote", "weight": 1}, {"source": "park-seongchang_text-structure-and-deconstruction_1992", "target": "p-00017", "type": "subject_of", "weight": 1}, {"source": "park-seongchang_text-structure-and-deconstruction_1992", "target": "p-00059", "type": "subject_of", "weight": 1}, {"source": "park-seongchang_text-structure-and-deconstruction_1992", "target": "p-barthes", "type": "uses_theory", "weight": 1}, {"source": "park-seongchang_text-structure-and-deconstruction_1992", "target": "p-derrida", "type": "uses_theory", "weight": 1}, {"source": "park-seongchang_text-structure-and-deconstruction_1992", "target": "p-eagleton", "type": "uses_theory", "weight": 1}, {"source": "park-seongchang_text-structure-and-deconstruction_1992", "target": "p-jameson", "type": "uses_theory", "weight": 1}, {"source": "park-seongchang_text-structure-and-deconstruction_1992", "target": "p-rousset", "type": "uses_theory", "weight": 1}, {"source": "park-seongchang_text-structure-and-deconstruction_1992", "target": "p-saussure", "type": "uses_theory", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>

      </article>
