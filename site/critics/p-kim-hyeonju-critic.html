        <div class="chip-group"><span class="chip role-writer">최인훈</span> <span class="chip role-writer">김수영</span></div>
      </div>

        <div class="chip-group"><span class="chip chip-term">헤겔 (1)</span> <span class="chip chip-term">라캉 (1)</span> <span class="chip chip-term">최준호 (1)</span> <span class="chip chip-term">김유미 (1)</span></div>
      </div>

    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "kim-hyeonju_choi-inhun-studies-symposium_2001", "label": "새롭게 시작하는 ‘최인훈학(學)’", "type": "essay", "year": "2001", "degree": 7}, {"id": "kim-seongyeon_modern-sympathy_2003", "label": "“우리의 동정을 시험하라” — 근대적 ‘동정’의 본류(本流)를 찾아서", "type": "essay", "year": "2003", "degree": 18}, {"id": "p-00033", "label": "최인훈", "type": "critic", "ref": "https://www.wikidata.org/wiki/Q11274314 http://lod.nl.go.kr/resource/KAC201108593 https://isni.org/isni/0000000116984436 http://viaf.org/viaf/110167855", "degree": 60, "lod": [{"href": "https://encykorea.aks.ac.kr/Article/E0005204", "label": "한(작품)", "full": "한국민족문화대백과 (작품)", "bg": "#f0ede8", "fg": "#5a3a2a"}, {"href": "http://lod.nl.go.kr/resource/KAC201108593", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q11274314", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-00065", "label": "헤겔", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q9235 http://lod.nl.go.kr/resource/KAC199611965 https://isni.org/isni/0000000122828149 http://viaf.org/viaf/89774942", "degree": 90, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199611965", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q9235", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Georg Wilhelm Friedrich Hegel"}, {"id": "p-00116", "label": "김수영", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q4556301 https://encykorea.aks.ac.kr/Article/E0009567 http://lod.nl.go.kr/resource/KAC200207959 https://isni.org/isni/0000000083779451 http://viaf.org/viaf/44471306", "degree": 81, "lod": [{"href": "https://encykorea.aks.ac.kr/Article/E0009567", "label": "한", "full": "한국민족문화대백과", "bg": "#e8f0e8", "fg": "#2a5a2a"}, {"href": "http://lod.nl.go.kr/resource/KAC200207959", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q4556301", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-00125", "label": "자크 라캉", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q169906 http://lod.nl.go.kr/resource/KAC200800551 https://isni.org/isni/0000000121280361 http://viaf.org/viaf/36920510", "degree": 44, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC200800551", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q169906", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Jacques Lacan"}, {"id": "p-choe-junho", "label": "최준호", "type": "theorist", "ref": "", "degree": 1, "lod": [], "en": ""}, {"id": "p-kim-hyeonju-critic", "label": "김현주", "type": "critic", "ref": "", "degree": 2, "lod": [], "en": ""}, {"id": "p-kim-yumi", "label": "김유미", "type": "theorist", "ref": "", "degree": 1, "lod": [], "en": ""}], "edges": [{"source": "kim-seongyeon_modern-sympathy_2003", "target": "p-kim-hyeonju-critic", "type": "uses_theory", "weight": 1}, {"source": "p-kim-hyeonju-critic", "target": "kim-hyeonju_choi-inhun-studies-symposium_2001", "type": "wrote", "weight": 1}, {"source": "kim-hyeonju_choi-inhun-studies-symposium_2001", "target": "p-00033", "type": "subject_of", "weight": 1}, {"source": "kim-hyeonju_choi-inhun-studies-symposium_2001", "target": "p-00065", "type": "uses_theory", "weight": 1}, {"source": "kim-hyeonju_choi-inhun-studies-symposium_2001", "target": "p-00116", "type": "subject_of", "weight": 1}, {"source": "kim-hyeonju_choi-inhun-studies-symposium_2001", "target": "p-00125", "type": "uses_theory", "weight": 1}, {"source": "kim-hyeonju_choi-inhun-studies-symposium_2001", "target": "p-choe-junho", "type": "uses_theory", "weight": 1}, {"source": "kim-hyeonju_choi-inhun-studies-symposium_2001", "target": "p-kim-yumi", "type": "uses_theory", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
    <section class="essay-grid">
      <h2 class="section-label">수록 비평글 (1편)</h2>
      
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2001</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/kim-hyeonju_choi-inhun-studies-symposium_2001.html">새롭게 시작하는 ‘최인훈학(學)’</a>
        </h3>
        <p class="essay-card-source">문학과사회 54호, 문학과지성사, 2001</p>
        <div class="essay-card-tags"><span class="tag">최인훈</span> <span class="tag">김수영</span><span class="tag">헤겔</span> <span class="tag">라캉</span> <span class="tag">최준호</span> <span class="tag">김유미</span></div>
      </article>
    </section>
  </main>

</body>
</html>
