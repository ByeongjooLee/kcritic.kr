<!DOCTYPE html>
<html lang="ko">
<head>

  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="/kc-shell.css">
</head>
<body>

  <main class="container index-main">
    <section class="critic-profile-hero">
      <div class="critic-profile-byline"><span class="chip role-critic">김진수</span></div>
      <h1 class="index-heading">김진수</h1>
      
      <div class="stat-row">
        <div class="stat"><span class="stat-num">1</span><span class="stat-label">수록 비평글</span></div>
        <div class="stat"><span class="stat-num">1</span><span class="stat-label">비평 대상 작가</span></div>
        <div class="stat"><span class="stat-num">6</span><span class="stat-label">활용 이론가</span></div>
      </div>
    </section>

    <section class="critic-profile-meta">
      <div class="meta-section">
        <h2 class="meta-label">주요 비평 대상</h2>
        <div class="chip-group"><span class="chip role-writer">박상륭</span></div>
      </div>
      <div class="meta-section">
        <h2 class="meta-label">자주 활용한 이론가</h2>
        <div class="chip-group"><span class="chip chip-term">프레이저 (1)</span> <span class="chip chip-term">니체 (1)</span> <span class="chip chip-term">프라이 (1)</span> <span class="chip chip-term">융 (1)</span> <span class="chip chip-term">셸링 (1)</span> <span class="chip chip-term">베베르 (1)</span></div>
      </div>
    </section>
    
    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "kim-jinsu_mythic-structure-of-death_1990", "label": "죽음의 신화적 구조 — 박상륭의 『죽음의 한 연구』", "type": "essay", "year": "1990", "degree": 8}, {"id": "p-00050", "label": "프레이저", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q151936 http://lod.nl.go.kr/resource/KAC199609247 https://isni.org/isni/0000000081107600 http://viaf.org/viaf/31996454", "degree": 2, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199609247", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q151936", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "James George Frazer"}, {"id": "p-00161", "label": "니체", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q9358 http://lod.nl.go.kr/resource/KAC199620237 https://isni.org/isni/0000000122828181 http://viaf.org/viaf/89798474", "degree": 31, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199620237", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q9358", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Friedrich Nietzsche"}, {"id": "p-frye", "label": "노스럽 프라이", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q354256 http://lod.nl.go.kr/resource/KAC199609447 https://isni.org/isni/0000000121318761 http://viaf.org/viaf/49236705", "degree": 2, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199609447", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q354256", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Northrop Frye"}, {"id": "p-jung", "label": "융", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q41532 http://lod.nl.go.kr/resource/KAC199614276 https://isni.org/isni/0000000426604224 http://viaf.org/viaf/88819182", "degree": 9, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC199614276", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q41532", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": "Carl Jung"}, {"id": "p-kim-jinsu", "label": "김진수", "type": "critic", "ref": "", "degree": 1, "lod": [], "en": ""}, {"id": "p-park-sangryung", "label": "박상륭", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q7137999 http://lod.nl.go.kr/resource/KAC201008927 https://isni.org/isni/0000000024628434 http://viaf.org/viaf/28396953", "degree": 7, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201008927", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q7137999", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-schelling", "label": "셸링", "type": "theorist", "ref": "", "degree": 1, "lod": [], "en": ""}, {"id": "p-weber", "label": "베베르", "type": "theorist", "ref": "", "degree": 2, "lod": [], "en": ""}], "edges": [{"source": "p-kim-jinsu", "target": "kim-jinsu_mythic-structure-of-death_1990", "type": "wrote", "weight": 1}, {"source": "kim-jinsu_mythic-structure-of-death_1990", "target": "p-00050", "type": "uses_theory", "weight": 1}, {"source": "kim-jinsu_mythic-structure-of-death_1990", "target": "p-00161", "type": "uses_theory", "weight": 1}, {"source": "kim-jinsu_mythic-structure-of-death_1990", "target": "p-frye", "type": "uses_theory", "weight": 1}, {"source": "kim-jinsu_mythic-structure-of-death_1990", "target": "p-jung", "type": "uses_theory", "weight": 1}, {"source": "kim-jinsu_mythic-structure-of-death_1990", "target": "p-park-sangryung", "type": "subject_of", "weight": 1}, {"source": "kim-jinsu_mythic-structure-of-death_1990", "target": "p-schelling", "type": "uses_theory", "weight": 1}, {"source": "kim-jinsu_mythic-structure-of-death_1990", "target": "p-weber", "type": "uses_theory", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
    <section class="essay-grid">
      <h2 class="section-label">수록 비평글 (1편)</h2>
      
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">1990</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/kim-jinsu_mythic-structure-of-death_1990.html">죽음의 신화적 구조 — 박상륭의 『죽음의 한 연구』</a>
        </h3>
        <p class="essay-card-source">문학과사회 12호, 문학과지성사, 1990</p>
        <div class="essay-card-tags"><span class="tag">박상륭</span><span class="tag">프레이저</span> <span class="tag">니체</span> <span class="tag">프라이</span> <span class="tag">융</span> <span class="tag">셸링</span> <span class="tag">베베르</span></div>
      </article>
    </section>
  </main>

  <script src="/kc-shell.js"></script>
</body>
</html>
