<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>정은정 — 한국 비평사 온톨로지</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="/kc-shell.css">
</head>
<body>

  <main class="container index-main">
    <section class="critic-profile-hero">
      <div class="critic-profile-byline"><span class="chip role-critic">정은정</span></div>
      <h1 class="index-heading">정은정</h1>
      
      <div class="stat-row">
        <div class="stat"><span class="stat-num">2</span><span class="stat-label">수록 비평글</span></div>
        <div class="stat"><span class="stat-num">1</span><span class="stat-label">비평 대상 작가</span></div>
        <div class="stat"><span class="stat-num">2</span><span class="stat-label">활용 이론가</span></div>
      </div>
    </section>

    <section class="critic-profile-meta">
      <div class="meta-section">
        <h2 class="meta-label">주요 비평 대상</h2>
        <div class="chip-group"><span class="chip role-writer">김용택</span></div>
      </div>
      <div class="meta-section">
        <h2 class="meta-label">자주 활용한 이론가</h2>
        <div class="chip-group"><span class="chip chip-term">홍준표 (1)</span> <span class="chip chip-term">마스다 히로야 (1)</span></div>
      </div>
    </section>
    
    <section class="critic-mini-graph-section">
      <h2 class="section-label">관계망</h2>
      <div id="critic-mini-graph" class="critic-mini-graph"></div>
      <div class="mini-graph-legend">
        <span class="mini-legend-item"><span class="mini-dot dot-critic"></span>비평가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-essay"></span>비평글</span>
        <span class="mini-legend-item"><span class="mini-dot dot-writer"></span>작가</span>
        <span class="mini-legend-item"><span class="mini-dot dot-theorist"></span>이론가</span>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script>
    (function() {
      var graphData = {"nodes": [{"id": "cb5907", "label": "저밀도와 소멸위험, 농촌에 코로나 ‘이후’란 없다", "type": "essay", "year": "2020", "degree": 3}, {"id": "cb6175", "label": "웃을 일은 없지만 빙그레(내가 사는 곳①)", "type": "essay", "year": "2022", "degree": 2}, {"id": "cb6721", "label": "정은정 『밥은 먹고 다니냐는 말』", "type": "essay", "year": "2021", "degree": 4}, {"id": "cb7122", "label": "탈성장의 용기와 지구생활자의 미래", "type": "essay", "year": "2024", "degree": 8}, {"id": "cb7127", "label": "연대로 확장된 광장과 민주주의", "type": "essay", "year": "2025", "degree": 4}, {"id": "p-hong-junpyo", "label": "홍준표", "type": "theorist", "ref": "", "degree": 3, "lod": [], "en": ""}, {"id": "p-jeong-eunjeong", "label": "정은정", "type": "critic", "ref": "", "degree": 5, "lod": [], "en": ""}, {"id": "p-kim-yongtaek", "label": "김용택", "type": "writer", "ref": "https://www.wikidata.org/wiki/Q15220518 http://lod.nl.go.kr/resource/KAC201011796 https://isni.org/isni/0000000063809289 http://viaf.org/viaf/68008416", "degree": 7, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201011796", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q15220518", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}, {"id": "p-maseuda-hiroya", "label": "마스다 히로야", "type": "theorist", "ref": "https://www.wikidata.org/wiki/Q738197 http://lod.nl.go.kr/resource/KAC201518493 https://isni.org/isni/0000000374976279 http://viaf.org/viaf/251572269", "degree": 2, "lod": [{"href": "http://lod.nl.go.kr/resource/KAC201518493", "label": "NLK", "full": "NLK LOD", "bg": "#e8eef5", "fg": "#1a3a5a"}, {"href": "https://www.wikidata.org/wiki/Q738197", "label": "W", "full": "Wikidata", "bg": "", "fg": ""}], "en": ""}], "edges": [{"source": "cb6721", "target": "p-jeong-eunjeong", "type": "uses_theory", "weight": 1}, {"source": "cb7122", "target": "p-jeong-eunjeong", "type": "uses_theory", "weight": 1}, {"source": "cb7127", "target": "p-jeong-eunjeong", "type": "uses_theory", "weight": 1}, {"source": "p-jeong-eunjeong", "target": "cb5907", "type": "wrote", "weight": 1}, {"source": "p-jeong-eunjeong", "target": "cb6175", "type": "wrote", "weight": 1}, {"source": "cb5907", "target": "p-hong-junpyo", "type": "uses_theory", "weight": 1}, {"source": "cb5907", "target": "p-maseuda-hiroya", "type": "uses_theory", "weight": 1}, {"source": "cb6175", "target": "p-kim-yongtaek", "type": "subject_of", "weight": 1}]};
      var elements = [];
      graphData.nodes.forEach(function(n) {
        elements.push({ data: { id: n.id, label: n.label, type: n.type, degree: n.degree || 1 } });
      });
      graphData.edges.forEach(function(e) {
        elements.push({ data: { source: e.source, target: e.target, type: e.type, weight: e.weight || 1 } });
      });

      var TYPE_COLOR = {
        critic: '#e4b196',
        writer: '#a7beec',
        theorist: '#cab2e1',
        essay: '#89cdc4'
      };
      var TYPE_TEXT_COLOR = {
        critic: '#8a4b24',
        writer: '#2f4f9a',
        theorist: '#5f3f94',
        essay: '#1f6b62'
      };

      var cy = cytoscape({
        container: document.getElementById('critic-mini-graph'),
        elements: elements,
        style: [
          {
            selector: 'node',
            style: {
              'background-color': function(ele) { return TYPE_COLOR[ele.data('type')] || '#aaa'; },
              'label': 'data(label)',
              'font-family': 'Pretendard, sans-serif',
              'font-size': function(ele) { return ele.data('type') === 'essay' ? '10px' : '12px'; },
              'color': function(ele) { return TYPE_TEXT_COLOR[ele.data('type')] || '#333'; },
              'text-valign': 'bottom',
              'text-halign': 'center',
              'text-margin-y': '4px',
              'text-wrap': 'wrap',
              'text-max-width': '90px',
              'width': function(ele) {
                if (ele.data('type') === 'essay') return 60;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'height': function(ele) {
                if (ele.data('type') === 'essay') return 30;
                var d = ele.data('degree') || 1;
                return Math.min(Math.max(40 + d * 6, 40), 90);
              },
              'shape': function(ele) { return ele.data('type') === 'essay' ? 'round-rectangle' : 'ellipse'; },
              'border-width': 1.5,
              'border-color': 'rgba(0,0,0,0.15)',
              'transition-property': 'opacity',
              'transition-duration': '0.15s',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': function(ele) { return Math.min(Math.max((ele.data('weight') || 1) * 1.5, 1.5), 5); },
              'line-color': '#d7dbe2',
              'target-arrow-color': '#d7dbe2',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'opacity': 0.7,
            }
          },
          {
            selector: 'node.faded',
            style: { 'opacity': 0.15 }
          },
          {
            selector: 'edge.faded',
            style: { 'opacity': 0.05 }
          },
          {
            selector: 'node.highlighted',
            style: { 'border-width': 3, 'border-color': '#0f1115' }
          }
        ],
        layout: {
          name: 'cose',
          animate: false,
          randomize: false,
          nodeRepulsion: 8000,
          idealEdgeLength: 100,
          edgeElasticity: 200,
          gravity: 0.8,
          numIter: 1000,
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
      });

      // hover 강조
      cy.on('mouseover', 'node', function(e) {
        var node = e.target;
        cy.elements().addClass('faded');
        node.removeClass('faded').addClass('highlighted');
        node.neighborhood().removeClass('faded');
      });
      cy.on('mouseout', 'node', function() {
        cy.elements().removeClass('faded highlighted');
      });
    })();
    </script>
    <section class="essay-grid">
      <h2 class="section-label">수록 비평글 (2편)</h2>
      
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2020</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb5907.html">저밀도와 소멸위험, 농촌에 코로나 ‘이후’란 없다</a>
        </h3>
        <p class="essay-card-source">창작과비평 189호, 창비, 2020</p>
        <div class="essay-card-tags"><span class="tag">홍준표</span> <span class="tag">마스다 히로야</span></div>
      </article>
      <article class="essay-card">
        <div class="essay-card-meta">
          <span class="essay-card-year">2022</span>
        </div>
        <h3 class="essay-card-title">
          <a href="../essays/cb6175.html">웃을 일은 없지만 빙그레(내가 사는 곳①)</a>
        </h3>
        <p class="essay-card-source">창작과비평 195호, 창비, 2022</p>
        <div class="essay-card-tags"><span class="tag">김용택</span></div>
      </article>
    </section>
  </main>

  <script src="/kc-shell.js"></script>
</body>
</html>
